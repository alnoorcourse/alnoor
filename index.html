<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087f8c">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة النور</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6F5FF;--card:#FBFEFF;--tx:#0E1620;--tx2:#46586B;--ink:#0E1620;--teal:#1E6FD9;--tealS:#D3E9FF;--red:#F0432E;--redS:#FFD6CC;--sun:#56C8FF;--dsp:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0C131B;--card:#16212C;--tx:#E4F3FF;--tx2:#9DB4C8;--ink:#E4F3FF;--tealS:#123556;--redS:#4A1F18}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1.4px,transparent 1.6px);background-size:24px 24px;color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6;transition:background-color .15s,color .15s}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sun);border-bottom:3px solid #17140D;color:#17140D;--ink:#17140D;--card:#FFFDF6;--tx:#17140D}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:1100px;margin:auto}
.brand{display:flex;align-items:center;gap:8px;font:400 24px var(--dsp);margin-inline-end:auto;cursor:pointer}
.logo{width:34px;height:34px;border:3px solid #17140D;background:#fff;border-radius:10px;transform:rotate(-8deg);display:grid;place-items:center;color:var(--red);font-size:20px}
.ib,nav a{border:2px solid var(--ink);background:var(--card);color:var(--tx);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:6px 12px;font-size:14px;text-decoration:none}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;max-width:1100px;margin:auto}nav a{flex:none}
nav a.on{background:var(--ink);color:var(--sun)}
main{padding:18px max(14px,calc((100% - 1100px)/2)) 40px;min-height:80svh}
h1,h2,h3{font-family:var(--dsp);font-weight:400;margin:0 0 8px}h1{font-size:clamp(34px,7vw,58px);line-height:1.1}h2{font-size:26px;margin-top:26px}h3{font-size:22px}
.sub{color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:16px;box-shadow:6px 6px 0 var(--ink)}
.meta{color:var(--tx2);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.btn{border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:8px 16px;background:var(--red);color:#fff;font-weight:700}
.btn.t{background:var(--teal)}.btn.g{background:var(--card);color:var(--tx)}.btn:disabled{opacity:.55}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--sun);color:#17140D}.tag.r{background:var(--red);color:#fff}
.price{font-weight:700;color:var(--red)}.ig{color:var(--red);font-weight:700;text-decoration:none;unicode-bidi:isolate}
.ig-wrap{display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.hero{background:var(--sun);border:3px solid var(--ink);border-radius:26px;box-shadow:9px 9px 0 var(--ink);color:#17140D;padding:26px 22px;margin-bottom:18px}
.hero .sub{color:#3d3412}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stats div{background:#fff;border:2.5px solid #17140D;border-radius:12px;padding:6px 16px}.stats b{display:block;font:400 30px var(--dsp);color:var(--red)}
.prog-wrap{margin-top:12px;background:rgba(255,255,255,.72);border:2px solid #17140D;border-radius:12px;padding:8px 12px}
.prog-bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:6px;border:1px solid #17140D}
.prog-bar>i{display:block;height:100%;background:var(--teal);transition:width .25s}
.act-item{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
label{display:block;font-size:13px;color:var(--tx2)}
input,select,textarea{background:var(--card);border:2.5px solid var(--ink);border-radius:10px;padding:8px;min-width:0}label input{width:100%;margin:2px 0 8px}textarea{width:100%;min-height:90px}
.fld{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row input{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:start;border-bottom:2px solid var(--ink)}th{background:var(--sun);color:#17140D;font:400 16px var(--dsp)}.scroll{overflow-x:auto}
.av{width:104px;height:104px;object-fit:cover;background:var(--sun);color:#17140D;display:grid;place-items:center;font-size:14px;border:3px solid var(--ink);border-radius:38% 62% 55% 45%/48% 42% 58% 52%;box-shadow:4px 4px 0 var(--ink);margin:auto;overflow:hidden}
.crop-box{margin:10px auto;padding:12px;border:2px dashed var(--ink);border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,transparent);text-align:start}
.crop-stage{position:relative;width:150px;height:150px;margin:8px auto;border:3px solid var(--ink);border-radius:38% 62% 55% 45%/48% 42% 58% 52%;overflow:hidden;background:#0e1620;touch-action:none;user-select:none;cursor:grab}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;top:50%;left:50%;transform-origin:center;max-width:none;pointer-events:none}
.crop-sliders{display:grid;gap:6px;margin-top:8px}
.crop-sliders label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.crop-sliders input[type="range"]{flex:1;padding:0;border:0;background:transparent}
.qr{width:120px;height:120px;background:#fff;padding:6px;border-radius:8px;display:block;margin:8px 0}
.star{background:none;border:0;font-size:28px;color:#B8C4D0;padding:0 2px}.star.on{color:#F5A623}

/* ---------- غرفة ZOOM ALNOOR ---------- */
.z-wrap{background:#121316;border:3px solid #2a2c33;border-radius:24px;box-shadow:0 14px 36px rgba(0,0,0,.35);color:#f3f4f6;overflow:hidden;position:relative;display:flex;flex-direction:column}
.z-wrap.expanded{position:fixed;inset:0;z-index:60;border-radius:0;border:0;width:100vw;height:100svh;max-height:100svh;background:#090a0d}
.z-wrap.expanded .z-top,
.z-wrap.expanded .z-host-bar,
.z-wrap.expanded .z-hands-alert,
.z-wrap.expanded .z-side{display:none!important}
.z-wrap.expanded .z-body{flex:1;min-height:0;grid-template-columns:1fr!important}
.z-wrap.expanded .z-stage{min-height:0;height:100%;padding:8px;gap:6px}
.z-focus-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:#161922;border-bottom:1px solid #2b3040;border-radius:10px;width:100%}

.z-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#1b1d22;border-bottom:1px solid #2b2e36;flex-wrap:wrap}
.z-top-badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.z-dot{width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444}
.z-pill{background:#262932;border:1px solid #383c47;border-radius:999px;padding:4px 10px;font-size:12px;color:#cbd5e1}
.z-host-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 16px;background:#17202e;border-bottom:1px solid #26364d;font-size:12px;color:#bae6fd}
.z-hands-alert{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:#262111;border-bottom:1px solid #4d3f14;color:#fde68a;font-size:13px;align-items:center}
.z-hand-chip{display:inline-flex;align-items:center;gap:6px;background:#3a3012;border:1px solid #f59e0b;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fef3c7}
.z-body{display:grid;grid-template-columns:1fr;min-height:420px;position:relative}
.z-body.with-side{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:820px){.z-body.with-side{grid-template-columns:1fr}}
.z-stage{position:relative;background:#0d0e11;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;min-height:380px;gap:10px;overflow:hidden}
.z-stage.audio-only{background:radial-gradient(circle at center,#1f2330 0%,#0d0e11 75%)}
.z-empty{text-align:center;max-width:340px;margin:auto}
.z-empty h3{color:#fff;font-size:20px;margin-bottom:12px}
.z-empty-btn{display:block;width:100%;padding:10px 14px;margin-bottom:8px;border-radius:10px;border:1px solid #3b3f4c;background:#232630;color:#e5e7eb;font-weight:600}
.z-empty-btn:hover{background:#2d313e}
.z-media-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;width:100%;height:100%}
.z-tile{position:relative;background:#161820;border:2px solid #343848;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.z-tile.main-share{min-height:290px;flex:1}
.z-wrap.expanded .z-tile.main-share{min-height:0;height:100%;border-radius:12px}
.z-tile video,.z-tile img{width:100%;height:100%;max-height:66svh;object-fit:contain;background:#090a0d}
.z-wrap.expanded .z-tile video,.z-wrap.expanded .z-tile img{max-height:100%}
.z-tile.cam-tile video{object-fit:cover}
.z-doc-box{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:8px;overflow:hidden}
.z-doc-toolbar{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;background:#171a22;padding:6px 10px;border-radius:10px;border:1px solid #2d3240}
.z-pdf-wrap{width:100%;flex:1;min-height:0;overflow:auto;background:#111318;border:1px solid #383c49;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#z-pdf-canvas,.z-shared-page-img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:6px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45);object-fit:contain}
.z-slide-card{width:100%;height:100%;min-height:240px;background:linear-gradient(145deg,#1b1f2b,#12151e);border:1px solid #363c4d;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow:hidden}
.z-slide-lines{max-width:820px;width:100%;text-align:start;background:rgba(10,12,18,.65);border:1px solid #2d3344;border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;line-height:1.7;color:#f1f5f9;max-height:38svh;overflow-y:auto}
.z-avatar-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px}
.z-avatar-circle{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#1e6fd9);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.z-peers-strip{display:flex;flex-wrap:wrap;gap:8px;width:100%;justify-content:center}
.z-peer-card{background:#181b24;border:1px solid #343949;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:150px}
.z-peer-card video{width:112px;height:72px;border-radius:8px;object-fit:contain;background:#090a0d}
.z-meter{display:inline-flex;align-items:center;gap:6px;background:#1f222b;border:1px solid #343844;border-radius:999px;padding:4px 10px;font-size:12px}
.z-bar{width:64px;height:6px;background:#323642;border-radius:999px;overflow:hidden}
.z-bar>i{display:block;height:100%;width:0%;background:#22c55e;transition:width .06s linear}
.z-reactions-stack{position:absolute;top:10px;inset-inline-end:10px;display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none}
.z-reaction-pop{background:rgba(24,27,36,.94);border:1px solid #525a70;border-radius:999px;padding:5px 12px;font-size:14px;color:#fff;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.45)}

.z-popover{position:absolute;bottom:66px;inset-inline:12px;margin:auto;width:min(340px,calc(100% - 24px));background:#1e2028;border:1px solid #383c49;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.55);padding:10px;z-index:70;color:#f3f4f6}
.z-pop-handle{width:34px;height:4px;border-radius:999px;background:#4b5061;margin:0 auto 10px}
.z-pop-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:#f3f4f6;text-align:start;font-size:14px}
.z-pop-item:hover{background:#2a2d38}
.z-pop-item small{display:block;color:#9ca3af;font-size:11px}
.z-switch{width:38px;height:20px;border-radius:999px;background:#3f4454;position:relative;flex:none}
.z-switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.z-switch.on{background:#6366f1}.z-switch.on::after{transform:translateX(18px)}
.z-react-row{display:flex;align-items:center;justify-content:space-around;gap:6px;padding:4px 2px}
.z-react-btn{background:transparent;border:0;font-size:26px;padding:4px;border-radius:10px;transition:transform .12s}
.z-react-btn:hover{transform:scale(1.2);background:rgba(255,255,255,.08)}

.z-side{background:#181a20;border-inline-start:1px solid #2b2e36;display:flex;flex-direction:column;max-height:480px}
.z-side-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #2b2e36;font-weight:700;font-size:14px}
.z-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.z-msg{background:#232630;border-radius:12px;padding:8px 10px;font-size:13px}
.z-msg.admin-msg{border-inline-start:3px solid #38bdf8}
.z-msg b{display:block;color:#93c5fd;font-size:12px;margin-bottom:2px}
.z-chat-form{display:flex;gap:6px;padding:10px;border-top:1px solid #2b2e36;background:#15171c}
.z-chat-form input{flex:1;background:#242731;border:1px solid #3a3e4b;color:#fff;border-radius:10px;padding:7px 10px;font-size:13px}

.z-dock{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;background:#191b20;border-top:1px solid #2a2d36;flex-wrap:wrap;max-width:100%}
.z-divider{width:1px;height:28px;background:#323642;margin:0 4px}
.z-btn{min-width:42px;height:40px;padding:0 10px;border-radius:11px;border:1px solid transparent;background:#252832;color:#f3f4f6;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;transition:background .12s,transform .1s}
.z-btn:hover{background:#323644}
.z-btn.on{background:#3b3f54;border-color:#818cf8;color:#c7d2fe}
.z-btn.off{background:#7f1d1d;border-color:#ef4444;color:#fecaca}
.z-btn.hang{background:#be123c;border-color:#f43f5e;color:#fff;padding:0 14px;border-radius:12px}
.z-btn.hang:hover{background:#9f1239}
.z-caption-bar{padding:8px 14px;background:#1e212b;border-top:1px solid #2e3240;font-size:13px;color:#e5e7eb;text-align:center}

.nl{min-height:70svh;display:grid;place-items:center}.nlc{width:100%;max-width:400px;background:#121212;border:3px solid var(--sun);border-radius:18px;box-shadow:8px 8px 0 var(--red);padding:2rem;color:#fff;text-align:center}
.nlc p{color:#9a9a9a;font-size:.9rem;margin:0 0 14px}.nlc input{width:100%;background:#000;color:#fff;border:1px solid #333;margin-bottom:10px}
.nlb{width:100%;padding:.7rem;border-radius:8px;border:1px solid #333;background:transparent;color:#fff;font-weight:500;margin-bottom:8px}.nlb.main{background:var(--sun);color:#0E1620;border:0;font-weight:700}
details{margin-top:16px;color:#9a9a9a}summary{cursor:pointer;margin-bottom:10px}
.at{max-width:760px;display:grid;gap:12px}.atb{display:flex;gap:6px;flex-wrap:wrap;padding:5px;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.atb button{border:0;background:none;padding:8px 14px;border-radius:11px;font-weight:700;font-size:14px}.atb button.on{background:var(--ink);color:var(--sun)}
.atc{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:center;padding:16px 16px 22px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;min-height:200px}
.atm{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;border:2px solid var(--ink)}.atm img,.atm video{width:100%;height:100%;object-fit:cover;display:block}.atm2{position:absolute;bottom:8px;inset-inline-end:8px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;padding:4px 10px}
.atx h2{margin:0 0 8px;font-size:30px}.atx p{margin:0;color:var(--tx2);white-space:pre-wrap;font-size:16px;line-height:1.7}
.atg{position:absolute;left:0;right:0;bottom:0;height:6px;background:color-mix(in srgb,var(--ink) 12%,transparent)}.atg b{display:block;height:100%;width:0;background:var(--red)}
.warn{background:var(--redS);border:2.5px solid var(--red);border-radius:12px;padding:10px 14px;margin-bottom:14px}
footer{background:var(--ink);color:var(--bg);text-align:center;padding:18px 14px;font-size:14px}footer a{color:var(--sun);font-weight:700;text-decoration:none}
#toast{position:fixed;inset-inline:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:440px;margin:auto;background:#17140D;color:var(--sun);border:2px solid var(--sun);border-radius:12px;padding:10px 16px;text-align:center;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Medical learning: quiet teal, readable surfaces, clear device states. */
:root{--bg:#eef7f7;--card:#fff;--teal:#087f8c;--tealS:#d9f2ef;--red:#d44949;--redS:#ffe5e5;--sun:#bdebe4}
:root[data-theme="dark"]{--bg:#0b1b24;--card:#132c35;--teal:#39b9b1;--tealS:#164449;--sun:#86ddd0}
body{background-image:radial-gradient(color-mix(in srgb,var(--teal) 9%,transparent) 1px,transparent 1px);background-size:26px 26px}
header{background:var(--card);border-bottom:1px solid #a6cecc;color:var(--tx);--ink:var(--tx)}
.brand{color:var(--teal)}.logo{transform:none;border:0;background:var(--tealS);color:var(--teal);border-radius:12px}
.card,.atc{border:1px solid color-mix(in srgb,var(--teal) 22%,transparent);box-shadow:0 6px 28px #095b6310}
.ib,nav a,.btn{border-width:1px;box-shadow:none}.btn{min-height:42px}.btn.t{background:var(--teal)}
nav a.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.z-wrap{border:1px solid #2c5962;border-radius:20px;background:#0d202b;box-shadow:0 16px 44px #052c3920}
.z-top,.z-dock{background:#102c37}.z-stage{background:radial-gradient(ellipse at top,#163b46,#0b1c27)}
.z-side{background:#112b35}.z-top-badge{flex-wrap:wrap}.z-top{flex-wrap:wrap}
.z-health-strip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#143b43;color:#d1f5ef;font-size:12px}
.z-health-strip .z-btn{height:auto;min-height:32px;font-size:12px;padding:5px 9px}
#z-duration{font-variant-numeric:tabular-nums;direction:ltr;margin-inline-start:auto}
.z-msg span{white-space:pre-wrap;overflow-wrap:anywhere}.z-dock{flex-wrap:wrap}
.device-dialog{width:min(620px,94vw);max-height:90dvh;overflow:auto;border:1px solid #6bafaa;border-radius:22px;padding:24px;background:var(--card);color:var(--tx);box-shadow:0 20px 90px #0005}
.device-dialog::backdrop{background:#061c27b8}.device-dialog video{width:100%;max-height:230px;background:#102a34;border-radius:12px;object-fit:contain}
.device-dialog .device-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.device-dialog select{width:100%;margin-bottom:10px}

function mediaErrorMsg(err,kind="both"){
  const dev=kind==="mic"?A("المايكروفون","microphone"):kind==="cam"?A("الكاميرا","camera"):A("المايكروفون أو الكاميرا","microphone or camera");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    return A(`المتصفح لا يدعم الوصول إلى ${dev} في هذا الاتصال (تأكد من فتح الصفحة عبر HTTPS).`,`Your browser does not support ${dev} access here (use HTTPS).`);
  }
  const name=err?.name||"";
  if(name==="NotAllowedError"||name==="PermissionDeniedError"){
    return A(`تم منع الوصول إلى ${dev} من المتصفح أو إعدادات النظام. افتح إعدادات الموقع/الجهاز واسمح باستخدام ${dev} ثم أعد المحاولة.`,`Access to ${dev} was blocked by the browser or system settings. Allow ${dev} in site/system settings and try again.`);
  }
  if(name==="NotFoundError"||name==="DevicesNotFoundError"){
    return A(`لم يتم العثور على ${dev} متصل بالجهاز.`,`No ${dev} was found on this device.`);
  }
  if(name==="NotReadableError"||name==="TrackStartError"){
    return A(`تعذر تشغيل ${dev} لأنه مستخدم في تطبيق أو تبويب آخر. أغلق التطبيقات الأخرى وأعد المحاولة.`,`${dev} is busy in another app or tab. Close other apps using it and try again.`);
  }
  if(name==="OverconstrainedError"||name==="ConstraintNotSatisfiedError"){
    return A(`إعدادات الجودة المطلوبة غير مدعومة على ${dev}، جرّب جودة أقل.`,`Requested quality is not supported by ${dev}; try a lower resolution.`);
  }
  return A(`تعذر الوصول إلى ${dev}: تحقق من صلاحيات المتصفح والنظام وتوصيل الجهاز.`,`Could not access ${dev}: check browser/system permissions and device connection.`);
}

function compressToDataUrl(file,maxW,maxH,maxLen){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type)||/svg/.test(file.type))return rej(new Error(A("اختر صورة صحيحة","Choose a valid image")));
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,maxW/w,maxH/h);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const c=document.createElement("canvas");let q=.86,out="";
    (function step(){c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);out=c.toDataURL("image/jpeg",q);
      if(out.length<=maxLen||q<=.4){if(out.length>maxLen&&w>640){w=Math.round(w*.78);h=Math.round(h*.78);q=.72;step()}else{URL.revokeObjectURL(u);res(out)}}else{q-=.14;step()}})()};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error(A("تعذر قراءة الصورة","Cannot read image")))};im.src=u})}

function readVideoDataUrl(file,maxLen=720000){return new Promise((res,rej)=>{
  if(!file||!/^video\//.test(file.type))return rej(new Error(A("اختر ملف فيديو صحيحاً","Choose a valid video file")));
  const r=new FileReader();
  r.onload=()=>{const out=String(r.result||"");if(out.length>maxLen)return rej(new Error(A("حجم الفيديو كبير جداً للحفظ المباشر","Video too large for direct save")));res(out)};
  r.onerror=()=>rej(new Error(A("تعذر قراءة الفيديو","Cannot read video")));
  r.readAsDataURL(file);
})}

function renderCroppedAvatar(cr,outSize=260){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=outSize;c.height=outSize;const ctx=c.getContext("2d");const stagePx=150,ratio=outSize/stagePx;const baseScale=Math.max(stagePx/im.width,stagePx/im.height);const totalScale=baseScale*(cr.zoom||1)*ratio;const drawW=im.width*totalScale,drawH=im.height*totalScale;ctx.drawImage(im,(outSize-drawW)/2+(cr.x||0)*ratio,(outSize-drawH)/2+(cr.y||0)*ratio,drawW,drawH);let q=.84,out=c.toDataURL("image/jpeg",q);while(out.length>220000&&q>.4){q-=.1;out=c.toDataURL("image/jpeg",q)}res(out)};im.onerror=()=>rej(new Error(A("تعذر قص الصورة","Failed to crop image")));im.src=cr.src})}

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function qr(seed){let s="",h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;for(let y=0;y<11;y++)for(let x=0;x<11;x++){const f=(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);h=(h*1103515245+12345)>>>0;if(f||(h>>16)&1)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return`<svg class="qr" viewBox="0 0 11 11" fill="#000" role="img" aria-label="QR">${s}</svg>`}

async function loadPdfJs(){
  if(pdfjsLibCache)return pdfjsLibCache;

async function loadJsZip(){

function canvasToFastSyncedImage(canvas,maxLen=560000,maxDim=1120,quality=0.72){
  if(!canvas||!canvas.width||!canvas.height)return"";
  const tmp=document.createElement("canvas");
  let w=canvas.width,h=canvas.height;
  if(w>maxDim||h>maxDim){
    const k=Math.min(maxDim/w,maxDim/h);
    w=Math.max(1,Math.round(w*k));
    h=Math.max(1,Math.round(h*k));
  }
  tmp.width=w;tmp.height=h;
  tmp.getContext("2d").drawImage(canvas,0,0,w,h);
  let out=tmp.toDataURL("image/jpeg",quality);
  if(out.length>maxLen){
    const s2=document.createElement("canvas");
    s2.width=Math.max(1,Math.round(w*0.75));
    s2.height=Math.max(1,Math.round(h*0.75));
    s2.getContext("2d").drawImage(tmp,0,0,s2.width,s2.height);
    out=s2.toDataURL("image/jpeg",Math.max(0.45,quality-0.1));
  }
  return out.length<=740000?out:"";
}

function captureActiveVideoFrame(){
  const vidEl=ZS.scr?$("zsv"):((ZS.sharedType==="video"&&ZS.vidEl)||$("zsv"));
  if(!vidEl||vidEl.readyState<2||!vidEl.videoWidth||!vidEl.videoHeight)return"";
  const c=document.createElement("canvas");
  c.width=vidEl.videoWidth;
  c.height=vidEl.videoHeight;
  c.getContext("2d").drawImage(vidEl,0,0,c.width,c.height);
  return canvasToFastSyncedImage(c,420000,960,0.62);
}

async function prefetchPdfPage(pageNum){
  if(!ZS.pdfDoc||pageNum<1||pageNum>ZS.pdfNumPages)return;
  if(pdfPageCache.has(pageNum)||pdfPrefetching.has(pageNum))return;
  pdfPrefetching.add(pageNum);
  try{
    const page=await ZS.pdfDoc.getPage(pageNum);
    const viewport=page.getViewport({scale:1.35});
    const c=document.createElement("canvas");
    c.width=Math.round(viewport.width);
    c.height=Math.round(viewport.height);
    await page.render({canvasContext:c.getContext("2d"),viewport}).promise;
    const dataUrl=st.adm?canvasToFastSyncedImage(c):"";
    if(typeof createImageBitmap==="function"){
      const bmp=await createImageBitmap(c);
      pdfPageCache.set(pageNum,{w:c.width,h:c.height,bmp,dataUrl});
    }
  }catch(e){}finally{
    pdfPrefetching.delete(pageNum);
  }
}

async function renderPdfPageToCanvas(pageNum,shouldSync=false){
  const canvas=$("z-pdf-canvas");
  if(!canvas||!ZS.pdfDoc)return;
  const safePage=Math.max(1,Math.min(ZS.pdfNumPages||1,pageNum||1));
  ZS.pdfPage=safePage;
  const lbl=$("z-pdf-page-lbl");
  if(lbl)lbl.textContent=`${ZS.pdfPage} / ${ZS.pdfNumPages}`;

  const cached=pdfPageCache.get(safePage);
  if(cached){
    canvas.width=cached.w;
    canvas.height=cached.h;
    canvas.getContext("2d").drawImage(cached.bmp,0,0);
    if(st.adm){
      const imgUrl=cached.dataUrl||canvasToFastSyncedImage(canvas);
      ZS.pageDataUrl=imgUrl;
      if(shouldSync)syncStageToCloud({pdfPage:ZS.pdfPage,pdfNumPages:ZS.pdfNumPages,pageDataUrl:ZS.pageDataUrl});
    }
    prefetchPdfPage(safePage+1);
    prefetchPdfPage(safePage-1);
    return;
  }

  if(ZS.pdfRendering)return;
  ZS.pdfRendering=true;
  try{
    const page=await ZS.pdfDoc.getPage(safePage);
    const viewport=page.getViewport({scale:1.35});
    const ctx=canvas.getContext("2d");
    canvas.width=Math.round(viewport.width);
    canvas.height=Math.round(viewport.height);
    await page.render({canvasContext:ctx,viewport}).promise;
    const dataUrl=st.adm?canvasToFastSyncedImage(canvas):"";
    if(typeof createImageBitmap==="function"){
      createImageBitmap(canvas).then(bmp=>{
        pdfPageCache.set(safePage,{w:canvas.width,h:canvas.height,bmp,dataUrl});
      }).catch(()=>{});
    }
    if(st.adm){
      ZS.pageDataUrl=dataUrl;
      if(shouldSync)syncStageToCloud({pdfPage:ZS.pdfPage,pdfNumPages:ZS.pdfNumPages,pageDataUrl:ZS.pageDataUrl});
    }
    prefetchPdfPage(safePage+1);
    prefetchPdfPage(safePage-1);
  }catch(e){
    console.error(e);
  }finally{
    ZS.pdfRendering=false;
  }
}

async function parsePptxSlides(file){
  const JSZip=await loadJsZip();
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const slideFiles=Object.keys(zip.files)
    .filter(n=>/^ppt\/slides\/slide\d+\.xml$/i.test(n))
    .sort((a,b)=>{
      const na=parseInt((a.match(/slide(\d+)\.xml/i)||[])[1]||"0",10);
      const nb=parseInt((b.match(/slide(\d+)\.xml/i)||[])[1]||"0",10);
      return na-nb;
    });
  if(!slideFiles.length)return[];
  const parser=new DOMParser();
  const slides=[];
  for(let i=0;i<slideFiles.length;i++){
    const xmlStr=await zip.files[slideFiles[i]].async("string");
    const xmlDoc=parser.parseFromString(xmlStr,"application/xml");
    const paragraphs=[...xmlDoc.getElementsByTagNameNS("*","p")];
    const lines=paragraphs.map(p=>{
      const runs=[...p.getElementsByTagNameNS("*","t")].map(t=>t.textContent||"").join("");
      return runs.trim();
    }).filter(Boolean);
    slides.push({
      index:i+1,
      text:lines.length?lines.join("\n"):A("شريحة مرئية","Visual slide")
    });
  }
  return slides;
}

function tuneSender(s,role){

    p.encodings[0].maxBitrate={mic:40000,sys:96000,cam:600000,screen:1400000}[role];
    s.setParameters(p).catch(()=>{});

async function applyTracks(c){

    if(s.track===t)return;
    if(t&&role==="screen"&&t.kind==="video")t.contentHint="detail";
    if(t&&role==="sys")t.contentHint="music";
    try{await s.replaceTrack(t);tuneSender(s,role)}catch(e){console.error(e)}
  }));

function syncAudioElements(){

      if(!el){el=document.createElement("audio");el.dataset.k=k;el.autoplay=true;el.setAttribute("playsinline","");h.appendChild(el)}

function rememberChat(message){
  if(!ZS.joined||message.roomId!==ZS.roomId||typeof message.text!=="string")return false;
  if(!message.id||typeof message.id!=="string"||ZS.chatSeen.has(message.id))return false;
  if(Math.abs(Date.now()-Number(message.ts))>60000||!Number.isFinite(Number(message.ts)))return false;
  ZS.chatSeen.add(message.id);
  if(ZS.chatSeen.size>1000)ZS.chatSeen=new Set(ZS.msgs.map(m=>m.id));
  ZS.msgs.push({id:message.id,text:message.text.slice(0,1500),who:String(message.who||"").slice(0,100),isAdmin:!!message.isAdmin,ts:message.ts});
  ZS.msgs=ZS.msgs.slice(-120);renderChatPanel();return true;
}
function renderChatPanel(){
  const box=document.querySelector(".z-side .z-msgs");
  if(ZS.side==="chat"&&box){
    box.innerHTML=ZS.msgs.map(m=>`<div class="z-msg${m.isAdmin?" admin-msg":""}"><b>${esc(m.who)}</b><span>${esc(m.text)}</span></div>`).join("");
    box.scrollTop=box.scrollHeight;
  }
}
function setupChatChannel(c,channel){
  c.chat=channel;
  channel.onmessage=ev=>{
    if(typeof ev.data!=="string"||ev.data.length>10000)return;
    try{
      const m=JSON.parse(ev.data);
      if(!st.adm&&!c.isAdmin)return;
      if(st.adm){m.who=c.name||A("طالب","Student");m.isAdmin=c.isAdmin}
      if(rememberChat(m)&&st.adm)relayChat(m,c.uid);
    }catch(e){}
  };
}
function relayChat(message,except=""){
  let sent=0;
  const data=JSON.stringify(message);
  ZS.peers.forEach(c=>{
    if(c.uid===except||c.chat?.readyState!=="open"||c.chat.bufferedAmount>262144)return;
    try{c.chat.send(data);sent++}catch(e){}
  });
  return sent;
}
async function sendEphemeralChat(text){
  if(!ZS.joined)throw new Error(A("ادخل المحاضرة أولًا","Join the lecture first"));
  const message={id:crypto.randomUUID(),roomId:ZS.roomId,text:text.slice(0,1500),who:displayName(),isAdmin:!!st.adm,ts:Date.now()};
  if(useSFU()){
    if(!ZS.sfu||ZS.sfu.state!=="connected")throw new Error(A("انتظر اتصال خادم البث","Wait for the media server connection"));
    await ZS.sfu.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(message)),{reliable:true,topic:"alnoor-live-chat"});
  }else if(!relayChat(message)){
    throw new Error(A("لا يوجد اتصال مباشر جاهز لإرسال الرسالة بعد","No direct connection is ready to receive this message"));
  }
  rememberChat(message);
}

      const stream=ZS.cam?.active?new MediaStream(ZS.cam.getVideoTracks().map(t=>t.clone())):await navigator.mediaDevices.getUserMedia({video:deviceChoice.cam?{deviceId:{exact:deviceChoice.cam},width:{ideal:640}}:{width:{ideal:640}},audio:false});
      if(epoch!==deviceTest.epoch){stream.getTracks().forEach(t=>t.stop());return}
      deviceTest.streams.push(stream);$("device-preview").srcObject=stream;await $("device-preview").play();
      status(A("الكاميرا تعمل؛ هذه معاينة محلية وليست تأكيد وصولها للطلاب.","Camera works locally; this preview does not confirm delivery to students."));await list();
    }catch(e){status(mediaErrorMsg(e,"cam"))}
  };
  $("device-start-mic").onclick=async e=>{
    const button=e.currentTarget;button.disabled=true;
    try{
      const stream=ZS.micStream?.active?new MediaStream(ZS.micStream.getAudioTracks().map(t=>{const clone=t.clone();clone.enabled=true;return clone})):await navigator.mediaDevices.getUserMedia({audio:deviceChoice.mic?{deviceId:{exact:deviceChoice.mic},echoCancellation:true}:{echoCancellation:true},video:false});
      if(epoch!==deviceTest.epoch){stream.getTracks().forEach(t=>t.stop());return}
      deviceTest.streams.push(stream);
      await deviceTest.ctx?.close();deviceTest.ctx=new AudioContext();await deviceTest.ctx.resume();
      const analyser=deviceTest.ctx.createAnalyser();analyser.fftSize=256;deviceTest.ctx.createMediaStreamSource(stream).connect(analyser);
      const samples=new Uint8Array(analyser.frequencyBinCount);let peak=0;
      const meter=()=>{if(epoch!==deviceTest.epoch)return;analyser.getByteTimeDomainData(samples);let sum=0;for(const x of samples)sum+=(x-128)**2;const level=Math.min(100,Math.sqrt(sum/samples.length)*4);peak=Math.max(peak,level);if($("device-level"))$("device-level").value=level;deviceTest.raf=requestAnimationFrame(meter)};meter();
      status(A("احكِ الآن لمدة 3 ثوانٍ…","Speak now for 3 seconds…"));
      if(!window.MediaRecorder)throw new Error("Recorder unavailable");
      const chunks=[],recorder=new MediaRecorder(stream);deviceTest.recorder=recorder;
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      recorder.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());cancelAnimationFrame(deviceTest.raf);
        if(epoch!==deviceTest.epoch)return;
        if(deviceTest.url)URL.revokeObjectURL(deviceTest.url);
        deviceTest.url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));
        const audio=$("device-playback");audio.src=deviceTest.url;audio.style.display="block";
        status(peak>2?A("وصلت إشارة صوتية. اضغط تشغيل التسجيل لتسمع وضوحه.","Audio signal detected. Play the recording to check clarity."):A("المايك مسموح لكن الإشارة ضعيفة أو صامتة؛ افحص اختيار الجهاز وكتم النظام.","Mic allowed but signal is weak or silent; check selected input and system mute."));
        button.disabled=false;list().catch(()=>{});
      };
      recorder.start();deviceTest.timer=setTimeout(()=>{if(recorder.state==="recording")recorder.stop()},3000);
    }catch(e){button.disabled=false;status(mediaErrorMsg(e,"mic"))}
  };
  $("device-tone").onclick=async()=>{
    const ctx=new AudioContext();await ctx.resume();const oscillator=ctx.createOscillator(),gain=ctx.createGain();gain.gain.value=.06;oscillator.frequency.value=440;oscillator.connect(gain).connect(ctx.destination);oscillator.start();oscillator.stop(ctx.currentTime+.45);oscillator.onended=()=>ctx.close();
    status(A("إذا سمعت النغمة فالسماعة المحلية تعمل؛ يلزم طرف ثانٍ لتأكيد البث.","If you heard the tone your local speaker works; a second participant is needed to verify streaming."));
  };
  await list().catch(()=>status(A("تعذر تعداد الأجهزة. تحقق من HTTPS والصلاحيات.","Cannot list devices. Check HTTPS and permissions.")));
}

/* محول SFU: لا يوجد رجوع صامت إلى P2P عند تعطل الخدمة. */
async function connectSfu(){
  if(!useSFU()||ZS.sfu||ZS.sfuConnecting||!ZS.joined)return;
  const endpoint=new URL(CONFERENCE.tokenEndpoint,location.href);
  if(endpoint.protocol!=="https:")throw new Error(A("رابط خادم الرموز يجب أن يستخدم HTTPS","Token endpoint must use HTTPS"));
  const epoch=ZS.sfuEpoch;ZS.sfuConnecting=true;
  let room;
  try{
    const idToken=await st.user.getIdToken();
    const response=await fetch(endpoint.href,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},body:JSON.stringify({roomId:ZS.roomId}),cache:"no-store",signal:AbortSignal.timeout(20000)});
    if(!response.ok)throw new Error(A("رفض خادم البث الدخول؛ تحقق من العضوية والصلاحيات","Media server denied entry; verify membership and permissions"));
    const access=await response.json();
    if(typeof access.url!=="string"||!access.url.startsWith("wss://")||typeof access.token!=="string")throw new Error(A("استجابة خادم البث غير صالحة","Invalid media server response"));
    const LK=ZS.sfuModule=await import(CONFERENCE.sdkUrl);
    if(!ZS.joined||epoch!==ZS.sfuEpoch)return;
    /* عناصر العرض تستخدم srcObject، لذلك لا نفعل adaptiveStream الذي يحتاج track.attach(). */
    room=new LK.Room({adaptiveStream:false,dynacast:true,videoCaptureDefaults:{resolution:{width:1280,height:720,frameRate:24}},publishDefaults:{simulcast:true,videoEncoding:{maxBitrate:900000,maxFramerate:24},screenShareEncoding:{maxBitrate:1500000,maxFramerate:15}}});
    ZS.sfu=room;
    const updateSubscriptions=()=>{
      for(const participant of room.remoteParticipants.values()){
        let host=false;try{host=JSON.parse(participant.metadata||"{}").role==="admin"}catch(e){}
        for(const publication of participant.trackPublications.values()){
          /* لا ننزل 300 كاميرا: صورة الإدارة فقط، وصوت الطلاب للإدارة. */
          publication.setSubscribed(host||(st.adm&&publication.kind==="audio"));
        }
      }
    };
    const updateParticipants=()=>{
      if(ZS.sfu!==room||!ZS.joined)return;
      const presence={};
      for(const participant of [room.localParticipant,...room.remoteParticipants.values()]){
        let isAdmin=false;try{isAdmin=JSON.parse(participant.metadata||"{}").role==="admin"}catch(e){}
        presence[participant.identity]={uid:participant.identity,name:participant.name||A("مشارك","Participant"),isAdmin,active:true,lastSeen:Date.now(),roomId:ZS.roomId};
      }
      ZS.presence=presence;updateSubscriptions();scheduleRtcRedraw();
    };
    room.on(LK.RoomEvent.ParticipantConnected,updateParticipants);
    room.on(LK.RoomEvent.TrackPublished,updateSubscriptions);
    room.on(LK.RoomEvent.ParticipantMetadataChanged,updateParticipants);
    room.on(LK.RoomEvent.TrackSubscribed,(track,publication,participant)=>{
      const S=LK.Track.Source;
      const role=publication.source===S.Microphone?"mic":publication.source===S.Camera?"cam":publication.source===S.ScreenShare?"screen":"sys";
      const info=ZS.remoteStreams.get(participant.identity)||{name:participant.name||A("مشارك","Participant"),streams:{}};
      /* الخادم وحده يحدد role في metadata؛ لا يقبل الدور من طلب العميل. */
      try{info.isAdmin=JSON.parse(participant.metadata||"{}").role==="admin"}catch(e){info.isAdmin=false}
      info.streams[role]=new MediaStream([track.mediaStreamTrack]);
      ZS.remoteStreams.set(participant.identity,info);syncAudioElements();scheduleRtcRedraw();
    });
    room.on(LK.RoomEvent.TrackUnsubscribed,(track,publication,participant)=>{
      const info=ZS.remoteStreams.get(participant.identity);
      if(info)for(const role of Object.keys(info.streams)){if(info.streams[role].getTracks().includes(track.mediaStreamTrack))delete info.streams[role]}
      syncAudioElements();scheduleRtcRedraw();
    });
    room.on(LK.RoomEvent.ParticipantDisconnected,p=>{ZS.remoteStreams.delete(p.identity);syncAudioElements();updateParticipants()});
    room.on(LK.RoomEvent.DataReceived,(payload,participant,kind,topic)=>{
      if(topic!=="alnoor-live-chat"||!participant||payload.byteLength>10000)return;
      try{
        const m=JSON.parse(new TextDecoder().decode(payload));
        m.who=participant.name||A("مشارك","Participant");m.isAdmin=JSON.parse(participant.metadata||"{}").role==="admin";
        rememberChat(m);
      }catch(e){}
    });
    room.on(LK.RoomEvent.Reconnecting,()=>zs(A("جارٍ إعادة الاتصال…","Reconnecting…")));
    room.on(LK.RoomEvent.Reconnected,()=>{syncSfuTracks();syncAudioElements();scheduleRtcRedraw()});
    room.on(LK.RoomEvent.Disconnected,()=>{
      if(ZS.sfu!==room)return;
      ZS.sfu=null;ZS.sfuTracks.clear();ZS.remoteStreams.clear();syncAudioElements();scheduleRtcRedraw();
      if(ZS.joined)toast(A("انقطع البث. اضغط إعادة الاتصال.","Media disconnected. Press reconnect."));
    });
    await room.connect(access.url,access.token,{autoSubscribe:false});
    if(!ZS.joined||epoch!==ZS.sfuEpoch){await room.disconnect();return}
    updateParticipants();await syncSfuTracks();scheduleRtcRedraw();
  }catch(e){
    if(room){if(ZS.sfu===room)ZS.sfu=null;await room.disconnect().catch(()=>{})}
    throw new Error(A("تعذر الاتصال بخادم البث. تحقق من الخادم والصلاحيات والشبكة.","Could not connect to the media server. Check server, permissions and network."));
  }finally{if(epoch===ZS.sfuEpoch)ZS.sfuConnecting=false}
}
let sfuSyncQueue=Promise.resolve();
function syncSfuTracks(){
  sfuSyncQueue=sfuSyncQueue.catch(()=>{}).then(async()=>{
    const room=ZS.sfu,LK=ZS.sfuModule;
    if(!room||room.state!=="connected"||!LK)return;
    const sources={mic:LK.Track.Source.Microphone,cam:LK.Track.Source.Camera,screen:LK.Track.Source.ScreenShare,sys:LK.Track.Source.ScreenShareAudio};
    const wanted=desiredTracks();
    for(const role of Object.keys(sources)){
      const old=ZS.sfuTracks.get(role),next=wanted[role];
      if(old?.mediaStreamTrack===next)continue;
      if(old){await room.localParticipant.unpublishTrack(old,false);ZS.sfuTracks.delete(role)}
      if(next&&ZS.joined&&room===ZS.sfu){
        const publication=await room.localParticipant.publishTrack(next,{source:sources[role],name:role,simulcast:role==="cam"});
        ZS.sfuTracks.set(role,publication.track);
      }
    }
    syncSfuPermissions();
  });
  return sfuSyncQueue;
}
function syncSfuPermissions(){
  if(!st.adm&&!ZS.roomCtrl.allowMic)ZS.micStream?.getAudioTracks().forEach(t=>t.enabled=false);
}

const MESH=false; /* وضع احتياطي صغير: طالب ↔ إدارة. محاضرة 300 تحتاج SFU. */
/* المتصل (caller) دائماً الإدارة، وبين طالبين الأصغر uid. هيك ما في تعارض عروض (glare) */
const imCaller=(uid,peerAdmin)=>st.adm?true:(peerAdmin?false:st.user.uid<uid);
const newId=()=>Math.random().toString(36).slice(2,10);

async function sendRtcSignal(c,type,data){
  if(!db||!st.user||!c)return;
  try{
    if(!ZS.joined||!ZS.roomId)return;
    await addDoc(collection(db,"zoom_rtc"),{roomId:ZS.roomId,from:st.user.uid,fromName:displayName(),fromAdmin:!!st.adm,fromSid:ZS.sid,to:c.uid,toSid:c.sid||"",cid:c.cid,type,data:JSON.stringify(data),ts:Date.now()});
  }catch(e){
    console.error(e);
    if(!ZS.sigErr){ZS.sigErr=1;toast("⚠️ "+A("تعذر إرسال إشارات الاتصال: افتح قواعد Firestore واسمح بـ zoom_rtc","Cannot send signaling: allow zoom_rtc in Firestore rules"))}
  }
}

function makePeer(uid,name,isAdmin,sid,cid,caller){
  const pc=new RTCPeerConnection(RTC_CFG);
  const c={pc,uid,sid:sid||"",cid,caller:!!caller,name:name||"",isAdmin:!!isAdmin,pending:[],q:Promise.resolve(),born:Date.now(),tr:{},makingOffer:false};
  ZS.peers.set(uid,c);
  if(caller)setupChatChannel(c,pc.createDataChannel("alnoor-ephemeral",{ordered:true}));
  pc.ondatachannel=ev=>{if(ev.channel.label==="alnoor-ephemeral")setupChatChannel(c,ev.channel)};
  /* المستقبِل لا ينشئ transceivers قبل العرض: المتصفح ينشئها من SDP.
     إنشاؤها مسبقًا ينتج مسارات إضافية غير متفاوض عليها وصوتًا صامتًا. */
  if(caller){
    RTC_ROLES.forEach(([role,kind])=>{c.tr[role]=pc.addTransceiver(kind,{direction:"sendrecv"})});
    applyTracks(c);
  }
  pc.onicecandidate=ev=>{if(ev.candidate)sendRtcSignal(c,"ice",ev.candidate.toJSON())};
  pc.onnegotiationneeded=async()=>{
    if(!c.caller||c.makingOffer||pc.signalingState!=="stable")return;
    c.makingOffer=true;
    try{await pc.setLocalDescription();await sendRtcSignal(c,"desc",pc.localDescription.toJSON())}
    catch(e){console.error(e)}finally{c.makingOffer=false}
  };
  pc.ontrack=ev=>{
    if(!ZS.joined||ZS.peers.get(uid)!==c)return;
    const role=Object.keys(c.tr).find(r=>c.tr[r]===ev.transceiver)||RTC_ROLES[pc.getTransceivers().indexOf(ev.transceiver)]?.[0];
    if(!role)return;
    const info=ZS.remoteStreams.get(uid)||{streams:{}};
    info.name=c.name;info.isAdmin=c.isAdmin;
    info.streams[role]=new MediaStream([ev.track]);
    ZS.remoteStreams.set(uid,info);
    ev.track.onunmute=()=>{syncAudioElements();scheduleRtcRedraw()};
    ev.track.onended=()=>{delete info.streams[role];syncAudioElements();scheduleRtcRedraw()};
    syncAudioElements();scheduleRtcRedraw();
  };
  pc.oniceconnectionstatechange=()=>{
    if(pc.iceConnectionState==="failed"&&c.caller){try{pc.restartIce()}catch(e){}}
  };
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==="connected"){Object.keys(c.tr).forEach(r=>tuneSender(c.tr[r].sender,r));syncAudioElements()}
    scheduleRtcRedraw();
    if((s==="failed"||s==="closed")&&ZS.peers.get(uid)===c){closePeer(uid);setTimeout(connectToPresentPeers,2000)}
  };
  return c;
}

async function handleSignal(c,d,data){
  const pc=c.pc;
  try{
    if(d.type==="desc"){
      await pc.setRemoteDescription(data);
      for(const cand of c.pending.splice(0))await pc.addIceCandidate(cand).catch(()=>{});
      if(data.type==="offer"){
        const transceivers=pc.getTransceivers();
        RTC_ROLES.forEach(([role],index)=>{
          const transceiver=transceivers[index];
          if(transceiver){transceiver.direction="sendrecv";c.tr[role]=transceiver}
        });
        await applyTracks(c);
        await pc.setLocalDescription();
        await sendRtcSignal(c,"desc",pc.localDescription.toJSON());
      }
    }else if(d.type==="ice"){
      if(pc.remoteDescription)await pc.addIceCandidate(data).catch(e=>console.warn(e));
      else c.pending.push(data);
    }
  }catch(e){console.error(e)}
}

function routeSignal(d){
  if(!ZS.joined||d.roomId!==ZS.roomId)return;
  let data;try{data=JSON.parse(d.data)}catch(e){return}
  if(!data)return;
  const isOffer=d.type==="desc"&&data.type==="offer";
  let c=ZS.peers.get(d.from);
  if(c&&c.cid!==d.cid){
    if(c.caller)return;              /* أنا المتصل: أتجاهل ردود اتصال قديم */
    if(isOffer){closePeer(d.from);c=null} /* المتصل بدأ اتصال جديد */
    else return;
  }
  if(!c){
    if(!isOffer){
      if(d.type==="ice"){
        const key=d.from+"|"+d.cid;
        if(ZS.pendingSignals.size>600)ZS.pendingSignals.clear();
        const queue=ZS.pendingSignals.get(key)||[];
        if(queue.length<64)queue.push(data);
        ZS.pendingSignals.set(key,queue);
      }
      return;
    }
    if(imCaller(d.from,d.fromAdmin))return; /* أنا المفروض أبدأ، مش هو */
    c=makePeer(d.from,d.fromName,d.fromAdmin,d.fromSid,d.cid,false);
    const key=d.from+"|"+d.cid;
    c.pending.push(...(ZS.pendingSignals.get(key)||[]));ZS.pendingSignals.delete(key);
  }
  if(d.fromName)c.name=d.fromName;
  if(d.fromAdmin)c.isAdmin=true;
  c.q=c.q.then(()=>handleSignal(c,d,data)).catch(()=>{});
}

function connectToPresentPeers(){
  if(useSFU())return;
  if(!ZS.joined||!ZS.sigReady||!st.user||!db)return;
  const now=Date.now();
  ZS.peers.forEach((c,uid)=>{
    const p=ZS.presence?.[uid];
    const gone=(!p||now-(p.lastSeen||0)>90000)&&now-c.born>15000;
    const newSess=p&&p.sid&&c.sid&&p.sid!==c.sid;
    const stuck=c.caller&&c.pc.connectionState!=="connected"&&now-c.born>20000;
    if(gone||newSess||stuck)closePeer(uid);
  });
  Object.values(ZS.presence||{}).forEach(p=>{
    if(!p.uid||p.uid===st.user.uid||!p.sid||p.roomId!==ZS.roomId||now-(p.lastSeen||0)>90000)return;
    if(!MESH&&!st.adm&&!p.isAdmin)return;
    if(!imCaller(p.uid,p.isAdmin))return;
    const c=ZS.peers.get(p.uid);
    if(c){if(p.name)c.name=p.name;return}
    makePeer(p.uid,p.name,p.isAdmin,p.sid,newId(),true);
  });
}

function startRtcSignalingSub(){
  if(!db||!st.user)return;
  try{ZS.rtcUnsub?.()}catch(e){}
  ZS.rtcUnsub=onSnapshot(query(collection(db,"zoom_rtc"),where("to","==",st.user.uid),limit(500)),snap=>{
    const adds=snap.docChanges().filter(x=>x.type==="added").map(x=>({id:x.doc.id,ref:x.doc.ref,d:x.doc.data()})).sort((a,b)=>(a.d.ts||0)-(b.d.ts||0));
    adds.forEach(({id,ref,d})=>{
      if(ZS.seenSignals.has(id))return;
      ZS.seenSignals.add(id);
      if(ZS.seenSignals.size>2000)ZS.seenSignals=new Set([id]);
      deleteDoc(ref).catch(()=>{});
      if(!d||!d.from||d.from===st.user.uid)return;
      if(d.toSid!==ZS.sid)return; /* موجهة لجلسة قديمة */
      if(d.roomId!==ZS.roomId||Date.now()-(d.ts||0)>120000)return;
      if(!MESH&&!st.adm&&!d.fromAdmin)return;
      routeSignal(d);
    });
  },err=>{console.error(err);toast("⚠️ "+A("تعذرت قراءة إشارات الاتصال: ","Signaling read failed: ")+(err.code||""))});
}

function applyRemoteStageData(d){
  if(!d||!inRoom()||String(d.roomId||"")!==String(st.zoom?.ts||""))return;
  if(st.adm&&(d.ts||0)<=lastRemoteStageTs)return;
  lastRemoteStageTs=d.ts||Date.now();
  ZS.sharedType=d.sharedType||"";
  ZS.sharedImg=d.sharedImg||"";
  ZS.pageDataUrl=d.pageDataUrl||"";
  if(d.liveFrameUrl)ZS.liveFrameUrl=d.liveFrameUrl;
  ZS.sharedVid=d.sharedVid||"";
  ZS.sharedUrl=d.sharedUrl||"";
  ZS.pdfPage=d.pdfPage||1;
  ZS.pdfNumPages=d.pdfNumPages||1;
  ZS.slides=Array.isArray(d.slides)?d.slides:[];
  ZS.slideIdx=d.slideIdx||1;
  ZS.textContent=d.textContent||"";
  ZS.screenActive=d.screenActive?1:0;
  if(ZS.sharedType||ZS.screenActive)ZS.audioOnly=0;
}

if(zoomBC){
  zoomBC.onmessage=ev=>{
    const m=ev.data;
    if(!m)return;
    if(m.type==="stage"&&!st.adm){
      applyRemoteStageData(m.payload);
      if(route()=="zoom-alnoor"&&$("zr"))draw();
    }else if(m.type==="liveFrame"&&!st.adm&&m.frame){
      ZS.liveFrameUrl=m.frame;
      const img=$("z-live-frame-img");
      if(img)img.src=m.frame;
    }
  };
}

function touchPresence(active=true){
  if(!db||!st.user||useSFU())return;
  setDoc(doc(db,"zoom_presence",st.user.uid),{
    uid:st.user.uid,
    roomId:ZS.roomId,
    sid:ZS.sid,
    name:displayName(),
    isAdmin:!!st.adm,
    active:!!active,
    cam:!!(ZS.cam&&ZS.cam1&&!ZS.audioOnly),
    lastSeen:Date.now()
  },{merge:true}).then(()=>{if(active)connectToPresentPeers()}).catch(()=>{});
}
function inRoom(){return !!st.user&&!!st.zoom&&(st.adm||st.zok==st.zoom.ts)}
function joinRoom(){
  if(ZS.joined||!db||!st.user||!inRoom())return;
  ZS.roomId=String(st.zoom.ts);ZS.enteredAt=Date.now();ZS.msgs=[];ZS.chatSeen.clear();
  ZS.joined=1;ZS.tick=0;
  if(!useSFU())startRtcSignalingSub();
  else connectSfu().catch(e=>toast("⚠️ "+e.message));
  ZS.sigReady=1;
  touchPresence(true);
  requestWakeLock();
  clearInterval(ZS.presenceTimer);
  ZS.presenceTimer=setInterval(()=>{
    if(!(route()=="zoom-alnoor"&&st.user&&ZS.joined))return;
    if(++ZS.tick%5==0)touchPresence(true);
    connectToPresentPeers();
  },6000);
}

function startZoomRealtimeSubs(){
  if(!db||zoomSubStarted||!inRoom()||route()!=="zoom-alnoor")return;
  zoomSubStarted=true;
  const roomId=String(st.zoom.ts);

  ZS.roomUnsubs.push(sub(query(collection(db,"zoom_hands"),where("roomId","==",roomId)),s=>{
    const map={};
    s.docs.forEach(d=>{const x=d.data();if(x.raised)map[d.id]={uid:d.id,...x}});
    ZS.hands=map;
  },"zoom_hands"));

  if(!useSFU())ZS.roomUnsubs.push(sub(query(collection(db,"zoom_presence"),where("roomId","==",roomId)),s=>{
    const now=Date.now(),map={};
    s.docs.forEach(d=>{const x=d.data();if(x.active&&now-(x.lastSeen||0)<90000)map[d.id]={uid:d.id,...x}});

function stopAudioMeter(){
  if(ZS.meterRaf){cancelAnimationFrame(ZS.meterRaf);ZS.meterRaf=0}
  if(ZS.audioCtx){try{ZS.audioCtx.close()}catch(e){}ZS.audioCtx=null;ZS.analyser=null}
}
function startAudioMeter(stream){
  stopAudioMeter();
  if(!stream||!stream.getAudioTracks().length)return;
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    if(ctx.state==="suspended")ctx.resume().catch(()=>{});
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();
    analyser.fftSize=256;
    src.connect(analyser);
    ZS.audioCtx=ctx;ZS.analyser=analyser;
    const data=new Uint8Array(analyser.frequencyBinCount);
    const tick=()=>{
      if(!ZS.analyser){const b=$("z-mic-bar");if(b)b.style.width="0%";return}
      ZS.analyser.getByteFrequencyData(data);
      let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
      const avg=Math.min(100,Math.round((sum/data.length)*1.8));
      const bar=$("z-mic-bar");
      if(bar)bar.style.width=(ZS.mic?avg:0)+"%";
      ZS.meterRaf=requestAnimationFrame(tick);
    };
    ZS.meterRaf=requestAnimationFrame(tick);
  }catch(e){}
}

function attachMediaElements(){
  const zv=$("zv");
  if(zv){
    zv.srcObject=(ZS.cam&&ZS.cam1&&!ZS.audioOnly)?ZS.cam:null;
    zv.muted=true;
    zv.play?.().catch(()=>{});
  }
  const zsv=$("zsv");
  if(zsv){
    zsv.srcObject=ZS.scr||null;
    zsv.muted=true;
    if(ZS.scr)zsv.play?.().catch(()=>{});
  }
  /* فيديو الملف عند الإدارة: عنصر دائم يُنقل فقط (لا يُعاد إنشاؤه) فلا يعيد التشغيل */
  const slot=$("z-vid-slot");
  if(slot&&ZS.vidEl&&ZS.vidEl.parentNode!==slot)slot.appendChild(ZS.vidEl);
  if(!st.adm){
    const zvv=$("z-shared-vid");
    if(zvv){zvv.muted=!ZS.speaker;zvv.play?.().catch(()=>{})}
  }
  /* شاشة/فيديو الإدارة عند الطالب (الصوت يأتي من عناصر الصوت الدائمة، لذلك الفيديو muted) */
  const rs=$("z-remote-screen-vid"),hs=hostScreenStream();
  if(rs&&hs){
    if(rs.srcObject!==hs)rs.srcObject=hs;
    rs.muted=true;
    rs.play?.().catch(()=>{});
  }
  document.querySelectorAll("[data-peer-cam]").forEach(el=>{
    const s=ZS.remoteStreams.get(el.dataset.peerCam)?.streams?.cam;
    if(s){el.srcObject=s;el.muted=true;el.play?.().catch(()=>{})}
  });
  syncAudioElements();
  if(ZS.sharedType==="pdf"&&ZS.pdfDoc){
    renderPdfPageToCanvas(ZS.pdfPage,false);
  }
}

function zStop(){
  ZS.sfuEpoch++;ZS.sfuConnecting=false;
  const oldRoom=ZS.sfu;ZS.sfu=null;
  if(oldRoom){oldRoom.removeAllListeners();oldRoom.disconnect().catch(()=>{})}
  ZS.sfuTracks.clear();releaseWakeLock();closeDeviceTest();
  ZS.roomUnsubs.splice(0).forEach(f=>{try{f()}catch(e){}});
  zoomSubStarted=false;
  ZS.msgs=[];ZS.chatSeen.clear();ZS.pendingSignals.clear();ZS.seenSignals.clear();
  ZS.enteredAt=0;
  dropVidEl();ZS.sigReady=0;
  ZS.joined=0;try{ZS.rtcUnsub?.()}catch(e){}ZS.rtcUnsub=null;
  stopAudioMeter();
  stopLiveFrameSync();
  clearInterval(ZS.presenceTimer);
  if(ZS.rec&&ZS.rec.state!=="inactive"){try{ZS.rec.stop()}catch(e){}}
  [ZS.cam,ZS.micStream,ZS.scr,ZS.vidShareStream].forEach(s=>s&&s.getTracks().forEach(t=>t.stop()));
  ZS.cam=ZS.micStream=ZS.scr=ZS.vidShareStream=ZS.rec=null;
  ZS.mic=0;ZS.cam1=0;ZS.menu=null;ZS.expanded=0;
  ZS.peers.forEach(c=>{try{c.pc.close()}catch(e){}});
  ZS.peers.clear();ZS.remoteStreams.clear();syncAudioElements();
  if(db&&st.user){

function openOnboarding(){

  if($("alnoor-devices"))return toast(A("أغلق فحص الأجهزة أولًا لفتح الدليل.","Close device diagnostics before opening the guide."));

  onboarding.returnFocus=document.activeElement;
  const dialog=document.createElement("dialog");dialog.id="alnoor-onboarding";dialog.className="onboard-dialog";
  dialog.setAttribute("aria-labelledby","onboard-title");dialog.setAttribute("aria-describedby","onboard-description");
  dialog.addEventListener("cancel",e=>{e.preventDefault();closeOnboarding("skipped")});
  dialog.addEventListener("click",e=>{
    e.stopPropagation();
    const action=e.target.closest("[data-ob]")?.dataset.ob;
    if(action==="skip")closeOnboarding("skipped");
    else if(action==="finish")closeOnboarding("done");

  });

async function ensureMic(){
  if(ZS.micStream&&ZS.micStream.active)return ZS.micStream;
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Unsupported");
  const epoch=ZS.sfuEpoch;
  const s=await navigator.mediaDevices.getUserMedia({
    audio:{...(deviceChoice.mic?{deviceId:{exact:deviceChoice.mic}}:{}),echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:{ideal:1}},
    video:false
  });
  if(!ZS.joined||epoch!==ZS.sfuEpoch){s.getTracks().forEach(t=>t.stop());throw new Error("Session ended")}
  ZS.micStream=s;
  s.getAudioTracks()[0].onended=()=>{ZS.mic=0;syncTracksToPeers();scheduleRtcRedraw();toast(A("انقطع المايكروفون؛ اختره من فحص الأجهزة","Microphone disconnected; select a device in diagnostics"))};
  startAudioMeter(s);
  return s;
}
async function ensureCam(){
  if(ZS.cam&&ZS.cam.active)return ZS.cam;
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Unsupported");
  const epoch=ZS.sfuEpoch;
  const h=ZS.batterySaver?360:720,w=ZS.batterySaver?640:1280,fps=ZS.batterySaver?15:24;
  const s=await navigator.mediaDevices.getUserMedia({
    video:{...(deviceChoice.cam?{deviceId:{exact:deviceChoice.cam}}:{facingMode:"user"}),width:{ideal:w},height:{ideal:h},frameRate:{ideal:fps}},
    audio:false
  });
  if(!ZS.joined||epoch!==ZS.sfuEpoch){s.getTracks().forEach(t=>t.stop());throw new Error("Session ended")}
  ZS.cam=s;
  s.getVideoTracks()[0].onended=()=>{ZS.cam1=0;syncTracksToPeers();scheduleRtcRedraw()};
  return s;
}

 zpickmedia(accept){
  if(!st.adm)return;
  const fi=$("z-media-input");if(!fi)return;
  fi.accept=accept||"*/*";
  fi.onchange=async()=>{dropVidEl();
    const file=fi.files?.[0];if(!file)return;
    const realName=String(file.name||"").split(/[/\\]/).pop()||"";
    ZS.menu=null;ZS.audioOnly=0;
    ZS.sharedImg="";ZS.pageDataUrl="";ZS.liveFrameUrl="";ZS.sharedVid="";ZS.sharedUrl="";ZS.sharedType="";
    if(ZS.vidShareStream){ZS.vidShareStream.getTracks().forEach(t=>t.stop());ZS.vidShareStream=null}
    ZS.pdfDoc=null;ZS.pdfNumPages=1;ZS.pdfPage=1;ZS.slides=[];ZS.slideIdx=1;ZS.textContent="";
    pdfPageCache.clear();pdfPrefetching.clear();
    try{
      if(/^image\//.test(file.type)){
        const compressed=await compressToDataUrl(file,1400,900,580000);
        ZS.sharedImg=compressed;
        ZS.sharedUrl=compressed;
        ZS.sharedType="img";
        draw();
        syncStageToCloud();
      }else if(/^video\//.test(file.type)){
        const v=document.createElement("video");
        v.id="z-shared-vid";v.controls=true;v.playsInline=true;v.preload="auto";
        v.src=URL.createObjectURL(file);
        ZS.vidEl=v;
        ZS.sharedVid=v.src;
        ZS.sharedUrl=v.src;
        ZS.sharedType="video";
        v.addEventListener("loadedmetadata",startVidCapture);
        v.addEventListener("playing",startVidCapture);
        draw();
        v.play().catch(()=>{});
        startLiveFrameSync();
        syncStageToCloud();
      }else if(/pdf/i.test(file.type)||/\.pdf$/i.test(realName)){
        ZS.sharedType="pdf";
        ZS.sharedUrl=URL.createObjectURL(file);
        const pdfjs=await loadPdfJs();
        const buf=await file.arrayBuffer();
        ZS.pdfDoc=await pdfjs.getDocument({data:buf}).promise;
        ZS.pdfNumPages=ZS.pdfDoc.numPages||1;
        ZS.pdfPage=1;
        draw();
        await renderPdfPageToCanvas(1,true);
      }else if(/\.pptx$/i.test(realName)||/presentationml/i.test(file.type)){
        ZS.sharedType="pptx";
        ZS.sharedUrl=URL.createObjectURL(file);
        ZS.slides=await parsePptxSlides(file);
        ZS.slideIdx=1;
        draw();
        syncStageToCloud();
      }else if(/\.ppt$/i.test(realName)||/ms-powerpoint/i.test(file.type)){
        ZS.sharedType="pptx";
        ZS.sharedUrl=URL.createObjectURL(file);
        ZS.slides=[{index:1,text:""}];
        ZS.slideIdx=1;
        draw();
        syncStageToCloud();
      }else if(/^(text\/|application\/(json|xml|javascript))|\.(txt|csv|md|json|html|log)$/i.test(file.type+" "+realName)){
        ZS.sharedType="text";
        ZS.sharedUrl=URL.createObjectURL(file);
        ZS.textContent=(await file.text()).slice(0,12000);
        draw();
        syncStageToCloud();
      }else{
        ZS.sharedType="other";
        ZS.sharedUrl=URL.createObjectURL(file);
        draw();
        syncStageToCloud();
      }
      toast("✅");
    }catch(err){
      console.error(err);
      ZS.sharedType="other";
      ZS.sharedUrl=URL.createObjectURL(file);
      draw();
      syncStageToCloud();
      toast("⚠️");
    }
    fi.value="";
  };
  fi.click();
 },

 async zscr(){
  if(!st.adm||!ZS.joined)return;
  ZS.menu=null;
  if(ZS.scr){
    stopLiveFrameSync();
    ZS.scr.getTracks().forEach(t=>t.stop());
    ZS.scr=null;
    ZS.screenActive=0;
    await syncTracksToPeers();
    draw();
    syncStageToCloud({screenActive:false,liveFrameUrl:""});
    return;
  }
  if(!navigator.mediaDevices?.getDisplayMedia){
    toast("⚠️ "+A("مشاركة الشاشة غير مدعومة في هذا المتصفح أو الجهاز","Screen sharing is not supported in this browser or device"));
    return;
  }
  try{
    const epoch=ZS.sfuEpoch;
    ZS.audioOnly=0;
    const capture=await navigator.mediaDevices.getDisplayMedia({
      video:{width:{ideal:1280,max:1920},height:{ideal:720,max:1080},frameRate:{ideal:15,max:30}},
      audio:ZS.shareAudio?{echoCancellation:false,noiseSuppression:false,autoGainControl:false}:false
    });
    if(!ZS.joined||epoch!==ZS.sfuEpoch){capture.getTracks().forEach(t=>t.stop());return}
    ZS.scr=capture;
    ZS.screenActive=1;
    const vTrack=ZS.scr.getVideoTracks()[0];
    if(vTrack)vTrack.onended=()=>{
      stopLiveFrameSync();
      ZS.scr?.getTracks().forEach(t=>t.stop());
      ZS.scr=null;ZS.screenActive=0;
      syncTracksToPeers();
      draw();
      syncStageToCloud({screenActive:false,liveFrameUrl:""});
    };
    draw();
    startLiveFrameSync();
    await syncTracksToPeers();
    syncStageToCloud({screenActive:true});
    toast("✅");
  }catch(e){toast("⚠️ "+mediaErrorMsg(e,"both"))}
 },
 async zrec(b){
  if(ZS.rec&&ZS.rec.state!=="inactive"){ZS.rec.stop();return}
  try{if(!ZS.mic&&!ZS.cam&&!ZS.scr)await ensureMic()}catch(e){}
  const tracks=[];
  if(ZS.scr)tracks.push(...ZS.scr.getVideoTracks(),...ZS.scr.getAudioTracks());
  else if(ZS.cam&&ZS.cam1)tracks.push(...ZS.cam.getVideoTracks());
  if(ZS.micStream&&ZS.mic)tracks.push(...ZS.micStream.getAudioTracks());
  if(!tracks.length)return toast("⚠️ "+A("لا يوجد صوت أو صورة نشطة للتسجيل","No active audio or video to record"));
  const mt=["video/webm;codecs=vp9,opus","video/webm","video/mp4"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mt)return toast("⚠️ "+A("التسجيل غير مدعوم في هذا المتصفح","Recording is not supported in this browser"));
  ZS.ch=[];
  const r=new MediaRecorder(new MediaStream(tracks),{mimeType:mt,videoBitsPerSecond:8000000,audioBitsPerSecond:128000});
  ZS.rec=r;
  r.ondataavailable=ev=>ev.data.size&&ZS.ch.push(ev.data);
  r.onstop=()=>{
    ZS.rec=null;
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(ZS.ch,{type:mt}));
    a.download="alnoor-lecture-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+(mt.includes("mp4")?".mp4":".webm");
    document.body.appendChild(a);a.click();a.remove();
    draw();
  };
  r.start(1000);
  draw();
 }
