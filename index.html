      startAudioMeter(ZS.micStream);
      await syncTracksToPeers();
      zs(A("المايك شغال","Mic on"));draw();
    }catch(e){console.error(e);toast("⚠️ "+mediaErrorMsg(e,"mic"))}
  },
  zquickcam:async()=>{
    if(!ZS.joined)joinRoom();
    if(ZS.cam&&ZS.cam.getTracks().some(t=>t.readyState==="live")){
      ZS.cam1=1;ZS.audioOnly=0;
      ZS.cam.getVideoTracks().forEach(t=>t.enabled=true);
      await syncTracksToPeers();
      touchPresence(true);draw();return;
    }
    if(!navigator.mediaDevices?.getUserMedia)return toast("⚠️ "+mediaErrorMsg(null,"cam"));
    try{
      const [w,h]=ZQ[document.querySelector('[data-c="zq"]')?.value||"720"]||[1280,720];
      const vSpec=deviceChoice.cam?{deviceId:{exact:deviceChoice.cam},width:{ideal:w},height:{ideal:h}}:{width:{ideal:w},height:{ideal:h}};
      ZS.cam=await navigator.mediaDevices.getUserMedia({video:vSpec,audio:false});
      ZS.cam1=1;ZS.audioOnly=0;
      ZS.cam.getVideoTracks()[0].onended=()=>{ZS.cam1=0;ZS.cam=null;syncTracksToPeers();touchPresence(true);draw()};
      await syncTracksToPeers();
      touchPresence(true);draw();
    }catch(e){console.error(e);toast("⚠️ "+mediaErrorMsg(e,"cam"))}
  },
  zt:async b=>{
    if(!ZS.joined)joinRoom();
    const k=b.dataset.p;
    if(k=="mic"){
      if(!canPresent()&&!ZS.roomCtrl.allowMic){
        return toast("🔇 "+A("الإدارة أوقفت المايكروفون مؤقتاً","Microphone is muted by host"));
      }
      if(!ZS.micStream){
        await ACT.zquickmic();
        return;
      }
      ZS.mic=ZS.mic?0:1;
      ZS.micStream.getAudioTracks().forEach(t=>t.enabled=!!ZS.mic);
      if(ZS.mic)startAudioMeter(ZS.micStream);
      else{stopAudioMeter();const bar=$("z-mic-bar");if(bar)bar.style.width="0%"}
      await syncTracksToPeers();
      zs(ZS.mic?A("المايك شغال","Mic on"):A("المايك مطفي","Mic off"));
      draw();
    }
    if(k=="cam1"){
      if(!ZS.cam1){
        await ACT.zquickcam();
        return;
      }
      ZS.cam1=0;
      ZS.cam?.getTracks().forEach(t=>t.stop());ZS.cam=null;
      await syncTracksToPeers();
      touchPresence(true);draw();
    }
  },
  zscr:async()=>{
    if(!canPresent())return;
    if(!ZS.joined)joinRoom();
    ZS.menu=null;
    if(ZS.scr){
      ZS.scr.getTracks().forEach(t=>t.stop());ZS.scr=null;ZS.screenActive=0;
      stopLiveFrameSync();
      if(!ZS.sharedType)releaseStageOverrideIfOwner();
      await syncTracksToPeers();
      syncStageToCloud({screenActive:false});
      draw();return;
    }
    if(!navigator.mediaDevices?.getDisplayMedia)return toast("⚠️ "+A("مشاركة الشاشة غير مدعومة في هذا المتصفح","Screen share is not supported in this browser"));
    try{
      const [w,h]=ZQ[document.querySelector('[data-c="zq"]')?.value||"720"]||[1280,720];
      ZS.scr=await navigator.mediaDevices.getDisplayMedia({video:{width:{ideal:w},height:{ideal:h},frameRate:{ideal:24}},audio:!!ZS.shareAudio});
      ZS.screenActive=1;ZS.audioOnly=0;
      if(!st.adm)claimStageOverride();
      ZS.scr.getVideoTracks()[0].onended=()=>{
        ZS.scr=null;ZS.screenActive=0;
        stopLiveFrameSync();
        if(!ZS.sharedType)releaseStageOverrideIfOwner();
        syncTracksToPeers();
        syncStageToCloud({screenActive:false});
        draw();
      };
      await syncTracksToPeers();
      startLiveFrameSync();
      syncStageToCloud({screenActive:true});
      draw();
    }catch(e){console.error(e);toast("⚠️ "+A("تعذر مشاركة الشاشة","Could not share screen"))}
  },
  zpickmedia:b=>{
    if(!canPresent())return;
    const inp=$("z-media-input");
    if(!inp)return;
    inp.accept=b.dataset.p||"*/*";
    ZS.menu=null;
    inp.value="";
    inp.click();
  },
  zclearshare:()=>{
    if(!canPresent())return;
    dropVidEl();
    if(ZS.vidShareStream){ZS.vidShareStream.getTracks().forEach(t=>t.stop());ZS.vidShareStream=null}
    if(ZS.scr){ZS.scr.getTracks().forEach(t=>t.stop());ZS.scr=null}
    stopLiveFrameSync();
    ZS.sharedImg="";ZS.sharedVid="";ZS.sharedUrl="";ZS.sharedType="";ZS.pageDataUrl="";ZS.liveFrameUrl="";ZS.pdfDoc=null;ZS.slides=[];ZS.slideIdx=1;ZS.textContent="";ZS.screenActive=0;
    pdfPageCache.clear();pdfPrefetching.clear();
    releaseStageOverrideIfOwner();
    syncTracksToPeers();
    syncStageToCloud({sharedType:"",sharedImg:"",pageDataUrl:"",liveFrameUrl:"",sharedVid:"",sharedUrl:"",slides:[],slideIdx:1,textContent:"",screenActive:false});
    ZS.menu=null;draw();
  },
  zpdfpage:async b=>{
    if(!canPresent()||!ZS.pdfDoc)return;
    const delta=Number(b.dataset.p||0);
    const next=Math.max(1,Math.min(ZS.pdfNumPages||1,ZS.pdfPage+delta));
    await renderPdfPageToCanvas(next,true);
  },
  zslide:b=>{
    if(!canPresent()||!ZS.slides.length)return;
    const delta=Number(b.dataset.p||0);
    ZS.slideIdx=Math.max(1,Math.min(ZS.slides.length,ZS.slideIdx+delta));
    draw();
    syncStageToCloud({slideIdx:ZS.slideIdx});
  },
  zsendreact:b=>{
    if(!ZS.joined||!db||!st.user)return;
    const emoji=b.dataset.p||"👍";
    ZS.menu=null;
    if(emoji==="✋"){
      ZS.hand=ZS.hand?0:1;
      setDoc(doc(db,"zoom_hands",st.user.uid),{uid:st.user.uid,name:displayName(),roomId:ZS.roomId,raised:!!ZS.hand,ts:Date.now()},{merge:true}).catch(()=>{});
    }
    addDoc(collection(db,"zoom_reactions"),{roomId:ZS.roomId,uid:st.user.uid,who:displayName(),emoji,ts:Date.now()}).catch(()=>{});
    draw();
  },
  zlowerhand:b=>{
    if(!st.adm||!b.dataset.p)return;
    updateDoc(doc(db,"zoom_hands",b.dataset.p),{raised:false}).catch(()=>{});
  },
  zmuteall:()=>{
    if(!st.adm)return;
    ZS.roomCtrl.allowMic=0;
    setDoc(doc(db,"site","zoom_ctrl"),{allowMic:false,ts:Date.now()},{merge:true}).catch(()=>{});
    toast("🔇 "+A("تم كتم صوت الطلاب","Student microphones muted"));
    draw();
  },
  zunmuteall:()=>{
    if(!st.adm)return;
    ZS.roomCtrl.allowMic=1;
    setDoc(doc(db,"site","zoom_ctrl"),{allowMic:true,ts:Date.now()},{merge:true}).catch(()=>{});
    toast("🎙 "+A("تم السماح للطلاب بالتحدث","Student microphones allowed"));
    draw();
  },
  zsendmsg:async()=>{
    const inp=$("z-chat-in");if(!inp)return;
    const txt=inp.value.trim();if(!txt)return;
    inp.value="";
    try{await sendEphemeralChat(txt)}
    catch(e){toast("⚠️ "+(e.message||A("تعذر إرسال الرسالة","Could not send message")))}
  },
  zpurgechat:async()=>{
    if(!st.adm)return;
    if(!confirm(A("حذف أرشيف الشات القديم من قاعدة البيانات؟","Delete legacy chat archive from database?")))return;
    try{
      const snap=await getDocs(query(collection(db,"zoom_chat"),limit(100)));
      const batch=writeBatch(db);
      snap.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      toast("✅ "+A("تم حذف الأرشيف القديم","Legacy archive deleted"));
    }catch(e){toast("⚠️ "+e.message)}
  },
  zdevices:openDeviceTest,
  zreport:()=>toast("⚠ "+A("تم تسجيل البلاغ للإدارة","Report noted for administration")),
  zrec:()=>{if(!st.adm)return;if(ZS.rec){ZS.rec.stop();return}
    const s=ZS.scr||ZS.cam||ZS.micStream;if(!s)return toast("⚠️ "+A("شغّل الشاشة أو الكاميرا أو المايك أولاً","Turn on screen, camera or mic first"));
    const ch=[];try{ZS.rec=new MediaRecorder(s)}catch(e){return toast("⚠️ "+A("التسجيل غير مدعوم","Recording not supported"))}
    ZS.rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    ZS.rec.onstop=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(ch));a.download="alnoor-lecture.webm";a.click();ZS.rec=null;draw()};
    ZS.rec.start();draw()},
  zleave:()=>{zStop();if(st.adm){st.zok=0;draw()}else go("dashboard")}
};

document.addEventListener("pointerdown",e=>{
  unlockRemoteAudioOnGesture();
  const cropStage=e.target.closest("[data-crop-id]");
  if(cropStage){
    const id=cropStage.dataset.cropId,cr=st.crops[id];if(!cr)return;
    e.preventDefault();cropStage.setPointerCapture?.(e.pointerId);
    const sx=e.clientX,sy=e.clientY,ox=cr.x,oy=cr.y;
    const onMove=ev=>{cr.x=Math.max(-75,Math.min(75,Math.round(ox+(ev.clientX-sx))));cr.y=Math.max(-75,Math.min(75,Math.round(oy+(ev.clientY-sy))));syncCropPreview(id);const ix=document.querySelector(`[data-crop-slider="${id}|x"]`),iy=document.querySelector(`[data-crop-slider="${id}|y"]`);if(ix)ix.value=cr.x;if(iy)iy.value=cr.y};
    const onUp=()=>{cropStage.removeEventListener("pointermove",onMove);cropStage.removeEventListener("pointerup",onUp)};
    cropStage.addEventListener("pointermove",onMove);cropStage.addEventListener("pointerup",onUp);return;
  }
  if(ZS.menu&&!e.target.closest('[data-zpop="1"]')&&!e.target.closest('[data-a="zmenu"]')){ZS.menu=null;draw()}
});
document.addEventListener("input",e=>{
  const sl=e.target.dataset?.cropSlider;
  if(sl){const[id,k]=sl.split("|");if(st.crops[id]){st.crops[id][k]=+e.target.value;syncCropPreview(id)}}
});
document.addEventListener("change",async e=>{
  if(e.target.id==="p-photo-file"){
    const f=e.target.files?.[0];if(!f)return;
    try{const src=await compressToDataUrl(f,900,900,520000);st.crops["me"]={src,zoom:1,x:0,y:0};draw();syncCropPreview("me")}
    catch(err){toast("⚠️ "+err.message)}
    return;
  }
  const id=e.target.id;
  if(id&&id.startsWith("e-team-")&&id.endsWith("-file")){
    const fid=id.slice("e-team-".length,-"-file".length);
    const f=e.target.files?.[0];if(!f)return;
    try{const src=await compressToDataUrl(f,900,900,520000);st.crops[fid]={src,zoom:1,x:0,y:0};draw();syncCropPreview(fid)}
    catch(err){toast("⚠️ "+err.message)}
    return;
  }
  if(e.target.id==="z-media-input"){
    const f=e.target.files?.[0];if(!f||!canPresent())return;
    if(!ZS.joined)joinRoom();
    dropVidEl();
    if(ZS.vidShareStream){ZS.vidShareStream.getTracks().forEach(t=>t.stop());ZS.vidShareStream=null}
    ZS.sharedImg="";ZS.sharedVid="";ZS.sharedUrl="";ZS.sharedType="";ZS.pageDataUrl="";ZS.pdfDoc=null;ZS.slides=[];ZS.slideIdx=1;ZS.textContent="";
    pdfPageCache.clear();pdfPrefetching.clear();
    if(!st.adm)claimStageOverride();
    const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
    const isPptx=/\.pptx$/i.test(f.name)||/presentationml\.presentation/i.test(f.type);
    if(isPdf){
      try{
        const pdfjs=await loadPdfJs();
        const buf=new Uint8Array(await f.arrayBuffer());
        const docPdf=await pdfjs.getDocument({data:buf}).promise;
        ZS.pdfDoc=docPdf;ZS.pdfNumPages=docPdf.numPages||1;ZS.pdfPage=1;ZS.sharedType="pdf";ZS.audioOnly=0;
        draw();
        await renderPdfPageToCanvas(1,true);
      }catch(err){console.error(err);toast("⚠️ "+A("تعذر فتح ملف PDF","Could not open PDF file"))}
    }else if(isPptx){
      try{
        const slides=await parsePptxSlides(f);
        if(!slides.length)return toast("⚠️ "+A("لم يتم العثور على شرائح في الملف","No slides found in presentation"));
        ZS.slides=slides;ZS.slideIdx=1;ZS.sharedType="pptx";ZS.audioOnly=0;
        draw();
        syncStageToCloud({sharedType:"pptx",slides:ZS.slides,slideIdx:1});
      }catch(err){console.error(err);toast("⚠️ "+A("تعذر قراءة ملف PowerPoint","Could not read PowerPoint file"))}
    }else if(/^image\//.test(f.type)){
      try{
        const imgUrl=await compressToDataUrl(f,1440,900,560000);
        ZS.sharedImg=imgUrl;ZS.sharedType="image";ZS.audioOnly=0;
        draw();
        syncStageToCloud({sharedType:"image",sharedImg:ZS.sharedImg});
      }catch(err){console.error(err);toast("⚠️ "+err.message)}
    }else if(/^video\//.test(f.type)){
      const url=URL.createObjectURL(f);
      const v=document.createElement("video");
      v.id="z-shared-vid";v.src=url;v.controls=true;v.autoplay=true;v.playsinline=true;
      v.style.cssText="width:100%;height:100%;max-height:78svh;object-fit:contain;background:#090a0d;border-radius:8px";
      v.onloadedmetadata=()=>{startVidCapture();syncStageToCloud({sharedType:"video",screenActive:true})};
      ZS.vidEl=v;ZS.sharedVid=url;ZS.sharedType="video";ZS.audioOnly=0;
      draw();
      syncStageToCloud({sharedType:"video",screenActive:true});
    }else{
      let txt="";
      if(f.size<250000&&(f.type.startsWith("text/")||/\.(txt|md|csv|json|xml|html)$/i.test(f.name))){
        txt=(await f.text()).slice(0,12000);
      }
      ZS.textContent=txt||A("تمت مشاركة الملف: ","Shared file: ")+f.name;
      ZS.sharedType="text";ZS.audioOnly=0;
      draw();
      syncStageToCloud({sharedType:"text",textContent:ZS.textContent});
    }
    return;
  }
  const c=e.target.dataset.c;if(!c)return;
  if(c=="filt"){st.filt=e.target.value;draw()}
  if(c=="zq"){
    const[w,h]=ZQ[e.target.value]||[1280,720];
    if(ZS.cam)ZS.cam.getVideoTracks()[0]?.applyConstraints({width:{ideal:w},height:{ideal:h}}).catch(()=>{});
    if(ZS.scr)ZS.scr.getVideoTracks()[0]?.applyConstraints({width:{ideal:w},height:{ideal:h}}).catch(()=>{});
  }
});
document.addEventListener("click",e=>{unlockRemoteAudioOnGesture();const b=e.target.closest("[data-a]");if(!b)return;const f=ACT[b.dataset.a];if(f)f(b)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&st.menuOpen)setMenuOpen(false);if(e.key=="Enter"&&e.target.dataset.e){e.preventDefault();const f=ACT[e.target.dataset.e];if(f)f(e.target)}});
window.addEventListener("hashchange",()=>{if(route()!="zoom-alnoor")zStop();setMenuOpen(false);draw()});
window.addEventListener("resize",()=>{paintAnnOverlay();paintAnnBoard();updateAnnLaserDot();applyAnnBoardGeometry()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")requestWakeLock();else releaseWakeLock()});
window.addEventListener("pagehide",zStop);
initTheme();
document.documentElement.lang=st.lang;document.documentElement.dir=st.lang=="ar"?"rtl":"ltr";draw();
</script>
</body>
