<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087f8c">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="منصة النور">
<title>منصة النور</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef7f7;--card:#fff;--tx:#0E1620;--tx2:#46586B;--ink:#0E1620;--teal:#087f8c;--tealS:#d9f2ef;--red:#d44949;--redS:#ffe5e5;--sun:#bdebe4;--dsp:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b1b24;--card:#132c35;--tx:#E4F3FF;--tx2:#9DB4C8;--ink:#E4F3FF;--teal:#39b9b1;--tealS:#164449;--redS:#4A1F18;--sun:#86ddd0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--teal) 9%,transparent) 1px,transparent 1px);background-size:26px 26px;color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6;transition:background-color .15s,color .15s}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid #a6cecc;color:var(--tx);--ink:var(--tx)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:1100px;margin:auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:400 24px var(--dsp);margin-inline-end:auto;cursor:pointer;color:var(--teal)}
.logo{width:34px;height:34px;background:var(--tealS);border-radius:12px;display:grid;place-items:center;color:var(--teal);font-size:20px}
.ib{border:1px solid var(--ink);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font-size:14px;text-decoration:none}

.menu-trigger{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--teal);background:var(--tealS);color:var(--teal);border-radius:12px;padding:7px 13px;font-size:14px;font-weight:700;transition:transform .12s,background-color .15s}
.menu-trigger:hover{background:var(--teal);color:#fff}
.menu-trigger .bars{display:flex;flex-direction:column;gap:3.5px;width:18px}
.menu-trigger .bars i{display:block;height:2.2px;width:100%;background:currentColor;border-radius:4px}
.menu-trigger .menu-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.drawer-backdrop{position:fixed;inset:0;background:rgba(6,28,39,.52);backdrop-filter:blur(3px);z-index:90;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease}
.drawer-backdrop.open{opacity:1;visibility:visible}
.nav-drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(315px,86vw);background:var(--card);color:var(--tx);z-index:95;box-shadow:0 20px 60px rgba(3,29,50,.35);border-inline-end:1px solid color-mix(in srgb,var(--teal) 24%,transparent);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .26s cubic-bezier(.16,1,.3,1)}
:root[dir="ltr"] .nav-drawer{transform:translateX(-105%)}
.nav-drawer.open{transform:translateX(0)!important}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid color-mix(in srgb,var(--teal) 18%,transparent);background:color-mix(in srgb,var(--tealS) 45%,var(--card))}
.drawer-title{font:400 22px var(--dsp);color:var(--teal);display:flex;align-items:center;gap:8px}
.drawer-close{border:1px solid color-mix(in srgb,var(--teal) 25%,transparent);background:var(--card);color:var(--tx);width:36px;height:36px;border-radius:10px;font-size:16px;display:grid;place-items:center}
.drawer-body{flex:1;overflow-y:auto;padding:14px 12px 24px;display:flex;flex-direction:column;gap:16px}
.drawer-sec-lbl{font-size:11.5px;font-weight:700;color:var(--tx2);padding:0 10px;margin-bottom:6px;letter-spacing:.2px}
.drawer-group{display:flex;flex-direction:column;gap:4px}
.drawer-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--tx);font-size:14.5px;font-weight:600;border:1px solid transparent;transition:background-color .15s,color .15s;cursor:pointer}
.drawer-link:hover{background:color-mix(in srgb,var(--tealS) 65%,transparent);color:var(--teal)}
.drawer-link.on{background:var(--teal);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--teal) 28%,transparent)}
.drawer-link .dl-main{display:flex;align-items:center;gap:10px}
.drawer-link .dl-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--tealS) 80%,transparent);color:var(--teal);font-size:14px;flex:none}
.drawer-link.on .dl-ico{background:rgba(255,255,255,.2);color:#fff}
.drawer-pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--tealS);color:var(--teal);font-weight:700}
.drawer-link.on .drawer-pill{background:rgba(255,255,255,.22);color:#fff}

main{padding:18px max(14px,calc((100% - 1100px)/2)) 40px;min-height:80svh}
h1,h2,h3{font-family:var(--dsp);font-weight:400;margin:0 0 8px}h1{font-size:clamp(34px,7vw,58px);line-height:1.1}h2{font-size:26px;margin-top:26px}h3{font-size:22px}
.sub{color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--teal) 22%,transparent);border-radius:18px;padding:16px;box-shadow:0 6px 28px #095b6310}
.meta{color:var(--tx2);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.btn{border:1px solid var(--ink);border-radius:12px;padding:8px 16px;background:var(--red);color:#fff;font-weight:700;min-height:42px}.btn.t{background:var(--teal)}.btn.g{background:var(--card);color:var(--tx)}.btn:disabled{opacity:.55}
.btn:active{transform:translate(2px,2px)}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--sun);color:#17140D}.tag.r{background:var(--red);color:#fff}
.price{font-weight:700;color:var(--red)}.ig{color:var(--red);font-weight:700;text-decoration:none;unicode-bidi:isolate}
.ig-wrap{display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.hero{background:var(--sun);border:3px solid var(--ink);border-radius:26px;box-shadow:9px 9px 0 var(--ink);color:#17140D;padding:26px 22px;margin-bottom:18px;min-width:0;overflow-wrap:anywhere}
.hero>*{min-width:0}
.hero .sub{color:#3d3412}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stats div{background:#fff;border:2.5px solid #17140D;border-radius:12px;padding:6px 16px}.stats b{display:block;font:400 30px var(--dsp);color:var(--red)}
.prog-wrap{margin-top:12px;background:rgba(255,255,255,.72);border:2px solid #17140D;border-radius:12px;padding:8px 12px}
.prog-bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:6px;border:1px solid #17140D}
.prog-bar>i{display:block;height:100%;background:var(--teal);transition:width .25s}
.act-item{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
label{display:block;font-size:13px;color:var(--tx2)}
input,select,textarea{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px;min-width:0}label input{width:100%;margin:2px 0 8px}textarea{width:100%;min-height:90px}
.fld{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row input{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:start;border-bottom:2px solid var(--ink)}th{background:var(--sun);color:#17140D;font:400 16px var(--dsp)}.scroll{overflow-x:auto}
.av{width:104px;height:104px;object-fit:cover;background:var(--sun);color:#17140D;display:grid;place-items:center;font-size:14px;border:3px solid var(--ink);border-radius:38% 62% 55% 45%/48% 42% 58% 52%;box-shadow:4px 4px 0 var(--ink);margin:auto;overflow:hidden}
.crop-box{margin:10px auto;padding:12px;border:2px dashed var(--ink);border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,transparent);text-align:start}
.crop-stage{position:relative;width:150px;height:150px;margin:8px auto;border:3px solid var(--ink);border-radius:38% 62% 55% 45%/48% 42% 58% 52%;overflow:hidden;background:#0e1620;touch-action:none;user-select:none;cursor:grab}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;top:50%;left:50%;transform-origin:center;max-width:none;pointer-events:none}
.crop-sliders{display:grid;gap:6px;margin-top:8px}
.crop-sliders label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.crop-sliders input[type="range"]{flex:1;padding:0;border:0;background:transparent}
.qr{width:120px;height:120px;background:#fff;padding:6px;border-radius:8px;display:block;margin:8px 0}
.star{background:none;border:0;font-size:28px;color:#B8C4D0;padding:0 2px}.star.on{color:#F5A623}

.z-override-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 16px;background:linear-gradient(90deg,#0c3559,#124963);border-bottom:2px solid #38bdf8;color:#e0f2fe;font-size:13px;z-index:4}
.z-override-banner strong{color:#7dd3fc}
.z-tile.main-share.stage-override{border-color:#38bdf8;border-width:3px;box-shadow:0 0 0 3px rgba(56,189,248,.32),0 14px 34px rgba(0,0,0,.55)}
.z-stage-tag{position:absolute;top:10px;inset-inline-start:10px;z-index:5;background:rgba(10,25,41,.92);border:1.5px solid #38bdf8;color:#e0f2fe;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.z-co-card{background:color-mix(in srgb,var(--tealS) 45%,var(--card));border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);border-radius:12px;padding:12px;margin-top:8px}
.z-pres-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--tealS) 80%,var(--card));border:1px solid var(--teal);color:var(--teal);font-size:12px;font-weight:700}

.z-wrap{background:#0d202b;border:1px solid #2c5962;border-radius:20px;box-shadow:0 16px 44px #052c3920;color:#f3f4f6;overflow:hidden;position:relative;display:flex;flex-direction:column}
.z-wrap.expanded{position:fixed;inset:0;z-index:60;border-radius:0;border:0;width:100vw;height:100svh;max-height:100svh;background:#090a0d}
.z-wrap.expanded .z-top,
.z-wrap.expanded .z-host-bar,
.z-wrap.expanded .z-health-strip,
.z-wrap.expanded .z-hands-alert,
.z-wrap.expanded .z-side{display:none!important}
.z-wrap.expanded .z-body{flex:1;min-height:0;grid-template-columns:1fr!important}
.z-wrap.expanded .z-stage{min-height:0;height:100%;padding:8px;gap:6px}
.z-focus-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:#161922;border-bottom:1px solid #2b3040;border-radius:10px;width:100%}

.z-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#102c37;border-bottom:1px solid #2b2e36;flex-wrap:wrap}
.z-top-badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;flex-wrap:wrap}
.z-dot{width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444}
.z-pill{background:#262932;border:1px solid #383c47;border-radius:999px;padding:4px 10px;font-size:12px;color:#cbd5e1}
.z-host-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 16px;background:#17202e;border-bottom:1px solid #26364d;font-size:12px;color:#bae6fd}
.z-hands-alert{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:#262111;border-bottom:1px solid #4d3f14;color:#fde68a;font-size:13px;align-items:center}
.z-hand-chip{display:inline-flex;align-items:center;gap:6px;background:#3a3012;border:1px solid #f59e0b;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fef3c7}
.z-body{display:grid;grid-template-columns:1fr;min-height:420px;position:relative}
.z-body.with-side{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:820px){.z-body.with-side{grid-template-columns:1fr}}
.z-stage{position:relative;background:radial-gradient(ellipse at top,#163b46,#0b1c27);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;min-height:380px;gap:10px;overflow:hidden}
.z-stage.audio-only{background:radial-gradient(circle at center,#1f2330 0%,#0d0e11 75%)}
.z-empty{text-align:center;max-width:340px;margin:auto}
.z-empty h3{color:#fff;font-size:20px;margin-bottom:12px}
.z-empty-btn{display:block;width:100%;padding:10px 14px;margin-bottom:8px;border-radius:10px;border:1px solid #3b3f4c;background:#232630;color:#e5e7eb;font-weight:600}
.z-empty-btn:hover{background:#2d313e}
.z-media-grid{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr);gap:10px;width:100%;height:100%}
.z-tile{position:relative;background:#161820;border:2px solid #343848;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.z-tile.main-share{min-height:290px;flex:1}
.z-wrap.expanded .z-tile.main-share{min-height:0;height:100%;border-radius:12px}
.z-tile video,.z-tile img{width:100%;height:100%;max-height:66svh;object-fit:contain;background:#090a0d}
.z-wrap.expanded .z-tile video,.z-wrap.expanded .z-tile img{max-height:100%}
.z-tile.cam-tile video{object-fit:cover}
.z-doc-box{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:8px;overflow:hidden}
.z-doc-toolbar{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;background:#171a22;padding:6px 10px;border-radius:10px;border:1px solid #2d3240}
.z-pdf-wrap{width:100%;flex:1;min-height:0;overflow:auto;background:#111318;border:1px solid #383c49;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center}
#z-pdf-canvas,.z-shared-page-img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:6px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45);object-fit:contain}
.z-slide-card{width:100%;height:100%;min-height:240px;background:linear-gradient(145deg,#1b1f2b,#12151e);border:1px solid #363c4d;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow:hidden}
.z-slide-lines{max-width:820px;width:100%;text-align:start;background:rgba(10,12,18,.65);border:1px solid #2d3344;border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;line-height:1.7;color:#f1f5f9;max-height:38svh;overflow-y:auto}
.z-avatar-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px}
.z-avatar-circle{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#1e6fd9);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.z-peers-strip{display:flex;flex-wrap:wrap;gap:8px;width:100%;justify-content:center}
.z-peer-card{background:#181b24;border:1px solid #343949;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:150px}
.z-peer-card video{width:112px;height:72px;border-radius:8px;object-fit:contain;background:#090a0d}
.z-meter{display:inline-flex;align-items:center;gap:6px;background:#1f222b;border:1px solid #343844;border-radius:999px;padding:4px 10px;font-size:12px}
.z-bar{width:64px;height:6px;background:#323642;border-radius:999px;overflow:hidden}
.z-bar>i{display:block;height:100%;width:0%;background:#22c55e;transition:width .06s linear}
.z-reactions-stack{position:absolute;top:10px;inset-inline-end:10px;display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none}
.z-reaction-pop{background:rgba(24,27,36,.94);border:1px solid #525a70;border-radius:999px;padding:5px 12px;font-size:14px;color:#fff;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.45)}

/* Direct Stage Annotation, Laser, Sticky Notes & Floating Board */
.z-stage-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#152836;border-bottom:1px solid #2a475c;padding:7px 12px;font-size:12px}
.z-tool-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.z-tbtn{height:28px;padding:0 9px;border-radius:8px;border:1px solid #335169;background:#1e3649;color:#f1f5f9;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.z-tbtn.on{background:#0e9384;border-color:#2dd4bf;color:#fff}
.z-swatch{width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.35);padding:0}
.z-swatch.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 2px #14b8a6}
.z-color{width:22px;height:22px;padding:0;border:0;background:none}
.z-range{width:64px;accent-color:#14b8a6;cursor:pointer}
.z-live-overlay{position:absolute;inset:0;width:100%;height:100%;z-index:18;touch-action:none}
.z-live-overlay.draw-active{cursor:crosshair;pointer-events:auto}
.z-live-overlay.draw-passive{pointer-events:none}
.z-laser-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#ef4444;box-shadow:0 0 14px 4px rgba(239,68,68,.85);transform:translate(-50%,-50%);pointer-events:none;z-index:24;display:none}
.z-stage-note{position:absolute;z-index:22;background:rgba(255,251,204,.96);color:#111827;border:2px solid #0e9384;border-radius:10px;padding:6px 8px;box-shadow:0 10px 24px rgba(0,0,0,.4);min-width:160px;max-width:320px;touch-action:none}
.z-stage-note-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;font-weight:800;color:#0f766e;cursor:grab;margin-bottom:4px;user-select:none}
.z-stage-note textarea{width:100%;min-height:52px;resize:both;border:1px solid #cbd5e1;border-radius:6px;padding:5px 7px;font-size:13px;line-height:1.45;background:#fff;color:#111827}
.z-stage-note-text{white-space:pre-wrap;font-size:13px;line-height:1.5;font-weight:600;color:#111827}
.z-note-float{position:absolute;top:14px;inset-inline-end:14px;width:410px;height:300px;min-width:240px;min-height:170px;max-width:calc(100% - 14px);max-height:calc(100% - 14px);background:#151a26;border:2px solid #14b8a6;border-radius:14px;box-shadow:0 18px 42px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;z-index:26;touch-action:none}
.z-note-float.minimized{height:auto!important;min-height:0;width:auto;min-width:200px}
.z-note-float.student-view{border-color:#38bdf8}
.z-note-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:#1e2638;border-bottom:1px solid #2f3a54;cursor:grab;user-select:none}
.z-note-hd:active{cursor:grabbing}
.z-note-tools{display:flex;align-items:center;justify-content:space-between;gap:5px;flex-wrap:wrap;padding:5px 8px;background:#192030;border-bottom:1px solid #283248;touch-action:auto}
.z-note-body{position:relative;flex:1;width:100%;height:100%;background:#ffffff;overflow:hidden;touch-action:none}
.z-note-body.dark-board{background:#101520}
.z-note-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.z-note-canvas.readonly{cursor:default}
.z-resize-handle{position:absolute;bottom:0;inset-inline-start:0;width:18px;height:18px;cursor:nesw-resize;background:linear-gradient(45deg,#14b8a6 0%,#14b8a6 45%,transparent 45%);border-top-right-radius:6px;z-index:20}

const st={lang:ls("lang")||"ar",user:null,adm:false,ready:false,regMode:false,me:{},regs:{},items:[],ads:[],team:[],lecs:[],revs:[],about:"",zoom:null,seeded:null,metaSrv:false,all:[],studs:[],filt:"",rs:0,fc:"",zok:0,crops:{},menuOpen:false};
Object.assign(st,{inbox:[],readMessages:new Set(),templates:{},presenter:null,presenters:[],pushConfig:{},pushReady:false,inboxError:"",bulkBusy:false,bulkProgress:"",noticeSession:0});
Object.assign(st,{coPresenters:[],stageOwner:{name:"",uid:"",isAdmin:false,active:false,ts:0}});

function parseCoPresenterNames(n1,n2="",n3=""){
  const a=String(n1||"").trim();
  const b=String(n2||"").trim();
  const c=String(n3||"").trim();
  if(!a)return{ok:false,names:[],error:A("الاسم الأول للمسؤول إجباري ولا يمكن تركه فارغًا.","The first presenter name is required.")};
  const list=Array.from(new Set([a,b,c].filter(Boolean))).slice(0,3);
  return{ok:true,names:list,error:""};
}
function isNameInCoPresenters(name){
  const target=String(name||"").trim().toLowerCase();
  if(!target)return false;
  return (st.coPresenters||[]).some(n=>String(n||"").trim().toLowerCase()===target);
}
function hasPresenterRole(){
  if(!st.user)return false;
  if(st.adm)return true;
  const sameRoom=!st.zoom?.ts||String(st.presenter?.roomId||"")===String(st.zoom?.ts||"");
  if(st.presenter?.enabled&&sameRoom)return true;
  const myNames=[st.me?.name,st.user?.displayName,st.user?.email?.split("@")[0]].filter(Boolean);
  return myNames.some(isNameInCoPresenters);
}

  return{
    senderUid:st.user?.uid||"",
    roomId:ZS.roomId||String(st.zoom?.ts||""),
    strokes:LIVE.strokes,

    boardStrokes:LIVE.boardStrokes,
    boardActive:LIVE.boardActive,
    boardNotes:LIVE.boardNotes,
    ts:Date.now()
  };
}

function broadcastAnnOverPeers(payload){
  if(!payload)return;
  const wire=JSON.stringify({__alnoorAnn:1,payload});
  if(useSFU()&&ZS.sfu?.state==="connected"){
    try{ZS.sfu.localParticipant.publishData(new TextEncoder().encode(wire),{reliable:true,topic:"alnoor-ann-sync"})}catch(e){}
  }
  ZS.peers.forEach(c=>{
    if(c.chat?.readyState==="open"){
      try{c.chat.send(wire)}catch(e){}
    }
  });
}

function emitLiveAnnotation(){
  LIVE.seq=(LIVE.seq||0)+1;
  const payload=buildAnnPayload();
  try{annBC?.postMessage({kind:"alnoor_ann",payload})}catch(e){}
  broadcastAnnOverPeers(payload);
}

function updateAnnNoteDoms(){
  for(const n of LIVE.notes){
    const el=document.querySelector(`[data-ann-note-view="${n.id}"]`);
    if(el)el.textContent=n.text||"";
    const box=document.querySelector(`[data-ann-note-box="${n.id}"]`);
    if(box){box.style.left=n.x+"px";box.style.top=n.y+"px"}
  }
  for(const n of LIVE.boardNotes){
    const el=document.querySelector(`[data-bann-note-view="${n.id}"]`);
    if(el)el.textContent=n.text||"";
    const box=document.querySelector(`[data-bann-note-box="${n.id}"]`);
    if(box){box.style.left=n.x+"px";box.style.top=n.y+"px"}
  }
}

function updateAnnLaserDot(){
  const dot=$("z-laser-dot");
  const overlay=$("z-live-overlay");
  if(!dot||!overlay)return;
  if(!LIVE.laser||!LIVE.laser.active){dot.style.display="none";return}
  const r=overlay.getBoundingClientRect();
  dot.style.display="block";
  dot.style.left=(LIVE.laser.x*r.width)+"px";
  dot.style.top=(LIVE.laser.y*r.height)+"px";
}

function drawAnnStroke(ctx,stStroke,cw,ch){
  if(!stStroke||!stStroke.pts||!stStroke.pts.length)return;
  ctx.save();
  const pts=stStroke.pts.map(p=>({x:p.x*cw,y:p.y*ch}));
  const scale=Math.max(1,(stStroke.size||5)*(Math.min(cw,ch)/500));
  if(stStroke.tool==="eraser"){
    ctx.globalCompositeOperation="destination-out";
    ctx.strokeStyle="rgba(0,0,0,1)";
    ctx.lineWidth=scale*4.2;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
    ctx.restore();
    return;
  }
  if(stStroke.tool==="highlighter"){
    ctx.globalAlpha=0.36;
    ctx.strokeStyle=stStroke.color||"#facc15";
    ctx.lineWidth=scale*4.5;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
    ctx.restore();
    return;
  }
  if(stStroke.tool==="rect"){
    const p0=pts[0],p1=pts[pts.length-1];
    ctx.globalAlpha=0.95;
    ctx.strokeStyle=stStroke.color||"#ef4444";
    ctx.lineWidth=Math.max(2.5,scale*0.85);
    ctx.strokeRect(p0.x,p0.y,p1.x-p0.x,p1.y-p0.y);
    ctx.restore();
    return;
  }
  ctx.globalAlpha=0.96;
  ctx.strokeStyle=stStroke.color||"#ef4444";
  ctx.lineWidth=Math.max(2,scale*0.75);
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
  ctx.restore();
}

function paintAnnOverlay(){
  const canvas=$("z-live-overlay");
  if(!canvas)return;
  const r=canvas.getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const s of LIVE.strokes)drawAnnStroke(ctx,s,canvas.width,canvas.height);
  if(LIVE.activeStroke)drawAnnStroke(ctx,LIVE.activeStroke,canvas.width,canvas.height);
}

function paintAnnBoard(){
  const canvas=$("z-board-canvas");
  const body=$("z-board-body");
  if(!canvas||!body)return;
  const r=body.getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.strokeStyle=LIVE.boardDark?"rgba(148,163,184,.08)":"rgba(15,23,42,.06)";
  ctx.lineWidth=1;
  const step=Math.max(24,Math.round(28*dpr));
  for(let y=step;y<canvas.height;y+=step){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
  }
  ctx.restore();
  for(const s of LIVE.boardStrokes)drawAnnStroke(ctx,s,canvas.width,canvas.height);
  if(LIVE.boardActive)drawAnnStroke(ctx,LIVE.boardActive,canvas.width,canvas.height);
}

function applyAnnBoardGeometry(){
  const box=$("z-board-float");
  const stage=document.querySelector(".z-stage");
  if(!box||!stage)return;
  const sr=stage.getBoundingClientRect();
  box.style.width=Math.min(LIVE.boardW,Math.max(240,sr.width-14))+"px";
  if(!LIVE.boardMinimized){
    box.style.height=Math.min(LIVE.boardH,Math.max(170,sr.height-14))+"px";
  }else{
    box.style.height="auto";
  }
  if(typeof LIVE.boardX==="number"&&typeof LIVE.boardY==="number"){
    const maxX=Math.max(6,sr.width-box.offsetWidth-6);
    const maxY=Math.max(6,sr.height-box.offsetHeight-6);
    LIVE.boardX=Math.max(6,Math.min(maxX,LIVE.boardX));
    LIVE.boardY=Math.max(6,Math.min(maxY,LIVE.boardY));
    box.style.left=LIVE.boardX+"px";
    box.style.top=LIVE.boardY+"px";
    box.style.right="auto";
    box.style.insetInlineEnd="auto";
  }
}

function applyIncomingAnnPayload(d){
  if(!d)return;
  if(d.senderUid&&d.senderUid===st.user?.uid)return;
  let needRedraw=false;
  if(Array.isArray(d.strokes))LIVE.strokes=d.strokes;
  LIVE.activeStroke=d.activeStroke||null;
  LIVE.laser=d.laser||null;
  if(Array.isArray(d.notes)){
    if(LIVE.notes.length!==d.notes.length)needRedraw=true;
    LIVE.notes=d.notes;
  }
  if(typeof d.boardOpen==="boolean"&&(d.boardOpen!==LIVE.boardOpen||d.boardMinimized!==LIVE.boardMinimized||d.boardDark!==LIVE.boardDark)){
    LIVE.boardOpen=d.boardOpen;
    LIVE.boardMinimized=!!d.boardMinimized;
    LIVE.boardDark=!!d.boardDark;
    needRedraw=true;
  }
  if(typeof d.boardX==="number")LIVE.boardX=d.boardX;
  if(typeof d.boardY==="number")LIVE.boardY=d.boardY;
  if(typeof d.boardW==="number")LIVE.boardW=d.boardW;
  if(typeof d.boardH==="number")LIVE.boardH=d.boardH;
  if(Array.isArray(d.boardStrokes))LIVE.boardStrokes=d.boardStrokes;
  LIVE.boardActive=d.boardActive||null;
  if(Array.isArray(d.boardNotes)){
    if(LIVE.boardNotes.length!==d.boardNotes.length)needRedraw=true;
    LIVE.boardNotes=d.boardNotes;
  }
  if(needRedraw&&route()=="zoom-alnoor"&&$("zr")){
    draw();
  }else{
    paintAnnOverlay();
    paintAnnBoard();
    updateAnnLaserDot();
    updateAnnNoteDoms();
    applyAnnBoardGeometry();
  }
}

if(annBC){
  annBC.onmessage=ev=>{
    if(ev.data?.kind==="alnoor_ann"&&ev.data.payload){
      applyIncomingAnnPayload(ev.data.payload);
    }
  };
}

function bindLiveAnnotationInteractions(){
  const overlay=$("z-live-overlay");
  if(overlay&&canPresent()){
    let active=false;
    const norm=ev=>{
      const r=overlay.getBoundingClientRect();
      return{
        x:Math.max(0,Math.min(1,(ev.clientX-r.left)/Math.max(1,r.width))),
        y:Math.max(0,Math.min(1,(ev.clientY-r.top)/Math.max(1,r.height)))
      };
    };
    overlay.onpointerdown=ev=>{
      if(!LIVE.drawMode)return;
      if(ev.button!==0&&ev.pointerType==="mouse")return;
      ev.preventDefault();
      overlay.setPointerCapture?.(ev.pointerId);
      const pt=norm(ev);
      active=true;
      if(LIVE.tool==="laser"){
        LIVE.laser={x:pt.x,y:pt.y,active:true};
        updateAnnLaserDot();
        emitLiveAnnotation();
        return;
      }
      LIVE.redoStack=[];
      LIVE.activeStroke={tool:LIVE.tool,color:LIVE.color,size:LIVE.size,pts:[pt]};
      paintAnnOverlay();
      emitLiveAnnotation();
    };
    overlay.onpointermove=ev=>{
      if(!active||!LIVE.drawMode)return;
      ev.preventDefault();
      const pt=norm(ev);
      if(LIVE.tool==="laser"){
        LIVE.laser={x:pt.x,y:pt.y,active:true};
        updateAnnLaserDot();
        emitLiveAnnotation();
        return;
      }
      if(!LIVE.activeStroke)return;
      if(LIVE.tool==="rect"){
        if(LIVE.activeStroke.pts.length===1)LIVE.activeStroke.pts.push(pt);
        else LIVE.activeStroke.pts[1]=pt;
      }else{
        LIVE.activeStroke.pts.push(pt);
      }
      paintAnnOverlay();
      emitLiveAnnotation();
    };
    const endPtr=()=>{
      if(!active)return;
      active=false;
      if(LIVE.tool==="laser"){
        LIVE.laser=null;
        updateAnnLaserDot();
        emitLiveAnnotation();
        return;
      }
      if(LIVE.activeStroke&&LIVE.activeStroke.pts.length)LIVE.strokes.push(LIVE.activeStroke);
      LIVE.activeStroke=null;
      paintAnnOverlay();
      emitLiveAnnotation();
    };
    overlay.onpointerup=endPtr;
    overlay.onpointercancel=endPtr;
  }

  document.querySelectorAll("[data-ann-note-in]").forEach(ta=>{
    ta.oninput=()=>{
      const item=LIVE.notes.find(n=>n.id===ta.dataset.annNoteIn);
      if(item){item.text=ta.value;emitLiveAnnotation()}
    };
  });
  document.querySelectorAll("[data-ann-note-drag]").forEach(hd=>{
    if(!canPresent())return;
    hd.onpointerdown=ev=>{
      ev.preventDefault();
      hd.setPointerCapture?.(ev.pointerId);
      const note=LIVE.notes.find(n=>n.id===hd.dataset.annNoteDrag);
      const stage=document.querySelector(".z-stage");
      if(!note||!stage)return;
      const sr=stage.getBoundingClientRect();
      const sx=ev.clientX,sy=ev.clientY,ox=note.x,oy=note.y;
      const onMove=me=>{
        note.x=Math.max(6,Math.min(sr.width-160,ox+(me.clientX-sx)));
        note.y=Math.max(6,Math.min(sr.height-80,oy+(me.clientY-sy)));
        updateAnnNoteDoms();
        emitLiveAnnotation();
      };
      const onUp=()=>{hd.removeEventListener("pointermove",onMove);hd.removeEventListener("pointerup",onUp)};
      hd.addEventListener("pointermove",onMove);
      hd.addEventListener("pointerup",onUp);
    };
  });

  const bCanvas=$("z-board-canvas");
  if(bCanvas&&canPresent()){
    let bDraw=false;
    const bNorm=ev=>{
      const r=bCanvas.getBoundingClientRect();
      return{
        x:Math.max(0,Math.min(1,(ev.clientX-r.left)/Math.max(1,r.width))),
        y:Math.max(0,Math.min(1,(ev.clientY-r.top)/Math.max(1,r.height)))
      };
    };
    bCanvas.onpointerdown=ev=>{
      ev.preventDefault();
      bCanvas.setPointerCapture?.(ev.pointerId);
      bDraw=true;
      LIVE.boardActive={tool:LIVE.boardTool,color:LIVE.boardColor,size:LIVE.boardSize,pts:[bNorm(ev)]};
      paintAnnBoard();
      emitLiveAnnotation();
    };
    bCanvas.onpointermove=ev=>{
      if(!bDraw||!LIVE.boardActive)return;
      ev.preventDefault();
      const pt=bNorm(ev);
      if(LIVE.boardTool==="rect"){
        if(LIVE.boardActive.pts.length===1)LIVE.boardActive.pts.push(pt);
        else LIVE.boardActive.pts[1]=pt;
      }else{
        LIVE.boardActive.pts.push(pt);
      }
      paintAnnBoard();
      emitLiveAnnotation();
    };
    const bEnd=()=>{
      if(!bDraw)return;
      bDraw=false;
      if(LIVE.boardActive&&LIVE.boardActive.pts.length)LIVE.boardStrokes.push(LIVE.boardActive);
      LIVE.boardActive=null;
      paintAnnBoard();
      emitLiveAnnotation();
    };
    bCanvas.onpointerup=bEnd;
    bCanvas.onpointercancel=bEnd;
  }

  document.querySelectorAll("[data-bann-note-in]").forEach(ta=>{
    ta.oninput=()=>{
      const item=LIVE.boardNotes.find(n=>n.id===ta.dataset.bannNoteIn);
      if(item){item.text=ta.value;emitLiveAnnotation()}
    };
  });
  document.querySelectorAll("[data-bann-note-drag]").forEach(hd=>{
    if(!canPresent())return;
    hd.onpointerdown=ev=>{
      ev.preventDefault();
      hd.setPointerCapture?.(ev.pointerId);
      const note=LIVE.boardNotes.find(n=>n.id===hd.dataset.bannNoteDrag);
      const body=$("z-board-body");
      if(!note||!body)return;
      const br=body.getBoundingClientRect();
      const sx=ev.clientX,sy=ev.clientY,ox=note.x,oy=note.y;
      const onMove=me=>{
        note.x=Math.max(4,Math.min(br.width-140,ox+(me.clientX-sx)));
        note.y=Math.max(4,Math.min(br.height-65,oy+(me.clientY-sy)));
        updateAnnNoteDoms();
        emitLiveAnnotation();
      };
      const onUp=()=>{hd.removeEventListener("pointermove",onMove);hd.removeEventListener("pointerup",onUp)};
      hd.addEventListener("pointermove",onMove);
      hd.addEventListener("pointerup",onUp);
    };
  });

  const bDrag=$("z-board-drag"),bFloat=$("z-board-float"),stage=document.querySelector(".z-stage");
  if(bDrag&&bFloat&&stage&&canPresent()){
    bDrag.onpointerdown=ev=>{
      if(ev.target.closest("button"))return;
      ev.preventDefault();
      bDrag.setPointerCapture?.(ev.pointerId);
      const sr=stage.getBoundingClientRect(),br=bFloat.getBoundingClientRect();
      const sx=ev.clientX,sy=ev.clientY,ox=br.left-sr.left,oy=br.top-sr.top;
      const onMove=me=>{
        LIVE.boardX=Math.max(6,Math.min(sr.width-bFloat.offsetWidth-6,ox+(me.clientX-sx)));
        LIVE.boardY=Math.max(6,Math.min(sr.height-bFloat.offsetHeight-6,oy+(me.clientY-sy)));
        applyAnnBoardGeometry();
        emitLiveAnnotation();
      };
      const onUp=()=>{bDrag.removeEventListener("pointermove",onMove);bDrag.removeEventListener("pointerup",onUp)};
      bDrag.addEventListener("pointermove",onMove);
      bDrag.addEventListener("pointerup",onUp);
    };
  }

  const bResize=$("z-board-resize");
  if(bResize&&bFloat&&stage&&canPresent()){
    bResize.onpointerdown=ev=>{
      ev.preventDefault();ev.stopPropagation();
      bResize.setPointerCapture?.(ev.pointerId);
      const sr=stage.getBoundingClientRect(),br=bFloat.getBoundingClientRect();
      const sx=ev.clientX,sy=ev.clientY,ow=br.width,oh=br.height,oLeft=br.left-sr.left;
      const onMove=me=>{
        const dxLeft=sx-me.clientX;
        const nextW=Math.max(240,Math.min(sr.width-14,ow+dxLeft));
        const nextH=Math.max(170,Math.min(sr.height-14,oh+(me.clientY-sy)));
        LIVE.boardW=nextW;LIVE.boardH=nextH;
        LIVE.boardX=Math.max(6,oLeft-(nextW-ow));
        applyAnnBoardGeometry();
        paintAnnBoard();
        emitLiveAnnotation();
      };
      const onUp=()=>{bResize.removeEventListener("pointermove",onMove);bResize.removeEventListener("pointerup",onUp)};
      bResize.addEventListener("pointermove",onMove);
      bResize.addEventListener("pointerup",onUp);
    };
  }

  if($("ann-color-in")){
    $("ann-color-in").oninput=e=>{
      LIVE.color=e.target.value;
      if(LIVE.tool==="eraser")LIVE.tool="highlighter";
      draw();
    };
  }
  if($("ann-size-in")){
    $("ann-size-in").oninput=e=>{LIVE.size=Number(e.target.value)||5};
  }
}

}

function readTemplate(prefix){

async function changeRegistrationStatus(uid,item,status){
  if(!st.adm||!["pending","ok","done"].includes(status))throw new Error("Permission denied");
  const regRef=doc(db,"regs",uid),templateRef=doc(db,"messageTemplates",item);
  return runTransaction(db,async transaction=>{
    const registration=await transaction.get(regRef);
    const entry=registration.exists()?registration.data().list?.[item]:null;
    if(!entry)throw new Error(A("طلب التسجيل لم يعد موجودًا","Registration no longer exists"));
    if((entry.status||"pending")===status)return false;
    const template=await transaction.get(templateRef),content=template.exists()?template.data():{};
    const id="reg_"+await sha(uid+"|"+item+"|"+entry.ts+"|"+status);
    const notificationRef=doc(db,"notifications",id),existing=await transaction.get(notificationRef);
    transaction.update(regRef,{["list."+item+".status"]:status});
    if(!existing.exists()){
      const accepted=status==="ok",title=accepted?A("تم قبولك في ","Accepted: ")+entry.title:status==="done"?A("تم إكمال ","Completed: ")+entry.title:A("تحديث طلبك: ","Application update: ")+entry.title;
      const text=accepted?(content.message||A("مبروك! تم قبول طلبك. راجع التفاصيل مع الإدارة.","Your registration was accepted.")):A("تغيّرت حالة تسجيلك. راجع صندوق الرسائل ولوحتك.","Your registration status was updated.");
      transaction.set(notificationRef,{...notificationBody(title,text,accepted?content.url:"",uid,item),type:"registration",status,route:"inbox"});
    }
    return true;
  });
}
async function acceptFilteredRegistrations(){
  if(!st.adm||st.bulkBusy)return;
  const rows=st.all.filter(r=>(!st.filt||r.item===st.filt)&&(!r.status||r.status==="pending"));
  if(!rows.length)return toast(A("ما في طلبات معلّقة ضمن هذا الفلتر.","No pending registrations in this filter."));
  if(!confirm(A(`قبول ${rows.length} طلبًا وإرسال رسالة القبول المحفوظة لكل طلب؟`,`Accept ${rows.length} registrations and deliver their saved acceptance messages?`)))return;
  st.bulkBusy=true;let done=0,failed=0,skipped=0,processed=0;const queue=[...rows];
  const worker=async()=>{while(queue.length){const row=queue.shift();try{if(await changeRegistrationStatus(row.uid,row.item,"ok"))done++;else skipped++}catch(e){failed++}processed++;st.bulkProgress=A(`تمت معالجة ${processed} من ${rows.length} — تعذّر ${failed} — سابقًا ${skipped}`,`Processed ${processed}/${rows.length}; failed ${failed}; already processed ${skipped}`);const el=$("bulk-progress");if(el)el.textContent=st.bulkProgress}};
  draw();
  try{await Promise.all(Array.from({length:Math.min(4,rows.length)},worker))}
  finally{st.bulkBusy=false;draw()}
  toast(failed?A(`تم قبول ${done}، وتعذّر ${failed}. أعد المحاولة للطلبات المتبقية.`,`Accepted ${done}; ${failed} failed. Retry remaining requests.`):A(`تم قبول ${done} وإيداع رسائلهم في الصندوق.`,`Accepted ${done}; messages delivered to the inbox.`));
}
async function syncPushStatusFromDevice(){
  if(!st.user)return;
  const localFlag=ls("alnoor_push_local")==="1"&&ls("alnoor_push_owner")===st.user.uid;
  if(!("Notification"in window)||Notification.permission!=="granted"){
    st.pushReady=false;
    return;
  }
  if(!("serviceWorker"in navigator)||!("PushManager"in window)){
    st.pushReady=localFlag;
    return;
  }
  try{
    const reg=await navigator.serviceWorker.getRegistration(new URL("./sw.js",location.href));
    const sub=await reg?.pushManager.getSubscription();
    st.pushReady=!!(sub||localFlag);
  }catch(e){
    st.pushReady=localFlag;
  }
}

let knownInboxIds=new Set(),inboxPrimed=false;
function listenCommunications(user){
  st.noticeSession++;const session=st.noticeSession;
  st.inbox=[];st.readMessages=new Set();st.inboxError="";st.templates={};st.presenter=null;st.presenters=[];st.pushReady=false;
  knownInboxIds=new Set();inboxPrimed=false;
  syncPushStatusFromDevice().then(()=>{if(session===st.noticeSession&&route()==="inbox")draw()});
  const notifRef=collection(db,"notifications");
  const buckets=new Map();
  let usedFallback=false;

  const publishMerged=()=>{
    if(session!==st.noticeSession)return;
    const merged=new Map();
    buckets.forEach(list=>list.forEach(item=>merged.set(item.id,item)));
    const messages=Array.from(merged.values())
      .sort((a,b)=>Number(b.ts||0)-Number(a.ts||0))
      .slice(0,100);
    const fresh=messages.filter(n=>!knownInboxIds.has(n.id));
    st.inbox=messages;
    knownInboxIds=new Set(messages.map(n=>n.id));
    st.inboxError="";
    if(inboxPrimed)fresh.slice(0,3).forEach(n=>{
      toast("✉ "+(n.title||A("رسالة جديدة في الصندوق","New inbox message")));
      if(!st.pushReady&&"Notification"in window&&Notification.permission==="granted")showOpenSiteNotification(n);
    });
    inboxPrimed=true;
    updateInboxBadge();
    if(route()==="inbox"||route()==="admin-secret-portal")draw();
  };

  const watchRecipient=(bucketKey,recipientVal)=>{
    const attach=(withOrder)=>{
      const q=withOrder
        ?query(notifRef,where("recipient","==",recipientVal),orderBy("ts","desc"),limit(100))
        :query(notifRef,where("recipient","==",recipientVal),limit(100));
      un.push(onSnapshot(q,snap=>{
        if(session!==st.noticeSession)return;
        buckets.set(bucketKey,L(snap));
        publishMerged();
      },error=>{
        if(session!==st.noticeSession)return;
        if(withOrder&&!usedFallback&&error?.code==="failed-precondition"){
          usedFallback=true;
          attach(false);
          return;
        }
        console.error("Inbox snapshot error:",error);
        st.inboxError=A("تعذر تحميل الرسائل: ","Could not load messages: ")+(error?.code||error?.message||A("تحقق من صلاحيات Firestore","Check Firestore rules"));
        if(route()==="inbox")draw();
      }));
    };
    attach(true);
  };

  watchRecipient("user",user.uid);
  watchRecipient("all","all");

  un.push(onSnapshot(collection(db,"notificationReads",user.uid,"messages"),snap=>{
    if(session!==st.noticeSession)return;st.readMessages=new Set(snap.docs.map(d=>d.id));updateInboxBadge();if(route()==="inbox")draw();
  }));
  un.push(onSnapshot(doc(db,"lecturePresenters",user.uid),snap=>{
    if(session!==st.noticeSession)return;
    const previously=canPresent();st.presenter=snap.exists()?snap.data():null;
    if(previously&&!canPresent()&&!st.adm){
      ZS.scr?.getTracks().forEach(t=>t.stop());ZS.scr=null;ZS.screenActive=0;ZS.sharedType="";ZS.sharedImg="";ZS.pageDataUrl="";
      releaseStageOverrideIfOwner();
      syncTracksToPeers();
    }
    if(ZS.joined){touchPresence(true);connectToPresentPeers()}draw();
  }));
  if(st.adm){
    un.push(sub(collection(db,"messageTemplates"),snap=>{const map={};snap.docs.forEach(d=>map[d.id]=d.data());st.templates=map},"templates"));
    un.push(sub(collection(db,"lecturePresenters"),snap=>st.presenters=L(snap),"presenters"));
  }
}

function vapidBytes(value){
  const base=String(value).replace(/-/g,"+").replace(/_/g,"/"),raw=atob(base+"=".repeat((4-base.length%4)%4));
  return Uint8Array.from(raw,c=>c.charCodeAt(0));

    }

    let subscription=await registration.pushManager.getSubscription();
    if(!subscription){

    if(st.user?.uid!==uid){await subscription.unsubscribe();return}
    await setDoc(doc(db,"pushDevices",id),{uid,subscription:subscription.toJSON(),enabled:true,updatedAt:Date.now()});

      tag:"alnoor-enabled",

function compressToDataUrl(file,maxW,maxH,maxLen){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type)||/svg/.test(file.type))return rej(new Error(A("اختر صورة صحيحة","Choose a valid image")));

    const c=document.createElement("canvas");let q=.86,out="";
    (function step(){c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);out=c.toDataURL("image/jpeg",q);

})}

function canvasToFastSyncedImage(canvas,maxLen=420000,maxDim=1024,quality=0.68){
  if(!canvas||!canvas.width||!canvas.height)return"";
  const tmp=document.createElement("canvas");
  let w=canvas.width,h=canvas.height;
  if(w>maxDim||h>maxDim){
    const k=Math.min(maxDim/w,maxDim/h);
    w=Math.max(1,Math.round(w*k));
    h=Math.max(1,Math.round(h*k));
  }
  tmp.width=w;tmp.height=h;
  const ctx=tmp.getContext("2d");
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(canvas,0,0,w,h);
  let out=tmp.toDataURL("image/jpeg",quality);
  if(out.length>maxLen){
    const s2=document.createElement("canvas");
    s2.width=Math.max(1,Math.round(w*0.72));
    s2.height=Math.max(1,Math.round(h*0.72));
    const c2=s2.getContext("2d");
    c2.fillStyle="#ffffff";
    c2.fillRect(0,0,s2.width,s2.height);
    c2.drawImage(tmp,0,0,s2.width,s2.height);
    out=s2.toDataURL("image/jpeg",0.52);
  }
  return out.length<=650000?out:"";
}

    if(!canPresent()||!ZS.joined){stopLiveFrameSync();return}
    const vid=ZS.scr?$("zsv"):(ZS.vidEl||$("z-shared-vid"));
    if(!vid||vid.readyState<2||!vid.videoWidth||!vid.videoHeight)return;
    const maxW=960;
    const scale=Math.min(1,maxW/vid.videoWidth);
    c.width=Math.max(1,Math.round(vid.videoWidth*scale));
    c.height=Math.max(1,Math.round(vid.videoHeight*scale));
    try{
      c.getContext("2d").drawImage(vid,0,0,c.width,c.height);
      const frame=c.toDataURL("image/jpeg",0.65);
      if(frame&&frame.length<480000){
        ZS.liveFrameUrl=frame;
        const payload=buildStagePayload({liveFrameUrl:frame,screenActive:!!ZS.scr});
        try{zoomBC?.postMessage({type:"liveFrame",frame})}catch(e){}
        broadcastStageOverPeers(payload);
        if(db&&st.user){

            uid:st.user.uid,
            roomId:ZS.roomId,
            sid:ZS.sid,
            name:displayName(),
            isAdmin:!!st.adm,
            isPresenter:canPresent()&&!st.adm,
            sharing:true,
            stagePayload:JSON.stringify(payload).slice(0,680000),
            lastSeen:Date.now()
          },{merge:true}).catch(()=>{});
        }
      }
    }catch(e){}
  },1200);
}

async function prefetchPdfPage(pageNum){
  if(!ZS.pdfDoc||pageNum<1||pageNum>ZS.pdfNumPages)return;
  if(pdfPageCache.has(pageNum)||pdfPrefetching.has(pageNum))return;
  pdfPrefetching.add(pageNum);
  try{
    const page=await ZS.pdfDoc.getPage(pageNum);
    const viewport=page.getViewport({scale:1.35});
    const c=document.createElement("canvas");
    c.width=Math.round(viewport.width);
    c.height=Math.round(viewport.height);
    await page.render({canvasContext:c.getContext("2d"),viewport}).promise;
    const dataUrl=canPresent()?canvasToFastSyncedImage(c):"";
    if(typeof createImageBitmap==="function"){
      const bmp=await createImageBitmap(c);
      pdfPageCache.set(pageNum,{w:c.width,h:c.height,bmp,dataUrl});
    }
  }catch(e){}finally{
    pdfPrefetching.delete(pageNum);
  }
}

async function renderPdfPageToCanvas(pageNum,shouldSync=false){
  const canvas=$("z-pdf-canvas");
  if(!canvas||!ZS.pdfDoc)return;
  const safePage=Math.max(1,Math.min(ZS.pdfNumPages||1,pageNum||1));
  ZS.pdfPage=safePage;
  const lbl=$("z-pdf-page-lbl");
  if(lbl)lbl.textContent=`${ZS.pdfPage} / ${ZS.pdfNumPages}`;

  const cached=pdfPageCache.get(safePage);
  if(cached){
    canvas.width=cached.w;
    canvas.height=cached.h;
    canvas.getContext("2d").drawImage(cached.bmp,0,0);
    if(canPresent()){
      const imgUrl=cached.dataUrl||canvasToFastSyncedImage(canvas);
      ZS.pageDataUrl=imgUrl;
      if(shouldSync)syncStageToCloud({pdfPage:ZS.pdfPage,pdfNumPages:ZS.pdfNumPages,pageDataUrl:ZS.pageDataUrl});
    }
    prefetchPdfPage(safePage+1);
    prefetchPdfPage(safePage-1);
    return;
  }

  if(ZS.pdfRendering)return;
  ZS.pdfRendering=true;
  try{
    const page=await ZS.pdfDoc.getPage(safePage);
    const viewport=page.getViewport({scale:1.35});
    const ctx=canvas.getContext("2d");
    canvas.width=Math.round(viewport.width);
    canvas.height=Math.round(viewport.height);
    await page.render({canvasContext:ctx,viewport}).promise;
    const dataUrl=canPresent()?canvasToFastSyncedImage(canvas):"";
    if(typeof createImageBitmap==="function"){
      createImageBitmap(canvas).then(bmp=>{
        pdfPageCache.set(safePage,{w:canvas.width,h:canvas.height,bmp,dataUrl});
      }).catch(()=>{});
    }
    if(canPresent()){
      ZS.pageDataUrl=dataUrl;
      if(shouldSync)syncStageToCloud({pdfPage:ZS.pdfPage,pdfNumPages:ZS.pdfNumPages,pageDataUrl:ZS.pageDataUrl});
    }
    prefetchPdfPage(safePage+1);
    prefetchPdfPage(safePage-1);
  }catch(e){
    console.error(e);
  }finally{
    ZS.pdfRendering=false;
  }
}

async function parsePptxSlides(file){
  const JSZip=await loadJsZip();
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const slideFiles=Object.keys(zip.files)
    .filter(n=>/^ppt\/slides\/slide\d+\.xml$/i.test(n))
    .sort((a,b)=>{
      const na=parseInt((a.match(/slide(\d+)\.xml/i)||[])[1]||"0",10);
      const nb=parseInt((b.match(/slide(\d+)\.xml/i)||[])[1]||"0",10);
      return na-nb;
    });
  if(!slideFiles.length)return[];
  const parser=new DOMParser();
  const slides=[];
  for(let i=0;i<slideFiles.length;i++){
    const xmlStr=await zip.files[slideFiles[i]].async("string");
    const xmlDoc=parser.parseFromString(xmlStr,"application/xml");
    const paragraphs=[...xmlDoc.getElementsByTagNameNS("*","p")];
    const lines=paragraphs.map(p=>{
      const runs=[...p.getElementsByTagNameNS("*","t")].map(t=>t.textContent||"").join("");
      return runs.trim();
    }).filter(Boolean);
    slides.push({
      index:i+1,
      text:lines.length?lines.join("\n"):A("شريحة مرئية","Visual slide")
    });
  }
  return slides;
}

function rememberChat(message){

  if(!message.id||typeof message.id!=="string"||ZS.chatSeen.has(message.id))return false;
  if(Math.abs(Date.now()-Number(message.ts))>60000||!Number.isFinite(Number(message.ts)))return false;
  ZS.chatSeen.add(message.id);
  if(ZS.chatSeen.size>1000)ZS.chatSeen=new Set(ZS.msgs.map(m=>m.id));
  ZS.msgs.push({id:message.id,text:message.text.slice(0,1500),who:String(message.who||"").slice(0,100),isAdmin:!!message.isAdmin,ts:message.ts});
  ZS.msgs=ZS.msgs.slice(-120);renderChatPanel();return true;
}

function setupChatChannel(c,channel){
  c.chat=channel;
  channel.onopen=()=>{
    if(canPresent()&&ZS.joined){
      const hasContent=!!(ZS.scr||ZS.screenActive||ZS.sharedType||ZS.sharedImg||ZS.sharedVid||ZS.pageDataUrl||ZS.liveFrameUrl);
      if(hasContent){
        try{channel.send(JSON.stringify({__alnoorStage:1,payload:buildStagePayload()}))}catch(e){}
      }
      if(LIVE.strokes.length||LIVE.notes.length||LIVE.boardOpen||LIVE.boardStrokes.length){
        try{channel.send(JSON.stringify({__alnoorAnn:1,payload:buildAnnPayload()}))}catch(e){}
      }
    }
  };
  channel.onmessage=ev=>{
    if(typeof ev.data!=="string"||ev.data.length>750000)return;
    try{
      const m=JSON.parse(ev.data);
      if(m&&m.__alnoorStage===1&&m.payload){
        if(m.payload.senderUid&&m.payload.senderUid!==st.user?.uid){
          applyRemoteStageData(m.payload);
          if(canPresent())broadcastStageOverPeers(m.payload);
          if(route()=="zoom-alnoor"&&$("zr"))draw();
        }
        return;
      }
      if(m&&m.__alnoorAnn===1&&m.payload){
        if(m.payload.senderUid&&m.payload.senderUid!==st.user?.uid){
          applyIncomingAnnPayload(m.payload);
          if(canPresent())broadcastAnnOverPeers(m.payload);
        }
        return;
      }
      if(ev.data.length>10000)return;
      if(rememberChat(m))broadcastChatToAll(m,c.uid);
    }catch(e){}
  };
}
function broadcastChatToAll(message,exceptUid=""){

    if(c.uid===exceptUid||c.chat?.readyState!=="open"||c.chat.bufferedAmount>262144)return;
    try{c.chat.send(data)}catch(e){}

function relayChat(message,except=""){

      if(epoch!==deviceTest.epoch){stream.getTracks().forEach(t=>t.stop());return}

      const analyser=deviceTest.ctx.createAnalyser();analyser.fftSize=256;deviceTest.ctx.createMediaStreamSource(stream).connect(analyser);
      const samples=new Uint8Array(analyser.frequencyBinCount);let peak=0;
      const meter=()=>{if(epoch!==deviceTest.epoch)return;analyser.getByteTimeDomainData(samples);let sum=0;for(const x of samples)sum+=(x-128)**2;const level=Math.min(100,Math.sqrt(sum/samples.length)*4);peak=Math.max(peak,level);if($("device-level"))$("device-level").value=level;deviceTest.raf=requestAnimationFrame(meter)};meter();

async function connectSfu(){
  if(!useSFU()||ZS.sfu||ZS.sfuConnecting||!ZS.joined)return;
  const endpoint=new URL(CONFERENCE.tokenEndpoint,location.href);
  if(endpoint.protocol!=="https:")throw new Error(A("رابط خادم الرموز يجب أن يستخدم HTTPS","Token endpoint must use HTTPS"));
  const epoch=ZS.sfuEpoch;ZS.sfuConnecting=true;
  let room;
  try{
    const idToken=await st.user.getIdToken();
    const response=await fetch(endpoint.href,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},body:JSON.stringify({roomId:ZS.roomId}),cache:"no-store",signal:AbortSignal.timeout(20000)});
    if(!response.ok)throw new Error(A("رفض خادم البث الدخول؛ تحقق من العضوية والصلاحيات","Media server denied entry; verify membership and permissions"));
    const access=await response.json();
    if(typeof access.url!=="string"||!access.url.startsWith("wss://")||typeof access.token!=="string")throw new Error(A("استجابة خادم البث غير صالحة","Invalid media server response"));
    const LK=ZS.sfuModule=await import(CONFERENCE.sdkUrl);
    if(!ZS.joined||epoch!==ZS.sfuEpoch)return;
    room=new LK.Room({adaptiveStream:false,dynacast:true,videoCaptureDefaults:{resolution:{width:1280,height:720,frameRate:24}},publishDefaults:{simulcast:true,videoEncoding:{maxBitrate:900000,maxFramerate:24},screenShareEncoding:{maxBitrate:1500000,maxFramerate:15}}});
    ZS.sfu=room;
    const updateSubscriptions=()=>{
      for(const participant of room.remoteParticipants.values()){
        for(const publication of participant.trackPublications.values()){
          publication.setSubscribed(true);
        }
      }
    };
    const updateParticipants=()=>{
      if(ZS.sfu!==room||!ZS.joined)return;
      const presence={};
      for(const participant of [room.localParticipant,...room.remoteParticipants.values()]){
        let isAdmin=false;try{isAdmin=JSON.parse(participant.metadata||"{}").role==="admin"}catch(e){}
        presence[participant.identity]={uid:participant.identity,name:participant.name||A("مشارك","Participant"),isAdmin,active:true,lastSeen:Date.now(),roomId:ZS.roomId};
      }
      ZS.presence=presence;updateSubscriptions();scheduleRtcRedraw();
    };
    room.on(LK.RoomEvent.ParticipantConnected,updateParticipants);
    room.on(LK.RoomEvent.TrackPublished,updateSubscriptions);
    room.on(LK.RoomEvent.ParticipantMetadataChanged,updateParticipants);
    room.on(LK.RoomEvent.TrackSubscribed,(track,publication,participant)=>{
      const S=LK.Track.Source;
      const role=publication.source===S.Microphone?"mic":publication.source===S.Camera?"cam":publication.source===S.ScreenShare?"screen":"sys";
      const info=ZS.remoteStreams.get(participant.identity)||{name:participant.name||A("مشارك","Participant"),streams:{}};
      try{const role=JSON.parse(participant.metadata||"{}").role;info.isAdmin=role==="admin";info.isPresenter=role==="presenter"}catch(e){info.isAdmin=false;info.isPresenter=false}
      info.streams[role]=new MediaStream([track.mediaStreamTrack]);
      ZS.remoteStreams.set(participant.identity,info);syncAudioElements();scheduleRtcRedraw();
    });
    room.on(LK.RoomEvent.TrackUnsubscribed,(track,publication,participant)=>{
      const info=ZS.remoteStreams.get(participant.identity);
      if(info)for(const role of Object.keys(info.streams)){if(info.streams[role].getTracks().includes(track.mediaStreamTrack))delete info.streams[role]}
      syncAudioElements();scheduleRtcRedraw();
    });
    room.on(LK.RoomEvent.ParticipantDisconnected,p=>{ZS.remoteStreams.delete(p.identity);syncAudioElements();updateParticipants()});
    room.on(LK.RoomEvent.DataReceived,(payload,participant,kind,topic)=>{
      if(!participant)return;
      if(topic==="alnoor-stage-sync"&&payload.byteLength<=750000){
        try{
          const m=JSON.parse(new TextDecoder().decode(payload));
          if(m?.__alnoorStage===1&&m.payload&&m.payload.senderUid!==st.user?.uid){
            applyRemoteStageData(m.payload);
            if(route()=="zoom-alnoor"&&$("zr"))draw();
          }
        }catch(e){}
        return;
      }
      if(topic==="alnoor-ann-sync"&&payload.byteLength<=750000){
        try{
          const m=JSON.parse(new TextDecoder().decode(payload));
          if(m?.__alnoorAnn===1&&m.payload&&m.payload.senderUid!==st.user?.uid){
            applyIncomingAnnPayload(m.payload);
          }
        }catch(e){}
        return;
      }
      if(topic!=="alnoor-live-chat"||payload.byteLength>10000)return;
      try{
        const m=JSON.parse(new TextDecoder().decode(payload));
        m.who=participant.name||A("مشارك","Participant");m.isAdmin=JSON.parse(participant.metadata||"{}").role==="admin";
        rememberChat(m);
      }catch(e){}
    });
    room.on(LK.RoomEvent.Reconnecting,()=>zs(A("جارٍ إعادة الاتصال…","Reconnecting…")));
    room.on(LK.RoomEvent.Reconnected,()=>{syncSfuTracks();syncAudioElements();scheduleRtcRedraw()});
    room.on(LK.RoomEvent.Disconnected,()=>{
      if(ZS.sfu!==room)return;
      ZS.sfu=null;ZS.sfuTracks.clear();ZS.remoteStreams.clear();syncAudioElements();scheduleRtcRedraw();
      if(ZS.joined)toast(A("انقطع البث. اضغط إعادة الاتصال.","Media disconnected. Press reconnect."));
    });
    await room.connect(access.url,access.token,{autoSubscribe:false});
    if(!ZS.joined||epoch!==ZS.sfuEpoch){await room.disconnect();return}
    updateParticipants();await syncSfuTracks();scheduleRtcRedraw();
  }catch(e){
    if(room){if(ZS.sfu===room)ZS.sfu=null;await room.disconnect().catch(()=>{})}
    throw new Error(A("تعذر الاتصال بخادم البث. تحقق من الخادم والصلاحيات والشبكة.","Could not connect to the media server. Check server, permissions and network."));
  }finally{if(epoch===ZS.sfuEpoch)ZS.sfuConnecting=false}
}
let sfuSyncQueue=Promise.resolve();
function syncSfuTracks(){
  sfuSyncQueue=sfuSyncQueue.catch(()=>{}).then(async()=>{
    const room=ZS.sfu,LK=ZS.sfuModule;
    if(!room||room.state!=="connected"||!LK)return;
    const sources={mic:LK.Track.Source.Microphone,cam:LK.Track.Source.Camera,screen:LK.Track.Source.ScreenShare,sys:LK.Track.Source.ScreenShareAudio};
    const wanted=desiredTracks();
    for(const role of Object.keys(sources)){
      const old=ZS.sfuTracks.get(role),next=wanted[role];
      if(old?.mediaStreamTrack===next)continue;
      if(old){await room.localParticipant.unpublishTrack(old,false);ZS.sfuTracks.delete(role)}
      if(next&&ZS.joined&&room===ZS.sfu){
        const publication=await room.localParticipant.publishTrack(next,{source:sources[role],name:role,simulcast:role==="cam",...(role==="mic"?{audioPreset:{maxBitrate:64000},dtx:false}:{})});
        ZS.sfuTracks.set(role,publication.track);
      }
    }
    syncSfuPermissions();
  });
  return sfuSyncQueue;
}
function syncSfuPermissions(){
  if(!canPresent()&&!ZS.roomCtrl.allowMic)ZS.micStream?.getAudioTracks().forEach(t=>t.enabled=false);
}

const MESH=true;
const imCaller=(uid,_peerTeaching)=>String(st.user?.uid||"")<String(uid||"");
const newId=()=>Math.random().toString(36).slice(2,10);

async function sendRtcSignal(c,type,data){
  if(!db||!st.user||!c)return;
  try{
    if(!ZS.joined||!ZS.roomId)return;
    await addDoc(collection(db,"zoom_rtc"),{roomId:ZS.roomId,from:st.user.uid,fromName:displayName(),fromAdmin:!!st.adm,fromPresenter:canPresent()&&!st.adm,fromSid:ZS.sid,to:c.uid,toSid:c.sid||"",cid:c.cid,type,data:JSON.stringify(data),ts:Date.now()});
  }catch(e){
    console.error(e);
    if(!ZS.sigErr){ZS.sigErr=1;toast("⚠️ "+A("تعذر إرسال إشارات الاتصال: افتح قواعد Firestore واسمح بـ zoom_rtc","Cannot send signaling: allow zoom_rtc in Firestore rules"))}
  }
}

function makePeer(uid,name,isAdmin,sid,cid,caller,isPresenter=false){
  const pc=new RTCPeerConnection(RTC_CFG);
  const c={pc,uid,sid:sid||"",cid,caller:!!caller,name:name||"",isAdmin:!!isAdmin,isPresenter:!!isPresenter,pending:[],q:Promise.resolve(),born:Date.now(),tr:{},makingOffer:false};
  ZS.peers.set(uid,c);
  if(caller)setupChatChannel(c,pc.createDataChannel("alnoor-ephemeral",{ordered:true}));
  pc.ondatachannel=ev=>{if(ev.channel.label==="alnoor-ephemeral")setupChatChannel(c,ev.channel)};
  if(caller){
    RTC_ROLES.forEach(([role,kind])=>{c.tr[role]=pc.addTransceiver(kind,{direction:"sendrecv"})});
    applyTracks(c);
  }
  pc.onicecandidate=ev=>{if(ev.candidate)sendRtcSignal(c,"ice",ev.candidate.toJSON())};
  pc.onnegotiationneeded=async()=>{
    if(!c.caller||c.makingOffer||pc.signalingState!=="stable")return;
    c.makingOffer=true;
    try{await pc.setLocalDescription();await sendRtcSignal(c,"desc",pc.localDescription.toJSON())}
    catch(e){console.error(e)}finally{c.makingOffer=false}
  };
  pc.ontrack=ev=>{
    if(!ZS.joined||ZS.peers.get(uid)!==c)return;
    const role=Object.keys(c.tr).find(r=>c.tr[r]===ev.transceiver)||RTC_ROLES[pc.getTransceivers().indexOf(ev.transceiver)]?.[0];
    if(!role)return;
    const info=ZS.remoteStreams.get(uid)||{streams:{}};
    info.name=c.name;info.isAdmin=c.isAdmin;info.isPresenter=c.isPresenter;
    info.streams[role]=new MediaStream([ev.track]);
    ZS.remoteStreams.set(uid,info);
    ev.track.onunmute=()=>{syncAudioElements();scheduleRtcRedraw()};
    ev.track.onended=()=>{delete info.streams[role];syncAudioElements();scheduleRtcRedraw()};
    syncAudioElements();scheduleRtcRedraw();
  };
  pc.oniceconnectionstatechange=()=>{
    if(pc.iceConnectionState==="failed"&&c.caller){try{pc.restartIce()}catch(e){}}
  };
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==="connected"){Object.keys(c.tr).forEach(r=>tuneSender(c.tr[r].sender,r));syncAudioElements()}
    scheduleRtcRedraw();
    if((s==="failed"||s==="closed")&&ZS.peers.get(uid)===c){closePeer(uid);setTimeout(connectToPresentPeers,2000)}
  };
  return c;
}

async function handleSignal(c,d,data){
  const pc=c.pc;
  try{
    if(d.type==="desc"){
      await pc.setRemoteDescription(data);
      for(const cand of c.pending.splice(0))await pc.addIceCandidate(cand).catch(()=>{});
      if(data.type==="offer"){
        const transceivers=pc.getTransceivers();
        RTC_ROLES.forEach(([role],index)=>{
          const transceiver=transceivers[index];
          if(transceiver){transceiver.direction="sendrecv";c.tr[role]=transceiver}
        });
        await applyTracks(c);
        await pc.setLocalDescription();
        await sendRtcSignal(c,"desc",pc.localDescription.toJSON());
      }
    }else if(d.type==="ice"){
      if(pc.remoteDescription)await pc.addIceCandidate(data).catch(e=>console.warn(e));
      else c.pending.push(data);
    }
  }catch(e){console.error(e)}
}

function routeSignal(d){
  if(!ZS.joined||d.roomId!==ZS.roomId)return;
  let data;try{data=JSON.parse(d.data)}catch(e){return}
  if(!data)return;
  const isOffer=d.type==="desc"&&data.type==="offer";
  let c=ZS.peers.get(d.from);
  if(c&&c.cid!==d.cid){
    if(c.caller)return;
    if(isOffer){closePeer(d.from);c=null}
    else return;
  }
  if(!c){
    if(!isOffer){
      if(d.type==="ice"){
        const key=d.from+"|"+d.cid;
        if(ZS.pendingSignals.size>600)ZS.pendingSignals.clear();
        const queue=ZS.pendingSignals.get(key)||[];
        if(queue.length<64)queue.push(data);
        ZS.pendingSignals.set(key,queue);
      }
      return;
    }
    if(imCaller(d.from,d.fromAdmin||d.fromPresenter))return;
    c=makePeer(d.from,d.fromName,d.fromAdmin,d.fromSid,d.cid,false,d.fromPresenter);
    const key=d.from+"|"+d.cid;
    c.pending.push(...(ZS.pendingSignals.get(key)||[]));ZS.pendingSignals.delete(key);
  }
  if(d.fromName)c.name=d.fromName;
  if(d.fromAdmin)c.isAdmin=true;
  c.q=c.q.then(()=>handleSignal(c,d,data)).catch(()=>{});
}

function connectToPresentPeers(){
  if(useSFU())return;
  if(!ZS.joined||!ZS.sigReady||!st.user||!db)return;
  const now=Date.now();
  ZS.peers.forEach((c,uid)=>{
    const p=ZS.presence?.[uid];
    const gone=(!p||now-(p.lastSeen||0)>90000)&&now-c.born>15000;
    const newSess=p&&p.sid&&c.sid&&p.sid!==c.sid;
    const stuck=c.caller&&c.pc.connectionState!=="connected"&&now-c.born>20000;
    if(gone||newSess||stuck)closePeer(uid);
  });
  Object.values(ZS.presence||{}).forEach(p=>{
    if(!p.uid||p.uid===st.user.uid||!p.sid||p.roomId!==ZS.roomId||now-(p.lastSeen||0)>90000)return;
    if(!imCaller(p.uid,teachingPeer(p)))return;
    const c=ZS.peers.get(p.uid);
    if(c){if(p.name)c.name=p.name;c.isAdmin=!!p.isAdmin;c.isPresenter=!!p.isPresenter;return}
    makePeer(p.uid,p.name,p.isAdmin,p.sid,newId(),true,p.isPresenter);
  });
}

function startRtcSignalingSub(){
  if(!db||!st.user)return;
  try{ZS.rtcUnsub?.()}catch(e){}
  ZS.rtcUnsub=onSnapshot(query(collection(db,"zoom_rtc"),where("to","==",st.user.uid),where("roomId","==",ZS.roomId),limit(500)),snap=>{
    const adds=snap.docChanges().filter(x=>x.type==="added").map(x=>({id:x.doc.id,ref:x.doc.ref,d:x.doc.data()})).sort((a,b)=>(a.d.ts||0)-(b.d.ts||0));
    adds.forEach(({id,ref,d})=>{
      if(ZS.seenSignals.has(id))return;
      ZS.seenSignals.add(id);
      if(ZS.seenSignals.size>2000)ZS.seenSignals=new Set([id]);
      deleteDoc(ref).catch(()=>{});
      if(!d||!d.from||d.from===st.user.uid)return;
      if(d.toSid!==ZS.sid)return;
      if(d.roomId!==ZS.roomId||Date.now()-(d.ts||0)>120000)return;
      routeSignal(d);
    });
  },err=>{console.error(err);toast("⚠️ "+A("تعذرت قراءة إشارات الاتصال: ","Signaling read failed: ")+(err.code||""))});
}

function applyRemoteStageData(d){
  if(!d||!inRoom()||String(d.roomId||"")!==String(st.zoom?.ts||""))return;
  if(d.senderUid===st.user?.uid)return;
  if((d.ts||0)<lastRemoteStageTs)return;
  lastRemoteStageTs=d.ts||Date.now();
  ZS.stageSender=d.senderUid||"";
  const hasVisual=!!(d.screenActive||d.sharedType||d.sharedImg||d.sharedVid||d.pageDataUrl||d.liveFrameUrl);
  if(d.senderUid){
    st.stageOwner={
      name:d.senderName||(d.senderIsAdmin?A("الإدارة","Host"):A("مسؤول المحاضرة","Presenter")),
      uid:d.senderUid,
      isAdmin:!!d.senderIsAdmin,
      active:hasVisual,
      ts:d.ts||Date.now()
    };
  }
  ZS.sharedType=d.sharedType||"";
  ZS.sharedImg=d.sharedImg||"";
  ZS.pageDataUrl=d.pageDataUrl||"";
  if(d.liveFrameUrl)ZS.liveFrameUrl=d.liveFrameUrl;
  ZS.sharedVid=d.sharedVid||"";
  ZS.sharedUrl=d.sharedUrl||"";
  ZS.pdfPage=d.pdfPage||1;
  ZS.pdfNumPages=d.pdfNumPages||1;
  ZS.slides=Array.isArray(d.slides)?d.slides:[];
  ZS.slideIdx=d.slideIdx||1;
  ZS.textContent=d.textContent||"";
  ZS.screenActive=d.screenActive?1:0;
  if(ZS.sharedType||ZS.screenActive||ZS.liveFrameUrl)ZS.audioOnly=0;
}

function inRoom(){return !!st.user&&!!st.zoom&&(canPresent()||st.zok==st.zoom.ts)}
function joinRoom(){
  if(ZS.joined||!db||!st.user||!inRoom())return;
  ZS.roomId=String(st.zoom.ts);ZS.enteredAt=Date.now();ZS.msgs=[];ZS.chatSeen.clear();

  else connectSfu().catch(e=>toast("⚠️ "+e.message));
  ZS.sigReady=1;
  touchPresence(true);

function startZoomRealtimeSubs(){
  if(!db||zoomSubStarted||!inRoom()||route()!=="zoom-alnoor")return;
  zoomSubStarted=true;
  const roomId=String(st.zoom.ts);

  ZS.roomUnsubs.push(sub(query(collection(db,"zoom_hands"),where("roomId","==",roomId)),s=>{
    const map={};
    s.docs.forEach(d=>{const x=d.data();if(x.raised)map[d.id]={uid:d.id,...x}});
    ZS.hands=map;
  },"zoom_hands"));

  if(!useSFU())ZS.roomUnsubs.push(sub(query(collection(db,"zoom_presence"),where("roomId","==",roomId)),s=>{
    const now=Date.now(),map={};
    let latestPresenterStage=null;
    s.docs.forEach(d=>{
      const x=d.data();
      if(x.active&&now-(x.lastSeen||0)<90000){
        map[d.id]={uid:d.id,...x};
        if(d.id!==st.user?.uid&&x.stagePayload&&(x.isPresenter||x.isAdmin)){
          try{
            const parsed=JSON.parse(x.stagePayload);
            if(parsed&&(!latestPresenterStage||(parsed.ts||0)>(latestPresenterStage.ts||0))){
              latestPresenterStage=parsed;
            }
          }catch(e){}
        }
      }
    });
    const sig=Object.values(map).map(p=>p.uid+":"+(p.cam?1:0)+":"+(p.isPresenter?1:0)+":"+(p.sharing?1:0)+":"+(p.name||"")).sort().join("|");
    ZS.presChanged=sig!==ZS.presSig?1:0;
    ZS.presSig=sig;
    ZS.presence=map;
    if(latestPresenterStage&&(latestPresenterStage.ts||0)>lastRemoteStageTs){
      applyRemoteStageData(latestPresenterStage);
      ZS.presChanged=1;
    }
    connectToPresentPeers();
  },"zoom_presence"));

  ZS.roomUnsubs.push(sub(doc(db,"site","zoom_ctrl"),s=>{
    if(s.exists()){
      const d=s.data();
      const prevAllow=ZS.roomCtrl.allowMic;
      ZS.roomCtrl={allowMic:d.allowMic!==false?1:0};
      if(prevAllow!==ZS.roomCtrl.allowMic&&!canPresent()){
        if(!ZS.roomCtrl.allowMic&&ZS.micStream){
          ZS.mic=0;
          ZS.micStream.getAudioTracks().forEach(t=>{t.enabled=false});
          syncTracksToPeers();
          syncSfuPermissions();
          toast("🔇");
        }
      }
    }
  },"zoom_ctrl"));

  ZS.roomUnsubs.push(sub(doc(db,"site","zoom_stage"),s=>{
    const sg=x=>x?x.length+":"+x.slice(100,140)+x.slice(-40):"";
    if(!s.exists()){
      ZS.sharedType="";ZS.sharedImg="";ZS.pageDataUrl="";ZS.liveFrameUrl="";ZS.sharedVid="";ZS.sharedUrl="";
      ZS.slides=[];ZS.slideIdx=1;ZS.textContent="";ZS.screenActive=0;
      st.stageOwner={name:"",uid:"",isAdmin:false,active:false,ts:0};
      ZS.stageSig="";ZS.stageDraw=1;
      return;
    }
    const d=s.data();
    if(String(d.roomId||"")!==roomId){ZS.stageDraw=0;return}
    const sig=[d.sharedType,sg(d.sharedImg),sg(d.pageDataUrl),d.pdfPage,d.pdfNumPages,d.slideIdx,(d.slides||[]).length,(d.textContent||"").length,!!d.screenActive,!!d.liveFrameUrl,!!d.sharedVid,d.senderUid||""].join("~");
    const firstTime=ZS.stageSig===undefined;
    const changed=sig!==ZS.stageSig;
    ZS.stageSig=sig;
    applyRemoteStageData(d);
    if(!changed&&d.liveFrameUrl){const img=$("z-live-frame-img");if(img)img.src=d.liveFrameUrl}
    ZS.stageDraw=(changed||firstTime||d.senderUid!==st.user?.uid)?1:0;
  },"zoom_stage"));

  ZS.roomUnsubs.push(sub(query(collection(db,"zoom_reactions"),where("roomId","==",roomId)),s=>{
    const now=Date.now();
    const list=L(s).filter(r=>r.ts&&(now-r.ts<12000)).sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-8);
    ZS.reactions=list;
  },"zoom_reactions"));

  ZS.roomUnsubs.push(sub(doc(db,"site","zoom_co_presenters"),s=>{
    const d=s.exists()?s.data():{};
    if(d.roomId&&String(d.roomId)!==roomId){st.coPresenters=[];return}
    st.coPresenters=Array.isArray(d.names)?d.names.filter(Boolean).slice(0,3):[];
  },"zoom_stage"));

  ZS.roomUnsubs.push(sub(doc(db,"site","zoom_stage_owner"),s=>{
    const d=s.exists()?s.data():{};
    if(d.roomId&&String(d.roomId)!==roomId){st.stageOwner={name:"",uid:"",isAdmin:false,active:false,ts:0};return}
    st.stageOwner=d.active?d:{name:"",uid:"",isAdmin:false,active:false,ts:0};
    ZS.stageDraw=1;
  },"zoom_stage"));
}

function stopAudioMeter(){
  if(ZS.meterRaf){cancelAnimationFrame(ZS.meterRaf);ZS.meterRaf=0}
  if(ZS.audioCtx){try{ZS.audioCtx.close()}catch(e){}ZS.audioCtx=null;ZS.analyser=null}
}
function startAudioMeter(stream){
  stopAudioMeter();
  if(!stream||!stream.getAudioTracks().length)return;
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    if(ctx.state==="suspended")ctx.resume().catch(()=>{});
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();
    analyser.fftSize=256;
    src.connect(analyser);
    ZS.audioCtx=ctx;ZS.analyser=analyser;
    const data=new Uint8Array(analyser.frequencyBinCount);
    const tick=()=>{
      if(!ZS.analyser){const b=$("z-mic-bar");if(b)b.style.width="0%";return}
      ZS.analyser.getByteFrequencyData(data);
      let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
      const avg=Math.min(100,Math.round((sum/data.length)*1.8));
      const bar=$("z-mic-bar");
      if(bar)bar.style.width=(ZS.mic?avg:0)+"%";
      ZS.meterRaf=requestAnimationFrame(tick);
    };
    ZS.meterRaf=requestAnimationFrame(tick);
  }catch(e){}
}

function attachMediaElements(){
  const zv=$("zv");
  if(zv){
    zv.srcObject=(ZS.cam&&ZS.cam1&&!ZS.audioOnly)?ZS.cam:null;
    zv.muted=true;
    zv.play?.().catch(()=>{});
  }
  const zsv=$("zsv");
  if(zsv){
    zsv.srcObject=ZS.scr||null;
    zsv.muted=true;
    if(ZS.scr)zsv.play?.().catch(()=>{});
  }
  const slot=$("z-vid-slot");
  if(slot&&ZS.vidEl&&ZS.vidEl.parentNode!==slot)slot.appendChild(ZS.vidEl);
  if(!st.adm){
    const zvv=$("z-shared-vid");
    if(zvv){zvv.muted=!ZS.speaker;zvv.play?.().catch(()=>{})}
  }
  const rs=$("z-remote-screen-vid"),hs=hostScreenStream();
  if(rs&&hs){
    if(rs.srcObject!==hs)rs.srcObject=hs;
    rs.muted=true;
    rs.play?.().catch(()=>{});
  }
  document.querySelectorAll("[data-peer-cam]").forEach(el=>{
    const s=ZS.remoteStreams.get(el.dataset.peerCam)?.streams?.cam;
    if(s){el.srcObject=s;el.muted=true;el.play?.().catch(()=>{})}
  });
  syncAudioElements();
  if(ZS.sharedType==="pdf"&&ZS.pdfDoc){
    renderPdfPageToCanvas(ZS.pdfPage,false);
  }
  paintAnnOverlay();
  paintAnnBoard();
  updateAnnLaserDot();
  applyAnnBoardGeometry();
  bindLiveAnnotationInteractions();
}
