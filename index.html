<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة النور</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6F5FF;--card:#FBFEFF;--tx:#0E1620;--tx2:#46586B;--ink:#0E1620;--teal:#1E6FD9;--tealS:#D3E9FF;--red:#F0432E;--redS:#FFD6CC;--sun:#56C8FF;--dsp:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0C131B;--card:#16212C;--tx:#E4F3FF;--tx2:#9DB4C8;--ink:#E4F3FF;--tealS:#123556;--redS:#4A1F18}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1.4px,transparent 1.6px);background-size:24px 24px;color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6;transition:background-color .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sun);border-bottom:3px solid #17140D;color:#17140D;--ink:#17140D;--card:#FFFDF6;--tx:#17140D}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:1100px;margin:auto}
.brand{display:flex;align-items:center;gap:8px;font:400 24px var(--dsp);margin-inline-end:auto;cursor:pointer}
.logo{width:34px;height:34px;border:3px solid #17140D;background:#fff;border-radius:10px;transform:rotate(-8deg);display:grid;place-items:center;color:var(--red);font-size:20px}
.ib,nav a{border:2px solid var(--ink);background:var(--card);color:var(--tx);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:6px 12px;font-size:14px;text-decoration:none}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;max-width:1100px;margin:auto}nav a{flex:none}
nav a.on{background:var(--ink);color:var(--sun)}
main{padding:18px max(14px,calc((100% - 1100px)/2)) 40px;min-height:80svh}
h1,h2,h3{font-family:var(--dsp);font-weight:400;margin:0 0 8px}h1{font-size:clamp(34px,7vw,58px);line-height:1.1}h2{font-size:26px;margin-top:26px}h3{font-size:22px}
.sub{color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:16px;box-shadow:6px 6px 0 var(--ink)}
.meta{color:var(--tx2);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.btn{border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:8px 16px;background:var(--red);color:#fff;font-weight:700}
.btn.t{background:var(--teal)}.btn.g{background:var(--card);color:var(--tx)}.btn:disabled{opacity:.55}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--sun);color:#17140D}.tag.r{background:var(--red);color:#fff}
.price{font-weight:700;color:var(--red)}.ig{color:var(--red);font-weight:700;text-decoration:none;unicode-bidi:isolate}
.ig-wrap{display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.hero{background:var(--sun);border:3px solid var(--ink);border-radius:26px;box-shadow:9px 9px 0 var(--ink);color:#17140D;padding:26px 22px;margin-bottom:18px}
.hero .sub{color:#3d3412}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stats div{background:#fff;border:2.5px solid #17140D;border-radius:12px;padding:6px 16px}.stats b{display:block;font:400 30px var(--dsp);color:var(--red)}
label{display:block;font-size:13px;color:var(--tx2)}
input,select,textarea{background:var(--card);border:2.5px solid var(--ink);border-radius:10px;padding:8px;min-width:0}label input{width:100%;margin:2px 0 8px}textarea{width:100%;min-height:90px}
.fld{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row input{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:start;border-bottom:2px solid var(--ink)}th{background:var(--sun);color:#17140D;font:400 16px var(--dsp)}.scroll{overflow-x:auto}
.av{width:104px;height:104px;object-fit:cover;background:var(--sun);color:#17140D;display:grid;place-items:center;font-size:14px;border:3px solid var(--ink);border-radius:38% 62% 55% 45%/48% 42% 58% 52%;box-shadow:4px 4px 0 var(--ink);margin:auto;overflow:hidden}
.crop-box{margin:10px auto;padding:12px;border:2px dashed var(--ink);border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,transparent);text-align:start}
.crop-stage{position:relative;width:150px;height:150px;margin:8px auto;border:3px solid var(--ink);border-radius:38% 62% 55% 45%/48% 42% 58% 52%;overflow:hidden;background:#0e1620;touch-action:none;user-select:none;cursor:grab}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;top:50%;left:50%;transform-origin:center;max-width:none;pointer-events:none}
.crop-sliders{display:grid;gap:6px;margin-top:8px}
.crop-sliders label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.crop-sliders input[type="range"]{flex:1;padding:0;border:0;background:transparent}
.qr{width:120px;height:120px;background:#fff;padding:6px;border-radius:8px;display:block;margin:8px 0}
.star{background:none;border:0;font-size:28px;color:#B8C4D0;padding:0 2px}.star.on{color:#F5A623}

/* ---------- غرفة ZOOM ALNOOR العصرية ---------- */
.z-wrap{background:#121316;border:3px solid #2a2c33;border-radius:24px;box-shadow:0 14px 36px rgba(0,0,0,.35);color:#f3f4f6;overflow:hidden;position:relative;display:flex;flex-direction:column}
.z-wrap.expanded{position:fixed;inset:0;z-index:50;border-radius:0;border:0;width:100vw;height:100svh;max-height:100svh}
.z-wrap.expanded .z-body{flex:1;min-height:0}

.z-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#1b1d22;border-bottom:1px solid #2b2e36;flex-wrap:wrap}

.z-hands-alert{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:#262111;border-bottom:1px solid #4d3f14;color:#fde68a;font-size:13px;align-items:center}
.z-hand-chip{display:inline-flex;align-items:center;gap:6px;background:#3a3012;border:1px solid #f59e0b;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fef3c7}
.z-body{display:grid;grid-template-columns:1fr;min-height:420px;position:relative}
.z-body.with-side{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:820px){.z-body.with-side{grid-template-columns:1fr}}
.z-stage{position:relative;background:#0d0e11;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;min-height:380px;gap:14px}
.z-stage.audio-only{background:radial-gradient(circle at center,#1f2330 0%,#0d0e11 75%)}
.z-empty{text-align:center;max-width:340px;margin:auto}
.z-empty h3{color:#fff;font-size:20px;margin-bottom:12px}
.z-empty-btn{display:block;width:100%;padding:10px 14px;margin-bottom:8px;border-radius:10px;border:1px solid #3b3f4c;background:#232630;color:#e5e7eb;font-weight:600}
.z-empty-btn:hover{background:#2d313e}
.z-media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;width:100%}
.z-tile{position:relative;background:#1a1c23;border:1.5px solid #2e323d;border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.z-tile.main-share{grid-column:1/-1;min-height:280px;aspect-ratio:auto}
.z-tile video,.z-tile img{width:100%;height:100%;max-height:62svh;object-fit:contain;background:#090a0d}
.z-tile.cam-tile video{object-fit:cover}
.z-doc-box{width:100%;display:flex;flex-direction:column;gap:10px;padding:14px}
.z-pdf-wrap{width:100%;max-height:58svh;overflow:auto;background:#111318;border:1px solid #383c49;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center}
#z-pdf-canvas{max-width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.z-slide-card{width:100%;min-height:280px;background:linear-gradient(145deg,#1b1f2b,#12151e);border:1px solid #363c4d;border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.z-slide-lines{max-width:720px;width:100%;text-align:start;background:rgba(10,12,18,.65);border:1px solid #2d3344;border-radius:12px;padding:14px 16px;white-space:pre-wrap;font-size:15px;line-height:1.75;color:#f1f5f9;max-height:36svh;overflow-y:auto}
.z-avatar-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px}
.z-avatar-circle{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#1e6fd9);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.z-tag-lbl{position:absolute;bottom:8px;inset-inline-start:10px;background:rgba(15,17,22,.78);backdrop-filter:blur(6px);padding:3px 10px;border-radius:999px;font-size:12px;color:#f9fafb;border:1px solid rgba(255,255,255,.12)}
.z-meter{display:inline-flex;align-items:center;gap:6px;background:#1f222b;border:1px solid #343844;border-radius:999px;padding:4px 10px;font-size:12px}
.z-bar{width:64px;height:6px;background:#323642;border-radius:999px;overflow:hidden}
.z-bar>i{display:block;height:100%;width:0%;background:#22c55e;transition:width .08s linear}
.z-reactions-stack{position:absolute;top:14px;inset-inline-end:14px;display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none}
.z-reaction-pop{background:rgba(24,27,36,.94);border:1px solid #525a70;border-radius:999px;padding:6px 14px;font-size:16px;color:#fff;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.45)}

/* القوائم المنبثقة فوق الشريط السفلي */
.z-popover{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);width:min(360px,92vw);background:#1e2028;border:1px solid #383c49;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.55);padding:10px;z-index:8;color:#f3f4f6}
.z-pop-handle{width:34px;height:4px;border-radius:999px;background:#4b5061;margin:0 auto 10px}
.z-pop-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#f3f4f6;text-align:start;font-size:14px}
.z-pop-item:hover{background:#2a2d38}
.z-pop-item small{display:block;color:#9ca3af;font-size:11px}
.z-switch{width:38px;height:20px;border-radius:999px;background:#3f4454;position:relative;flex:none}
.z-switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.z-switch.on{background:#6366f1}.z-switch.on::after{transform:translateX(18px)}
.z-react-row{display:flex;align-items:center;justify-content:space-around;gap:6px;padding:4px 2px}
.z-react-btn{background:transparent;border:0;font-size:26px;padding:4px;border-radius:10px;transition:transform .15s}
.z-react-btn:hover{transform:scale(1.2);background:rgba(255,255,255,.08)}

/* الشريط الجانبي (دردشة / مشاركون) */
.z-side{background:#181a20;border-inline-start:1px solid #2b2e36;display:flex;flex-direction:column;max-height:480px}
.z-wrap.expanded .z-side{max-height:none}
.z-side-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #2b2e36;font-weight:700;font-size:14px}
.z-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.z-msg{background:#232630;border-radius:12px;padding:8px 10px;font-size:13px}
.z-msg.admin-msg{border-inline-start:3px solid #38bdf8}
.z-msg b{display:block;color:#93c5fd;font-size:12px;margin-bottom:2px}
.z-chat-form{display:flex;gap:6px;padding:10px;border-top:1px solid #2b2e36;background:#15171c}
.z-chat-form input{flex:1;background:#242731;border:1px solid #3a3e4b;color:#fff;border-radius:10px;padding:7px 10px;font-size:13px}

/* شريط الأدوات السفلي العصري */
.z-dock{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;background:#191b20;border-top:1px solid #2a2d36;flex-wrap:wrap;overflow-x:auto}
.z-divider{width:1px;height:28px;background:#323642;margin:0 4px}
.z-btn{min-width:44px;height:42px;padding:0 10px;border-radius:11px;border:1px solid transparent;background:#252832;color:#f3f4f6;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:600;transition:background .15s,transform .12s}
.z-btn:hover{background:#323644}
.z-btn.on{background:#3b3f54;border-color:#818cf8;color:#c7d2fe}
.z-btn.off{background:#7f1d1d;border-color:#ef4444;color:#fecaca}
.z-btn.hang{background:#be123c;border-color:#f43f5e;color:#fff;padding:0 14px;border-radius:12px}
.z-btn.hang:hover{background:#9f1239}
.z-caption-bar{padding:8px 14px;background:#1e212b;border-top:1px solid #2e3240;font-size:13px;color:#e5e7eb;text-align:center}

.nl{min-height:70svh;display:grid;place-items:center}.nlc{width:100%;max-width:400px;background:#121212;border:3px solid var(--sun);border-radius:18px;box-shadow:8px 8px 0 var(--red);padding:2rem;color:#fff;text-align:center}
.nlc p{color:#9a9a9a;font-size:.9rem;margin:0 0 14px}.nlc input{width:100%;background:#000;color:#fff;border:1px solid #333;margin-bottom:10px}
.nlb{width:100%;padding:.7rem;border-radius:8px;border:1px solid #333;background:transparent;color:#fff;font-weight:500;margin-bottom:8px}.nlb.main{background:var(--sun);color:#0E1620;border:0;font-weight:700}
details{margin-top:16px;color:#9a9a9a}summary{cursor:pointer;margin-bottom:10px}
.at{max-width:760px;display:grid;gap:12px}.atb{display:flex;gap:6px;flex-wrap:wrap;padding:5px;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.atb button{border:0;background:none;padding:8px 14px;border-radius:11px;font-weight:700;font-size:14px}.atb button.on{background:var(--ink);color:var(--sun)}
.atc{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:center;padding:16px 16px 22px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;min-height:200px}
.atm{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;border:2px solid var(--ink)}.atm img,.atm video{width:100%;height:100%;object-fit:cover;display:block}.atm2{position:absolute;bottom:8px;inset-inline-end:8px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;padding:4px 10px}
.atx h2{margin:0 0 8px;font-size:30px}.atx p{margin:0;color:var(--tx2);white-space:pre-wrap;font-size:16px;line-height:1.7}
.atg{position:absolute;left:0;right:0;bottom:0;height:6px;background:color-mix(in srgb,var(--ink) 12%,transparent)}.atg b{display:block;height:100%;width:0;background:var(--red)}
.warn{background:var(--redS);border:2.5px solid var(--red);border-radius:12px;padding:10px 14px;margin-bottom:14px}
footer{background:var(--ink);color:var(--bg);text-align:center;padding:18px 14px;font-size:14px}footer a{color:var(--sun);font-weight:700;text-decoration:none}
#toast{position:fixed;inset-inline:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:440px;margin:auto;background:#17140D;color:var(--sun);border:2px solid var(--sun);border-radius:12px;padding:10px 16px;text-align:center;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand" data-a="home"><span class="logo">✚</span><span id="bn"></span></div>
<button type="button" class="ib" id="lg" data-a="lang"></button><button type="button" class="ib" id="theme" data-a="theme" aria-label="theme">🌙</button><button type="button" class="ib" id="lo" data-a="out"></button></div><nav id="nav"></nav></header>
<main id="app"></main>
<footer><div id="ft"></div><div>Instagram: <a href="https://instagram.com/alnoor_course" target="_blank" rel="noopener">@alnoor_course</a></div></footer>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,addDoc,updateDoc,deleteDoc,deleteField,query,where,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,setPersistence,browserLocalPersistence,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ============ مفاتيح مشروع Alnoor Course في Firebase ============ */
const firebaseConfig={
  apiKey:"AIzaSyASdbQXmDmCaJ_t1ubrrm0ZnYJp1QwAKtE",
  authDomain:"alnoor-course.firebaseapp.com",
  projectId:"alnoor-course",
  storageBucket:"alnoor-course.firebasestorage.app",
  messagingSenderId:"146848688690",
  appId:"1:146848688690:web:ba4550114efde495f56a2b",
  measurementId:"G-9E6Z1EHYTE"
};
const ADMIN_EMAIL="alnoorcourse0@gmail.com";
/* ================================================================================================ */

const ZQ={"2160":[3840,2160],"1080":[1920,1080],"720":[1280,720],"480":[854,480]};
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const st={lang:ls("lang")||"ar",user:null,adm:false,ready:false,regMode:false,me:{},regs:{},items:[],ads:[],team:[],lecs:[],revs:[],about:"",zoom:null,seeded:null,metaSrv:false,all:[],studs:[],filt:"",rs:0,fc:"",zok:0,crops:{}};
const A=(a,e)=>st.lang=="ar"?a:e,L=s=>s.docs.map(d=>({id:d.id,...d.data()}));
let AT=0,AI=0,un=[];

const ok=!/^PASTE/.test(firebaseConfig.apiKey);let db,auth,pers;
if(ok){const app=initializeApp(firebaseConfig);
  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  auth=getAuth(app);pers=setPersistence(auth,browserLocalPersistence)}

function applyTheme(mode){
  const isDark=mode==="dark";
  document.documentElement.setAttribute("data-theme",isDark?"dark":"light");
  ls("theme",isDark?"dark":"light");
  const btn=$("theme");
  if(btn){
    btn.textContent=isDark?"☀️":"🌙";
    btn.title=isDark?A("تفتيح (نهار)","Light mode"):A("تعتيم (ليل)","Dark mode");
  }
}
function initTheme(){
  const saved=ls("theme");
  if(saved==="dark"||saved==="light")return applyTheme(saved);
  if(ls("dark")==="1")return applyTheme("dark");
  if(ls("dark")==="0")return applyTheme("light");
  applyTheme(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");

function compressToDataUrl(file,maxW,maxH,maxLen){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type)||/svg/.test(file.type))return rej(new Error(A("اختر صورة صحيحة","Choose a valid image")));
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,maxW/w,maxH/h);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const c=document.createElement("canvas");let q=.92,out="";
    (function step(){c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);out=c.toDataURL("image/jpeg",q);
      if(out.length<=maxLen||q<=.35){if(out.length>maxLen&&w>480){w=Math.round(w*.8);h=Math.round(h*.8);q=.75;step()}else{URL.revokeObjectURL(u);res(out)}}else{q-=.08;step()}})()};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error(A("تعذر قراءة الصورة","Cannot read image")))};im.src=u})}

function readVideoDataUrl(file,maxLen=720000){return new Promise((res,rej)=>{
  if(!file||!/^video\//.test(file.type))return rej(new Error(A("اختر ملف فيديو صحيحاً","Choose a valid video file")));
  const r=new FileReader();
  r.onload=()=>{const out=String(r.result||"");if(out.length>maxLen)return rej(new Error(A("حجم الفيديو كبير جداً للحفظ المباشر","Video too large for direct save")));res(out)};
  r.onerror=()=>rej(new Error(A("تعذر قراءة الفيديو","Cannot read video")));
  r.readAsDataURL(file);
})}

function renderCroppedAvatar(cr,outSize=260){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=outSize;c.height=outSize;const ctx=c.getContext("2d");const stagePx=150,ratio=outSize/stagePx;const baseScale=Math.max(stagePx/im.width,stagePx/im.height);const totalScale=baseScale*(cr.zoom||1)*ratio;const drawW=im.width*totalScale,drawH=im.height*totalScale;ctx.drawImage(im,(outSize-drawW)/2+(cr.x||0)*ratio,(outSize-drawH)/2+(cr.y||0)*ratio,drawW,drawH);let q=.84,out=c.toDataURL("image/jpeg",q);while(out.length>220000&&q>.4){q-=.1;out=c.toDataURL("image/jpeg",q)}res(out)};im.onerror=()=>rej(new Error(A("تعذر قص الصورة","Failed to crop image")));im.src=cr.src})}

function qr(seed){let s="",h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;for(let y=0;y<11;y++)for(let x=0;x<11;x++){const f=(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);h=(h*1103515245+12345)>>>0;if(f||(h>>16)&1)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return`<svg class="qr" viewBox="0 0 11 11" fill="#000" role="img" aria-label="QR">${s}</svg>`}

async function renderPdfPageToCanvas(pageNum){
  const canvas=$("z-pdf-canvas");
  if(!canvas||!ZS.pdfDoc||ZS.pdfRendering)return;
  ZS.pdfRendering=true;
  try{
    const safePage=Math.max(1,Math.min(ZS.pdfNumPages||1,pageNum||1));
    ZS.pdfPage=safePage;
    const page=await ZS.pdfDoc.getPage(safePage);
    const container=$("z-pdf-wrap");
    const maxW=container?Math.max(320,container.clientWidth-28):760;
    const unscaled=page.getViewport({scale:1});
    const scale=Math.min(2.2,Math.max(0.8,maxW/unscaled.width));
    const viewport=page.getViewport({scale});
    const ctx=canvas.getContext("2d");
    canvas.width=Math.round(viewport.width);
    canvas.height=Math.round(viewport.height);
    await page.render({canvasContext:ctx,viewport}).promise;
    const lbl=$("z-pdf-page-lbl");
    if(lbl)lbl.textContent=`${A("صفحة","Page")} ${ZS.pdfPage} / ${ZS.pdfNumPages}`;
  }catch(e){
    console.error(e);
  }finally{
    ZS.pdfRendering=false;
  }
}

async function parsePptxSlides(file){
  const JSZip=await loadJsZip();
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const slideFiles=Object.keys(zip.files)
    .filter(n=>/^ppt\/slides\/slide\d+\.xml$/i.test(n))
    .sort((a,b)=>{
      const na=parseInt((a.match(/slide(\d+)\.xml/i)||[])[1]||"0",10);
      const nb=parseInt((b.match(/slide(\d+)\.xml/i)||[])[1]||"0",10);
      return na-nb;
    });
  if(!slideFiles.length)return[];
  const parser=new DOMParser();
  const slides=[];
  for(let i=0;i<slideFiles.length;i++){
    const xmlStr=await zip.files[slideFiles[i]].async("string");
    const xmlDoc=parser.parseFromString(xmlStr,"application/xml");
    const paragraphs=[...xmlDoc.getElementsByTagNameNS("*","p")];
    const lines=paragraphs.map(p=>{
      const runs=[...p.getElementsByTagNameNS("*","t")].map(t=>t.textContent||"").join("");
      return runs.trim();
    }).filter(Boolean);
    slides.push({
      index:i+1,
      text:lines.length?lines.join("\n"):A("شريحة تحتوي على عناصر بصرية/رسومية — استخدم مشاركة الشاشة لعرضها كاملة.","Slide contains visual/graphic elements — use screen share to view full visual layout.")
    });
  }
  return slides;
}

function stopAudioMeter(){
  if(ZS.meterRaf){cancelAnimationFrame(ZS.meterRaf);ZS.meterRaf=0}
  if(ZS.audioCtx){try{ZS.audioCtx.close()}catch(e){}ZS.audioCtx=null;ZS.analyser=null}
}
function startAudioMeter(stream){
  stopAudioMeter();
  if(!stream||!stream.getAudioTracks().length)return;
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    if(ctx.state==="suspended")ctx.resume().catch(()=>{});
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();
    analyser.fftSize=256;
    src.connect(analyser);
    ZS.audioCtx=ctx;ZS.analyser=analyser;
    const data=new Uint8Array(analyser.frequencyBinCount);
    const tick=()=>{
      if(!ZS.analyser){const b=$("z-mic-bar");if(b)b.style.width="0%";return}
      ZS.analyser.getByteFrequencyData(data);
      let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
      const avg=Math.min(100,Math.round((sum/data.length)*1.8));
      const bar=$("z-mic-bar");
      if(bar)bar.style.width=(ZS.mic?avg:0)+"%";
      ZS.meterRaf=requestAnimationFrame(tick);
    };
    ZS.meterRaf=requestAnimationFrame(tick);
  }catch(e){}
}

function attachMediaElements(){
  const zv=$("zv");
  if(zv){
    zv.srcObject=(ZS.cam&&ZS.cam1&&!ZS.audioOnly)?ZS.cam:null;
    zv.muted=true;
    zv.play?.().catch(()=>{});
  }
  const zsv=$("zsv");
  if(zsv){
    const stream=ZS.scr||(ZS.cam&&!ZS.cam1&&ZS.cam.getVideoTracks().length?ZS.cam:null);
    zsv.srcObject=stream||null;
    zsv.muted=!ZS.speaker;
    zsv.volume=ZS.speaker?1:0;
    if(stream)zsv.play?.().catch(()=>{});
  }
  const zvv=$("z-shared-vid");
  if(zvv&&ZS.sharedVid){
    zvv.muted=!ZS.speaker;
    zvv.volume=ZS.speaker?1:0;
    zvv.play?.().catch(()=>{});
  }
  if(ZS.sharedType==="pdf"&&ZS.pdfDoc){
    renderPdfPageToCanvas(ZS.pdfPage);
  }
}

async function ensureMic(){
  if(ZS.micStream&&ZS.micStream.active)return ZS.micStream;
  const s=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000},
    video:false
  });
  ZS.micStream=s;
  startAudioMeter(s);
  return s;
}
async function ensureCam(){
  if(ZS.cam&&ZS.cam.active)return ZS.cam;
  const h=ZS.batterySaver?720:1080,w=ZS.batterySaver?1280:1920,fps=ZS.batterySaver?24:30;
  const s=await navigator.mediaDevices.getUserMedia({
    video:{width:{ideal:w},height:{ideal:h},frameRate:{ideal:fps},facingMode:"user"},
    audio:false
  });
  ZS.cam=s;
  return s;
}

 rv(p,b){const[id,v]=p.split("|");run(()=>updateDoc(doc(db,"reviews",id),{ok:v=="1"}),null,b)},
 csv(){const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"',rows=st.all.filter(r=>!st.filt||r.item==st.filt),c="\ufeff"+"name,phone,email,type,title,price,status,date\n"+rows.map(r=>[r.name,r.phone,r.email,r.kind=="v"?"volunteering":"course",r.title,r.price,r.status||"pending",new Date(r.ts).toISOString()].map(q).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="alnoor-registrations.csv";document.body.appendChild(a);a.click();a.remove()},

 zpickmedia(accept){
  const fi=$("z-media-input");if(!fi)return;
  fi.accept=accept||"*/*";
  fi.onchange=async()=>{
    const file=fi.files?.[0];if(!file)return;
    const realName=String(file.name||A("ملف مرفق","Attached file")).split(/[/\\]/).pop()||A("ملف مرفق","Attached file");
    ZS.menu=null;ZS.audioOnly=0;
    ZS.sharedImg="";ZS.sharedVid="";ZS.sharedUrl=URL.createObjectURL(file);ZS.sharedName=realName;ZS.sharedType="";
    ZS.pdfDoc=null;ZS.pdfNumPages=1;ZS.pdfPage=1;ZS.slides=[];ZS.slideIdx=1;ZS.textContent="";
    try{
      if(/^image\//.test(file.type)){
        ZS.sharedImg=ZS.sharedUrl;
        ZS.sharedType="img";
      }else if(/^video\//.test(file.type)){
        ZS.sharedVid=ZS.sharedUrl;
        ZS.sharedType="video";
      }else if(/pdf/i.test(file.type)||/\.pdf$/i.test(realName)){
        ZS.sharedType="pdf";
        const pdfjs=await loadPdfJs();
        const buf=await file.arrayBuffer();
        ZS.pdfDoc=await pdfjs.getDocument({data:buf}).promise;
        ZS.pdfNumPages=ZS.pdfDoc.numPages||1;
        ZS.pdfPage=1;
      }else if(/\.pptx$/i.test(realName)||/presentationml/i.test(file.type)){
        ZS.sharedType="pptx";
        ZS.slides=await parsePptxSlides(file);
        ZS.slideIdx=1;
      }else if(/\.ppt$/i.test(realName)||/ms-powerpoint/i.test(file.type)){
        ZS.sharedType="pptx";
        ZS.slides=[{index:1,text:A("ملف PowerPoint قديم (.ppt) — يُنصح بتصديره إلى (.pptx) أو PDF لعرض الشرائح تلقائياً، أو استخدام مشاركة الشاشة.","Legacy .ppt file — export to .pptx or PDF for automatic slide rendering, or use screen share.")}];
        ZS.slideIdx=1;
      }else if(/^(text\/|application\/(json|xml|javascript))|\.(txt|csv|md|json|html|log)$/i.test(file.type+" "+realName)){
        ZS.sharedType="text";
        ZS.textContent=(await file.text()).slice(0,12000);
      }else{
        ZS.sharedType="other";
      }
      draw();
      toast("✅ "+A("تم فتح: ","Opened: ")+realName);
    }catch(err){
      console.error(err);
      ZS.sharedType="other";
      draw();
      toast("⚠️ "+A("تعذر عرض محتوى الملف داخلياً، يمكنك فتحه أو تنزيله","Could not render preview inline; open or download file"));
    }
    fi.value="";
  };
  fi.click();
 },
 async zpdfpage(step){
  if(!ZS.pdfDoc)return;
  const next=Math.max(1,Math.min(ZS.pdfNumPages,ZS.pdfPage+(+step||1)));

 async zt(k){
  if(k==="mic"){
    if(!st.adm&&!ZS.roomCtrl.allowMic&&!ZS.mic)return toast("🔇 "+A("قام المحاضر بكتم المايك للجميع","Host muted all microphones"));
    try{

    if(!ZS.cam1){

        await ensureCam();

    }else{
      ZS.cam1=0;
      if(ZS.cam)ZS.cam.getVideoTracks().forEach(t=>{t.enabled=false});
      draw();
      toast(A("تم إطفاء الكاميرا","Camera turned off"));

 },
 zhand(){ZS.hand=ZS.hand?0:1;draw()},
 async zscr(){
  ZS.menu=null;
  if(ZS.scr){
    ZS.scr.getTracks().forEach(t=>t.stop());
    ZS.scr=null;
    draw();
    return;
  }
  if(!navigator.mediaDevices?.getDisplayMedia){
    toast("⚠️ "+A("مشاركة الشاشة غير مدعومة في هذا المتصفح — استخدم مشاركة الملف أو الصورة أو الفيديو","Screen share is not supported on this browser — use file, photo, or video share"));
    return;
  }
  try{
    ZS.audioOnly=0;
    ZS.scr=await navigator.mediaDevices.getDisplayMedia({
      video:{width:{ideal:3840,max:3840},height:{ideal:2160,max:2160},frameRate:{ideal:60,max:60}},
      audio:ZS.shareAudio?{echoCancellation:false,noiseSuppression:false,autoGainControl:false}:false
    });
    const vTrack=ZS.scr.getVideoTracks()[0];
    if(vTrack)vTrack.onended=()=>{ZS.scr=null;draw()};
    draw();
    const stg=vTrack?.getSettings();
    toast("🖥 4K "+(stg?.width&&stg?.height?`(${stg.width}×${stg.height}) `:"")+A("تمت مشاركة الشاشة","Screen shared"));
  }catch(e){toast("⚠️ "+A("تعذر بدء مشاركة الشاشة أو تم إلغاؤها","Screen share cancelled or unavailable"))}
 },
 async zrec(b){
  if(ZS.rec&&ZS.rec.state!=="inactive"){ZS.rec.stop();return}
  try{if(!ZS.mic&&!ZS.cam&&!ZS.scr)await ensureMic()}catch(e){}
  const tracks=[];
  if(ZS.scr)tracks.push(...ZS.scr.getVideoTracks(),...ZS.scr.getAudioTracks());
  else if(ZS.cam&&ZS.cam1)tracks.push(...ZS.cam.getVideoTracks());
  if(ZS.micStream&&ZS.mic)tracks.push(...ZS.micStream.getAudioTracks());
  if(!tracks.length)return toast("⚠️ "+A("فعّل الكاميرا أو الصوت أو الشاشة للتسجيل","Enable camera, audio, or screen to record"));
  const mt=["video/webm;codecs=vp9,opus","video/webm","video/mp4"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mt)return toast("⚠️ "+A("التسجيل غير مدعوم","Recording unsupported"));
  ZS.ch=[];
  const r=new MediaRecorder(new MediaStream(tracks),{mimeType:mt,videoBitsPerSecond:8000000,audioBitsPerSecond:128000});
  ZS.rec=r;
  r.ondataavailable=ev=>ev.data.size&&ZS.ch.push(ev.data);
  r.onstop=()=>{
    ZS.rec=null;
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(ZS.ch,{type:mt}));
    a.download="alnoor-lecture-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+(mt.includes("mp4")?".mp4":".webm");
    document.body.appendChild(a);a.click();a.remove();
    draw();
  };
  r.start(1000);
  draw();
 }
};

const CHG={
  filt(v){st.filt=v;draw()},
  rst(v,e){const[u,i]=e.dataset.p.split("|");run(()=>updateDoc(doc(db,"regs",u),{["list."+i+".status"]:v}),null)},
  async zq(v){
    const q=ZQ[v];if(!q)return;

    if(!target)return toast("✓ "+A("سيتم تطبيق الجودة عند فتح الكاميرا/الشاشة","Quality will apply when media opens"));
    try{
      await target.applyConstraints({width:{ideal:q[0]},height:{ideal:q[1]}});
      const s=target.getSettings();
      zs((s.width||q[0])+"×"+(s.height||q[1]));
      toast("✅ "+A("تم تحديث الجودة","Quality updated"));
    }catch(e){toast("⚠️ "+A("الجودة غير مدعومة بهذا الجهاز","Resolution not supported on this device"))}
  }
};
