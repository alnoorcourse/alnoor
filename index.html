<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة النور</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6F5FF;--card:#FBFEFF;--tx:#0E1620;--tx2:#46586B;--ink:#0E1620;--teal:#1E6FD9;--tealS:#D3E9FF;--red:#F0432E;--redS:#FFD6CC;--sun:#56C8FF;--dsp:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0C131B;--card:#16212C;--tx:#E4F3FF;--tx2:#9DB4C8;--ink:#E4F3FF;--tealS:#123556;--redS:#4A1F18}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1.4px,transparent 1.6px);background-size:24px 24px;color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sun);border-bottom:3px solid #17140D;color:#17140D;--ink:#17140D;--card:#FFFDF6;--tx:#17140D}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:1100px;margin:auto}
.brand{display:flex;align-items:center;gap:8px;font:400 24px var(--dsp);margin-inline-end:auto;cursor:pointer}
.logo{width:34px;height:34px;border:3px solid #17140D;background:#fff;border-radius:10px;transform:rotate(-8deg);display:grid;place-items:center;color:var(--red);font-size:20px}
.ib,nav a{border:2px solid var(--ink);background:var(--card);color:var(--tx);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:6px 12px;font-size:14px;text-decoration:none}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;max-width:1100px;margin:auto}nav a{flex:none}
nav a.on{background:var(--ink);color:var(--sun)}
main{padding:18px max(14px,calc((100% - 1100px)/2)) 40px;min-height:80svh}
h1,h2,h3{font-family:var(--dsp);font-weight:400;margin:0 0 8px}h1{font-size:clamp(34px,7vw,58px);line-height:1.1}h2{font-size:26px;margin-top:26px}h3{font-size:22px}
.sub{color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:16px;box-shadow:6px 6px 0 var(--ink)}
.meta{color:var(--tx2);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.btn{border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:8px 16px;background:var(--red);color:#fff;font-weight:700}
.btn.t{background:var(--teal)}.btn.g{background:var(--card);color:var(--tx)}.btn:disabled{opacity:.55}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--sun);color:#17140D}.tag.r{background:var(--red);color:#fff}
.price{font-weight:700;color:var(--red)}.ig{color:var(--red);font-weight:700;text-decoration:none}
.hero{background:var(--sun);border:3px solid var(--ink);border-radius:26px;box-shadow:9px 9px 0 var(--ink);color:#17140D;padding:26px 22px;margin-bottom:18px}
.hero .sub{color:#3d3412}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stats div{background:#fff;border:2.5px solid #17140D;border-radius:12px;padding:6px 16px}.stats b{display:block;font:400 30px var(--dsp);color:var(--red)}
label{display:block;font-size:13px;color:var(--tx2)}
input,select,textarea{background:var(--card);border:2.5px solid var(--ink);border-radius:10px;padding:8px;min-width:0}label input{width:100%;margin:2px 0 8px}textarea{width:100%;min-height:90px}
.fld{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row input{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:start;border-bottom:2px solid var(--ink)}th{background:var(--sun);color:#17140D;font:400 16px var(--dsp)}.scroll{overflow-x:auto}
.av{width:96px;height:96px;object-fit:cover;background:var(--sun);color:#17140D;display:grid;place-items:center;font-size:14px;border:3px solid var(--ink);border-radius:38% 62% 55% 45%/48% 42% 58% 52%;box-shadow:4px 4px 0 var(--ink);margin:auto}
.qr{width:120px;height:120px;background:#fff;padding:6px;border-radius:8px;display:block;margin:8px 0}
.star{background:none;border:0;font-size:28px;color:#B8C4D0;padding:0 2px}.star.on{color:#F5A623}
.room{background:#17140D;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--red);border-radius:20px;padding:12px;color:#F8EBCB}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.tile{aspect-ratio:4/3;border-radius:12px;background:#241f14;border:2px solid #3a3426;display:grid;place-items:center;position:relative;overflow:hidden}.tile.share{grid-column:1/-1;aspect-ratio:16/9}.tile video{width:100%;height:100%}.tile small{position:absolute;bottom:6px;inset-inline-start:8px;font-size:12px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.ctrl button,.ctrl select{background:#17140D;color:var(--sun);border:2px solid var(--sun);border-radius:10px;padding:8px 12px;font-size:14px}.ctrl button.off{background:var(--red);border-color:var(--red);color:#fff}
.nl{min-height:70svh;display:grid;place-items:center}.nlc{width:100%;max-width:400px;background:#121212;border:3px solid var(--sun);border-radius:18px;box-shadow:8px 8px 0 var(--red);padding:2rem;color:#fff;text-align:center}
.nlc p{color:#9a9a9a;font-size:.9rem;margin:0 0 14px}.nlc input{width:100%;background:#000;color:#fff;border:1px solid #333;margin-bottom:10px}
.nlb{width:100%;padding:.7rem;border-radius:8px;border:1px solid #333;background:transparent;color:#fff;font-weight:500;margin-bottom:8px}.nlb.main{background:var(--sun);color:#0E1620;border:0;font-weight:700}
details{margin-top:16px;color:#9a9a9a}summary{cursor:pointer;margin-bottom:10px}
.at{max-width:760px;display:grid;gap:12px}.atb{display:flex;gap:6px;flex-wrap:wrap;padding:5px;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.atb button{border:0;background:none;padding:8px 14px;border-radius:11px;font-weight:700;font-size:14px}.atb button.on{background:var(--ink);color:var(--sun)}
.atc{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:center;padding:16px 16px 22px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;min-height:200px}
.atm{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;border:2px solid var(--ink)}.atm img,.atm video{width:100%;height:100%;object-fit:cover;display:block}.atm2{position:absolute;bottom:8px;inset-inline-end:8px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;padding:4px 10px}
.atx h2{margin:0 0 8px;font-size:30px}.atx p{margin:0;color:var(--tx2);white-space:pre-wrap;font-size:16px;line-height:1.7}
.atg{position:absolute;left:0;right:0;bottom:0;height:6px;background:color-mix(in srgb,var(--ink) 12%,transparent)}.atg b{display:block;height:100%;width:0;background:var(--red)}
.warn{background:var(--redS);border:2.5px solid var(--red);border-radius:12px;padding:10px 14px;margin-bottom:14px}
footer{background:var(--ink);color:var(--bg);text-align:center;padding:18px 14px;font-size:14px}footer a{color:var(--sun);font-weight:700;text-decoration:none}
#toast{position:fixed;inset-inline:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:440px;margin:auto;background:#17140D;color:var(--sun);border:2px solid var(--sun);border-radius:12px;padding:10px 16px;text-align:center;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand" data-a="home"><span class="logo">✚</span><span id="bn"></span></div>
<button class="ib" id="lg" data-a="lang"></button><button class="ib" id="theme" aria-label="theme">◐</button><button class="ib" id="lo" data-a="out"></button></div><nav id="nav"></nav></header>
<main id="app"></main>
<footer><div id="ft"></div><div>Instagram: <a href="https://instagram.com/alnoor_course" target="_blank" rel="noopener">@alnoor_course</a></div></footer>
<div id="toast" role="status"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,addDoc,updateDoc,deleteDoc,deleteField,query,where,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,setPersistence,browserLocalPersistence,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ============ مفاتيح مشروع Alnoor Course في Firebase ============ */
const firebaseConfig={
  apiKey:"AIzaSyASdbQXmDmCaJ_t1ubrrm0ZnYJp1QwAKtE",
  authDomain:"alnoor-course.firebaseapp.com",
  projectId:"alnoor-course",
  storageBucket:"alnoor-course.firebasestorage.app",
  messagingSenderId:"146848688690",
  appId:"1:146848688690:web:ba4550114efde495f56a2b",
  measurementId:"G-9E6Z1EHYTE"
};
const ADMIN_EMAIL="alnoorcourse0@gmail.com";
/* ================================================================================================ */

const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const st={lang:ls("lang")||"ar",user:null,adm:false,ready:false,regMode:false,me:{},regs:{},items:[],ads:[],team:[],lecs:[],revs:[],about:"",zoom:null,seeded:null,metaSrv:false,all:[],studs:[],filt:"",rs:0,fc:"",zok:0};
const A=(a,e)=>st.lang=="ar"?a:e,L=s=>s.docs.map(d=>({id:d.id,...d.data()}));
let AT=0,AI=0,un=[];

const ok=!/^PASTE/.test(firebaseConfig.apiKey);let db,auth,pers;
if(ok){const app=initializeApp(firebaseConfig);
  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  auth=getAuth(app);pers=setPersistence(auth,browserLocalPersistence)}

const DEF_ABOUT="منصة النور منصة تطوعية وتعليمية تجمع الطلاب في مكان واحد: تطوّع في الحملات، تدرّب في الدورات الوجاهية، وتابع المحاضرات والبث المباشر.";
const DEF_ADS=[{id:"welcome",type:"text",title:"أهلاً بك في منصة النور 🌟",desc:"أنشئ حسابك بالبريد ورمز من 6 أرقام ثم سجل دخولك لتصل إلى ملفك الشخصي والدورات والتطوعات.",ts:1},
{id:"alert",type:"text",title:"تنبيه مهم",desc:"تابع الإعلانات باستمرار، وأكمل اسمك ورقم هاتفك في «لوحتي» قبل التسجيل في أي تطوع أو دورة.",ts:2}];
const DEF_TEAM=["الأول","الثاني","الثالث","الرابع"].map((n,i)=>({id:"f"+(i+1),name:"المؤسس "+n,ig:"alnoor_course",photo:""}));
const ads=()=>st.seeded?st.ads:DEF_ADS,team=()=>st.seeded?st.team:DEF_TEAM,about=()=>st.seeded?st.about:(st.about||DEF_ABOUT);

function toast(m){const e=$("toast");e.textContent=m;e.className="show";clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",2800)}
async function run(f,msg,b){if(!db)return toast("⚠️ "+A("لم يتم ضبط مفاتيح Firebase بعد","Firebase keys are not set"));if(b)b.disabled=true;
  try{await f();toast("✅ "+(msg||A("تم الحفظ بنجاح","Saved successfully")))}catch(e){console.error(e);toast("⚠️ "+A("تعذر التنفيذ: ","Failed: ")+(e.code||e.message))}finally{if(b)b.disabled=false}}
const igC=h=>{h=String(h||"").trim();const m=h.match(/instagram\.com\/([A-Za-z0-9._]+)/i);if(m)h=m[1];return h.replace(/^@/,"").replace(/[^A-Za-z0-9._]/g,"")};
const ig=h=>(h=igC(h))?`<a class="ig" href="https://instagram.com/${h}" target="_blank" rel="noopener">@${h}</a>`:"";
function compressToDataUrl(file,maxW,maxH,maxLen){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type)||/svg/.test(file.type))return rej(new Error(A("اختر صورة صحيحة","Choose a valid image")));
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,maxW/w,maxH/h);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const c=document.createElement("canvas");let q=.82,out="";
    (function step(){c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);out=c.toDataURL("image/jpeg",q);
      if(out.length<=maxLen||q<=.35){if(out.length>maxLen&&w>240){w=Math.round(w*.75);h=Math.round(h*.75);q=.65;step()}else{URL.revokeObjectURL(u);res(out)}}else{q-=.12;step()}})()};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error(A("تعذر قراءة الصورة","Cannot read image")))};im.src=u})}
const fdata=async(c,f)=>{const u=await compressToDataUrl(f,c=="team"?480:720,c=="team"?480:540,c=="team"?220000:320000);return c=="team"?{photo:u}:{src:u,type:"img"}};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function qr(seed){let s="",h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;for(let y=0;y<11;y++)for(let x=0;x<11;x++){const f=(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);h=(h*1103515245+12345)>>>0;if(f||(h>>16)&1)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return`<svg class="qr" viewBox="0 0 11 11" fill="#000" role="img" aria-label="QR">${s}</svg>`}
const none=()=>`<p class="sub">${A("لا يوجد بعد","Nothing yet")}</p>`,route=()=>location.hash.slice(1)||"dashboard",go=r=>location.hash=r;
const tag=s=>`<span class="tag${s=="pending"?" r":""}">${s=="pending"?A("قيد الانتظار","Pending"):s=="ok"?A("مقبول","Accepted"):A("مكتمل","Done")}</span>`;
const price=p=>p>0?`<span class="price">${p} ${A("د.أ","JD")}</span>`:`<span class="tag">${A("مجاني","Free")}</span>`;
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const pin6=v=>/^\d{6}$/.test(String(v||"").trim());

const sub=(q,cb,k)=>onSnapshot(q,s=>{cb(s);rd(k)},e=>{console.error(e);toast("⚠️ "+A("تعذرت المزامنة: ","Sync error: ")+e.code)});
function rd(k){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$("app").contains(a))return;if(route()=="ads"&&k&&k!="ads")return;draw()}
function chkSeed(){if(st.adm&&st.seeded===false&&st.metaSrv&&!st.seeding){st.seeding=1;run(async()=>{const b=writeBatch(db);DEF_ADS.forEach(({id,...d})=>b.set(doc(db,"ads",id),d));DEF_TEAM.forEach(({id,...d})=>b.set(doc(db,"team",id),d));b.set(doc(db,"site","about"),{text:DEF_ABOUT});b.set(doc(db,"site","meta"),{seeded:true});await b.commit()},A("تم تحميل البيانات الأولية","Starter data loaded"))}}
if(ok){
  sub(doc(db,"site","meta"),s=>{st.seeded=s.exists();st.metaSrv=!s.metadata.fromCache;chkSeed()},"x");
  sub(doc(db,"site","about"),s=>st.about=s.exists()?s.data().text||"":"","about");
  sub(doc(db,"site","zoom"),s=>{st.zoom=s.exists()?s.data():null;if(st.zok&&(!st.zoom||st.zok!=st.zoom.ts))st.zok=0},"zoom");
  sub(collection(db,"items"),s=>st.items=L(s),"items");
  sub(collection(db,"ads"),s=>st.ads=L(s).sort((a,b)=>a.ts-b.ts),"ads");
  sub(collection(db,"team"),s=>st.team=L(s),"team");
  sub(collection(db,"lecs"),s=>st.lecs=L(s).sort((a,b)=>a.ts-b.ts),"lecs");
  onAuthStateChanged(auth,u=>{un.forEach(f=>f());un=[];st.user=u;st.adm=!!u&&(u.email||"").toLowerCase()==ADMIN_EMAIL.toLowerCase();st.me={};st.regs={};st.all=[];st.studs=[];st.revs=[];st.ready=true;
    if(u){un.push(sub(doc(db,"students",u.uid),s=>st.me=s.exists()?s.data():{},"me"),sub(doc(db,"regs",u.uid),s=>st.regs=s.exists()?s.data().list||{}:{},"me"));
      if(!st.adm)setDoc(doc(db,"students",u.uid),{email:u.email||"",last:Date.now()},{merge:true}).catch(()=>{});
      un.push(sub(st.adm?collection(db,"reviews"):query(collection(db,"reviews"),where("ok","==",true)),s=>st.revs=L(s).sort((a,b)=>b.ts-a.ts),"revs"));
      if(st.adm){un.push(sub(collection(db,"regs"),s=>{st.all=[];s.docs.forEach(d=>{const x=d.data();Object.entries(x.list||{}).forEach(([k,e])=>st.all.push({uid:d.id,item:k,name:x.name,phone:x.phone,email:x.email,...e}))});st.all.sort((a,b)=>b.ts-a.ts)},"regs"),
        sub(collection(db,"students"),s=>st.studs=L(s).sort((a,b)=>(b.last||0)-(a.last||0)),"studs"));chkSeed()}}
    draw()})
}else{st.ready=true}

const FS=c=>({ads:[["title",A("عنوان الإعلان","Ad title")],["desc",A("شرح الإعلان","Description")]],
 courses:[["t",A("عنوان الدورة","Course title")],["p",A("المكان","Place")],["d",A("التاريخ","Date")],["price",A("السعر (0 = مجاني)","Price (0 = free)"),"number"]],
 vols:[["t",A("عنوان التطوع","Volunteering title")],["p",A("المكان","Place")],["d",A("التاريخ","Date")]],
 lecs:[["title",A("عنوان المحاضرة","Title")],["desc",A("شرح المحاضرة","Description")],["url",A("رابط https:// (اختياري)","https:// link (optional)")]],
 team:[["name",A("الاسم","Name")],["ig",A("حساب الانستغرام (اسم أو رابط)","Instagram (handle or link)")]]})[c];
const colOf=c=>c=="courses"||c=="vols"?"items":c;
const inp=(id,[k,ph,ty],v,fixedKind)=>fixedKind?`<input type="hidden" id="${id}-${k}" value="${fixedKind}">`:`<input id="${id}-${k}" type="${ty||"text"}" ${ty=="number"?'min="0" step="0.5"':""} placeholder="${esc(ph)}" value="${esc(v??"")}">`;
const ef=(c,o,acc)=>`<div class="fld">${FS(c).map(f=>inp(`e-${c}-${o.id}`,f,o[f[0]])).join("")}${acc?`<input id="e-${c}-${o.id}-file" type="file" accept="${acc}">`:""}</div><div class="row"><button class="btn t" data-a="save" data-p="${c}|${o.id}">${A("حفظ","Save")}</button><button class="btn g" data-a="del" data-p="${c}|${o.id}">${A("حذف","Delete")}</button></div>`;
const af=(c,acc,fixedKind)=>`<div class="card"><div class="fld">${FS(c).map(f=>inp(`n-${c}`,f,"",fixedKind&&f[0]=="kind"?fixedKind:null)).join("")}${acc?`<input id="n-${c}-file" type="file" accept="${acc}">`:""}</div><button class="btn t" data-a="add" data-p="${c}">${A("إضافة","Add")}</button></div>`;
const rdF=(id,c)=>{const d={};FS(c).forEach(([k,,ty])=>{let v=$(`${id}-${k}`).value.trim();if(k=="ig")v=igC(v);d[k]=ty=="number"?+v||0:v});if(c=="courses")d.kind="c";if(c=="vols"){d.kind="v";d.price=0}return d};

function vDash(){const u=st.user,m=st.me,r=Object.entries(st.regs),nv=r.filter(x=>x[1].kind=="v").length,f=(k,l)=>`<label>${l}<input id="p_${k}" value="${esc(m[k]??"")}"></label>`;

 zrec(b){if(ZS.rec)return ZS.rec.stop();if(!ZS.cam)return toast(A("ابدأ الكاميرا أولاً","Start camera first"));const tr=(ZS.scr?ZS.scr.getVideoTracks():ZS.cam.getVideoTracks()).concat(ZS.cam.getAudioTracks()),mt=["video/webm;codecs=vp9,opus","video/webm","video/mp4"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
